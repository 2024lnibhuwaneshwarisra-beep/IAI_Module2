 in to your Claude account.<\/div>\n<div id=\"list\"><\/div>\n<p class=\"note\">Replies can vary a little between runs, so if a pass fails by a hair, run it again. System prompts here are sent as instructions placed before your message. Chapter 6 also has a second exercise (6.2) and Chapter 8 a Matterport exercise in the full tutorial sheet; 8.2 here is a class variant.<\/p>\n<\/main>\n<script>\nconst MODEL=\"claude-haiku-5-5\";\nconst liveErr=e=>{try{console.error(e)}catch(_){}const c=e&&e.code;const m={not_granted:'Claude was not allowed. Reload this page and click Allow when the permission box appears.',rate_limited:'Too many runs. Wait a moment, then try again.',not_declared:'This page is not set up for live Claude. Tell your teacher.',capability_disabled:'Live Claude is switched off for this page. Tell your teacher.',capability_removed:'Live Claude was removed from this page. Tell your teacher.',sampling_disabled:'Live Claude is turned off for your account or organisation.',session_expired:'Your session expired. Reload the page.',upstream_error:'Claude is busy. Try again in a moment.',empty_completion:'Claude sent an empty reply. Run it again.',refused:'Claude declined this prompt. Change the wording.',queue_overflow:'Too many requests are waiting. Try again shortly.',cancelled:'Stopped.',invalid_request:'The request was not accepted. Tell your teacher.'}[c];return (m||\"Couldn't reach Claude. Try again.\")+(c?' (code: '+c+')':(e&&e.message?' ('+String(e.message).slice(0,80)+')':''));};\n/* live Claude when available, otherwise paste mode (works in any phone browser) */\nconst HARD=['not_granted','sampling_disabled','capability_disabled','capability_removed','not_declared'];\nlet liveFn=null,liveDone=false,pasteOnly=false;\n(async()=>{try{if(typeof claude!=='undefined'&&claude&&claude.use)liveFn=await claude.use(\"sample\");}catch(e){liveFn=null;}liveDone=true;})();\nconst wait=ms=>new Promise(r=>setTimeout(r,ms));\nconst pasteQ=[];let pasteBusy=false;\nfunctio onst ok=mkb('Use this reply','#ffd84d');const no=mkb('Cancel','transparent');const em=document.createElement('div');em.style.cssText='font-weight:700;min-height:1.2em';\nconst done=()=>{ov.remove();pasteBusy=false;};\nok.onclick=()=>{const t=rt.value.trim();if(!t){em.textContent='Paste the reply first.';return;}done();try{o&&o.onText&&o.onText({text:t,delta:t});}catch(e){}res({text:t,truncated:false});pump();};\nno.onclick=()=>{done();const q=pasteQ.splice(0);rej({code:'cancelled',message:'cancelled'});q.forEach(x=>x.rej({code:'cancelled',message:'cancelled'}));};\nbx.append(h,ex,pt,cp,l2,rt,em,ok,no);ov.appendChild(bx);document.body.appendChild(ov);setTimeout(()=>{try{rt.focus();}catch(e){}},50);}\nasync function getSample(){return async(p,o)=>{\n if(!liveDone)await Promise.race([(async()=>{while(!liveDone)await wait(100);})(),wait(8000)]);\n if(liveFn&&!pasteOnly){try{return await liveFn(p,o);}catch(e){if(HARD.includes(e&&e.code))pasteOnly=true;else throw e;}}\n return pasteAsk(p,o);};}\nconst W=t=>t.trim().split(/\\s+/).filter(Boolean).length;\nconst EM=[\"Hi -- My Mixmaster4000 is producing a strange noise when I operate it. It also smells a bit smoky and plasticky, like burning electronics.  I need a replacement.\",\"Can I use my Mixmaster 4000 to mix paint, or is it only meant for mixing food?\",\"I HAVE BEEN WAITING 4 MONTHS FOR MY MONTHLY CHARGES TO END AFTER CANCELLING!!  WTF IS GOING ON???\",\"How did I get here I am not good with computer.  Halp.\"];\nconst EXP=[\"B\",\"AD\",\"C\",\"D\"];\nconst emails=EM.map(e=>({EMAIL:e}));\nconst MESSY=\"Hia its me i have a q about dogs jkaerjv {{QUESTION}} jklmvca tx it help me muhch much atx fst fst answer short short tx\";\nconst DOC=\"<document>\\nDatasheet excerpt, regulator LM-X1: input voltage 7 to 35 V. Output 5 V, plus or minus 2%, up to 1.5 A. Operating temperature -40 to 85 C.\\n<\/document>\\n\\nWhat is the maximum input voltage and the dropout voltage?\";\nconst CH={\n1:[\"Basic prompt structure\",\"Prompts have roles. A system prompt sets standing rules; the user message is the task.\"],\n2:[\"Being clear and direct\",\"Claude has no context beyond your words. Say what you want, and what you don't want.\"],\n3:[\"Assigning roles\",\"A role changes tone, focus and sometimes accuracy.\"],\n4:[\"Separating data and instructions\",\"Use {{variables}} for data and XML tags to fence it off from your instructions.\"],\n5:[\"Formatting output and speaking for Claude\",\"Tell Claude the exact output shape. In the tutorial you start Claude's reply for it; here you will instruct how it must begin.\"],\n6:[\"Thinking step by step\",\"Let Claude think out loud before it answers. Thinking only counts when it is written out.\"],\n7:[\"Using examples (few-shot)\",\"Show input and output pairs so Claude copies the pattern and format.\"],\n8:[\"Avoiding hallucinations\",\"Give Claude an out, and make it quote evidence before answering.\"],\n9:[\"Complex prompts\",\"Combine role, tags, thinking and output format in one prompt.\"]};\nconst EX=[\n{ch:1,id:\"1.1\",t:\"Counting to three\",task:\"Write a prompt that gets Claude to count to three.\",hint:\"Just ask clearly. The checker looks for 1, 2 and 3.\",u:{text:\"\"},ok:R=>/1/.test(R[0])&&/2/.test(R[0])&&/3/.test(R[0])},\n{ch:1,id:\"1.2\",t:\"System prompt\",task:\"Edit the system prompt so Claude answers like a 3-year-old child.\",hint:\"Ask for it in plain words. The checker looks for 'soo' or 'giggles'.\",s:\"\",u:{text:\"How big is the sky?\",lock:1},ok:R=>/soo|giggles/i.test(R[0])},\n{ch:2,id:\"2.1\",t:\"Spanish\",task:\"Edit the system prompt so Claude answers in Spanish.\",hint:\"Ask for Spanish as you would ask a person. The checker looks for 'hola'.\",s:\"\",u:{text:\"Hello Claude, how are you?\",lock:1},ok:R=>/hola/i.test(R[0])},\n{ch:2,id:\"2.2\",t:\"One player only\",task:\"Edit the question so Claude replies with only the name of one specific player: no other words or punctuation.\",hint:\"How would you ask a person to reply with only the name? Exact match: Michael Jordan.\",u:{text:\"Who is the best basketball player of all time?\"},ok:R=>R[0].trim()===\"Michael Jordan\"},\n{ch:2,id:\"2.3\",t:\"Write a story\",task:\"Edit the prompt so Claude writes a story of 800 words or more.\",hint:\"Models count words poorly, so overshoot. This one can take a while.\",u:{text:\"Can you write me a story?\"},ok:R=>W(R[0])>=800},\n{ch:3,id:\"3.1\",t:\"Math correction\",task:\"Give Claude a role in the system prompt so it notices that the algebra below is wrong.\",hint:\"Pick a role that suits careful maths. The checker looks for 'incorrect' or 'not correct'.\",s:\"\",u:{text:\"Is this equation solved correctly below?\\n\\n2x - 3 = 9\\n2x = 6\\nx = 3\",lock:1},ok:R=>/incorrect|not correct/i.test(R[0])},\n{ch:4,id:\"4.1\",t:\"Haiku topic\",task:\"Write a prompt template using {{TOPIC}} that makes Claude write a haiku about the topic. Test input: Pigs.\",hint:\"Use the exact text {{TOPIC}} where the topic should go.\",tpl:1,u:{text:\"\"},inp:[{TOPIC:\"Pigs\"}],need:c=>c.includes(\"{{TOPIC}}\")?\"\":\"Your template must contain {{TOPIC}}.\",ok:R=>/pig/i.test(R[0])&&R[0].trim().split(\"\\n\").length>=3},\n{ch:4,id:\"4.2\",t:\"Dog question with typos\",task:\"Fix the messy template by adding XML tags around the variable. Change nothing else. Test input: 'ar cn brown?'\",hint:\"What happens if {{QUESTION}} sits inside tags such as <question>\u2026<\/question>? The checker looks for 'brown'.\",tpl:1,u:{text:MESSY},inp:[{QUESTION:\"ar cn brown?\"}],need:c=>/<(\\w+)>[\\s\\S]*\\{\\{QUESTION\\}\\}[\\s\\S]*<\\/\\1>/.test(c)?\"\":\"Wrap {{QUESTION}} in XML tags.\",ok:R=>/brown/i.test(R[0])},\n{ch:4,id:\"4.3\",t:\"Dog question, no tags\",task:\"Fix the same template WITHOUT tags, by deleting only one or two words or pieces of text.\",hint:\"Remove the least sensible bits one at a time. Keep {{QUESTION}}.\",tpl:1,u:{text:MESSY},inp:[{QUESTION:\"ar cn brown?\"}],need:c=>c.includes(\"<\")?\"No tags allowed here.\"
