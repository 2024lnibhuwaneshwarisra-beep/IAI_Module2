ard\" href=\"unit-2-1-complete.html\"><span class=\"n\">2.1+<\/span><span class=\"t\">Introduction (Complete, 3 parts)<\/span><span class=\"d\">The full version of Unit 2.1.<\/span><span class=\"go\">Open \u2192<\/span><\/a>\n<a class=\"card\" href=\"prompt-gym.html\"><span class=\"n\">Gym<\/span><span class=\"t\">Prompt Gym: Prompt Engineering 101<\/span><span class=\"d\">Practice exercises.<\/span><span class=\"go\">Open \u2192<\/span><\/a>\n<\/div>\n<\/main><script>document.addEventListener(\"click\",function(e){var a=e.target.closest&&e.target.closest(\"a[href]\");if(!a)return;var h=a.getAttribute(\"href\");var m=h&&h.match(/^([a-z0-9-]+)\\.html$/i);if(m){e.preventDefault();parent.postMessage({go:m[1]},\"*\");}});<\/script><\/body><\/html>\n", "unit-2-1": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Module 2 \u00b7 Unit 2.1 \u00b7 Introduction to Prompt Engineering<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f2f5ef;--grid:#d5e0d3;--sf:#fff;--ink:#16212b;--mute:#4c5b66;--blue:#1f5fd6;--hi:#ffd84d;--ok:#1f8f5a;--bad:#d23b41;--okbg:#dff3e7;--badbg:#fbe0e1;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10171d;--grid:#1c2830;--sf:#18222a;--ink:#eaf0f3;--mute:#9fb0ba;--blue:#7fb0ff;--ok:#52d196;--bad:#ff7b80;--okbg:#14382a;--badbg:#44191c}}\n:root[data-theme=\"dark\"]{--bg:#10171d;--grid:#1c2830;--sf:#18222a;--ink:#eaf0f3;--mute:#9fb0ba;--blue:#7fb0ff;--ok:#52d196;--bad:#ff7b80;--okbg:#14382a;--badbg:#44191c}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:17px/1.55 \"Atkinson Hyperlegible\",system-ui,sans-serif}\nmain{max-width:860px;margin:0 auto;padding:18px 16px 60px}\nh1,h2,h3{font-family:\"Bricolage Grotesque\",system-ui,sans-serif;line-height:1.1;margin:0}\nh1{font-size:clamp(2rem,6.5vw,3.2rem);font-weight:800;letter-spacing:-.02em}\nh2{font-size:1.45rem;font-weight:800}\n.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}\n.nav span{border:2px solid var(--ink);padding:2px 10px;font-weight:700;font-size:.9rem;background:var(--sf)}\n.nav .on{background:var(--hi);color:#16212b}.nav .off{opacity:.45}\n.sub{color:var(--mute);max-width:62ch;margin:6px 0}\n.cite{font-size:.8rem;color:var(--blue);font-weight:700}\nsection{background:var(--sf);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:18px;margin-top:26px}\n.tag{font-weight:700;color:var(--blue);font-size:.9rem}\nbutton{font:inherit;cursor:pointer;color:var(--ink)}\n:focus-visible{outline:3px solid var(--blue);outline-offset:2px}\n.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:12px}\n.flip{min-height:120px;text-align:left;border:2px solid var(--ink);background:var(--bg);padding:12px}\n.flip b{display:block;font-family:\"Bricolage Grotesque\",sans-serif}\n.flip.open{background:var(--hi);color:#16212b}\n.tl{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}\n.tl button{border:2px solid var(--ink);background:var(--sf);padding:6px 12px;font-weight:700}\n.tl button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}\n.panel{border-left:6px solid var(--blue);padding:8px 14px;background:var(--bg);min-height:5.5em}\n.warn{font-size:.88rem;color:var(--bad);font-weight:700;margin-top:4px}\n.q{font-weight:700;margin:8px 0}\n.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}\n.opt{border:2px solid var(--ink);background:var(--sf);padding:8px 14px;font-weight:700}\n.opt:hover:not(:disabled){background:var(--hi);color:#16212b}\n.opt.right{background:var(--okbg);border-color:var(--ok)}\n.opt.wrong{background:var(--badbg);border-color:var(--bad)}\n.stack{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}\nlabel{display:block;font-weight:700;font-size:.88rem;color:var(--mute);margin:6px 0 2px}\ntextarea{width:100%;min-height:90px;font:inherit;font-family:ui-monospace,Menlo,monospace;font-size:.9rem;padding:8px;border:2px solid var(--ink);background:var(--bg);color:var(--ink)}\n.run{margin-top:10px;border:2px solid var(--ink);background:var(--hi);color:#16212b;font-weight:700;padding:8px 18px;box-shadow:3px 3px 0 var(--ink)}\n.run:disabled{opacity:.6;cursor:wait}\n.resp{margin-top:8px;padding:8px 10px;border:2px dashed var(--ink);white-space:pre-wrap;font-size:.92rem;min-height:3em}\n.fb{font-weight:700;min-height:1.5em;margin-top:6px}\n.bar{display:flex;align-items:center;gap:8px;margin:6px 0}\n.bar i{display:block;height:18px;background:var(--blue);min-width:2px;transition:width .3s}\n.pill{background:var(--hi);color:#16212b;border:2px solid var(--ink);padding:1px 10px;font-weight:700;font-size:.85rem}\ndetails{border:2px solid var(--ink);background:var(--bg);margin:8px 0;padding:8px 12px}summary{cursor:pointer;font-weight:700}details p{margin:6px 0}.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0;font-weight:700}.flow span{border:2px solid var(--ink);background:var(--hi);color:#16212b;padding:3px 10px}\n.next{margin-top:26px;border:2px dashed var(--ink);padding:12px;color:var(--mute)}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<main>\n<div class=\"nav\"><span class=\"on\">2.1 Intro<\/span><span class=\"off\">2.2 Communication<\/span><span class=\"off\">2.3 Techniques<\/span><span class=\"off\">2.4 Creative<\/span><span class=\"off\">2.5 Writing<\/span><\/div>\n<h1>Unit 2.1: Introduction to Prompt Engineering<\/h1>\n<p class=\"sub\">Module 2 \u00b7 2 lecture hours \u00b7 Topics: what prompt engineering is, how it evolved, types of prompts, and how it works. Concepts follow the prescribed textbook; activities come from Anthropic's tutorial.<\/p>\n\n<section id=\"s1\">\n<div class=\"tag\">Concept 1<\/div><h2>What is a prompt, and why engineer it?<\/h2>\n<p class=\"sub\">Tap a card to flip it.<\/p>\n<div class=\"grid\" id=\"cards\"><\/div>\n<\/section>\n\n<section id=\"s2\">\n<div class=\"tag\">Concept 2<\/div><h2>A short history of prompting<\/h2>\n<p class=\"sub\">Pick a milestone.<\/p>\n<div class=\"tl\" id=\"tl\"><\/div>\n<div class=\"panel\" id=\"tlp\" aria-live=\"polite\">Choose a milestone above.<\/div>\n<\/section>\n\n<section id=\"s3\">\n<div class=\"tag\">Concept 3 \u00b7 Learn, then quiz<\/div><h2>The three types of prompts<\/h2>\n<p class=\"sub\">The book names three types of prompts. Read the three cards, then take the graded quiz.<\/p>\n<div class=\"grid\">\n<div class=\"flip\"><b>1. Natural-language prompts<\/b>What it is: instructions written the way people talk, giving the model clues in ordinary language, so you can work with it naturally.<br><i>Looks like:<\/i> \u201cExplain what a diode does in two sentences.\u201d<\/div>\n<div class=\"flip\"><b>2. System prompts<\/b>What it is: ready-made guidelines or templates that a developer supplies to steer the model's output, stating clearly the behaviour or format expected.<br><i>Looks like:<\/i> \u201cYou are a lab assistant. Always answer in bullet points.\u201d<br><i>Tutorial link:<\/i> the system prompt box in Ch. 1 and Ex 1.2.<\/div>\n<div class=\"flip\"><b>3. Conditional prompts<\/b>What it is: prompts that put the model under particular limits or contexts, using statements like \u201cIf X, then Y\u201d or \u201cGiven A, generate B\u201d.<br><i>Looks like:<\/i> \u201cIf there are more than 3 resistors, show the steps.\u201d<br><i>Tutorial link:<\/i> the \u201cif you are unsure, say\u2026\u201d rules in Ch. 9 and the \u201cgive Claude an out\u201d idea in Ch. 8.<\/div>\n<\/div>\n<p class=\"sub\"><b>Memory trick:<\/b> natural = how you speak. System = standing rules. Conditional = if or given. Real prompts often mix types.<\/p>\n<div class=\"tag\" style=\"margin-top:14px\">Graded quiz \u00b7 6 questions \u00b7 A 90%+ \u00b7 B 80%+ \u00b7 C 70%+ \u00b7 D 60%+ (examples written for this class)<\/div>\n<div class=\"q\" id=\"sq\"><\/div>\n<div class=\"opts\" id=\"so\"><\/div>\n<div class=\"fb\" id=\"sf\" role=\"status\"><\/div>\n<button class=\"run\" id=\"sn\" hidden>Next prompt<\/button>\n<\/section>\n\n<section id=\"s4\">\n<div class=\"tag\">Concept 4 \u00b7 Live on Claude<\/div><h2>How prompt engineering works: weak vs engineered<\/h2>\n<p class=\"sub\">The book gives five working principles: understand the task, use precise wording, give details, give examples, and experiment. Edit both prompts, run them on Claude, and compare. A full explanation of the five principles follows this activity.<\/p>\n<div class=\"stack\">\n<div><label for=\"pa\">Prompt A (weak)<\/label><textarea id=\"pa\">Explain transistors.<\/textarea><div class=\"resp\" id=\"ra\"><\/div><\/div>\n<div><label for=\"pb\">Prompt B (engineered)<\/label><textarea id=\"pb\">Explain what a transistor does to a first-year engineering student. Use exactly 3 bullet points, each with one real device example. Keep it under 80 words.<\/textarea><div class=\"resp\" id=\"rb\"><\/div><\/div>\n<\/div>\n<button class=\"run\" id=\"rn\">Run both on Claude<\/button> <span class=\"pill\">Model: Claude Haiku (same for the class)<\/span>\n<div class=\"fb\" id=\"rf\" role=\"status\"><\/div>\n<p class=\"sub\"><b>Discuss:<\/b> Which of the five principles did Prompt B use? Which one would you add? <span class=\"cite\">Tutorial Ch. 2: \"show your prompt to a colleague; if they're confused, Claude is too.\"<\/span><\/p>\n<\/section>\n\n<section id=\"s4b\">\n<div class=\"tag\">Theory<\/div><h2>How prompt engineering works: the five principles<\/h2>\n<p class=\"sub\">Open each part to read a full explanation of how prompt engineering works and its five guiding principles.<\/p>\n<div class=\"flow\" aria-label=\"Five principles cycle\"><span>1 Understand the task<\/span>\u2192<span>2 Precise wording<\/span>\u2192<span>3 Give details<\/span>\u2192<span>4 Give examples<\/span>\u2192<span>5 Experiment<\/span><b>\u21ba repeat<\/b><\/div>\n<p class=\"sub\"><b>Memory trick:<\/b> <b>U-P-D-E-E<\/b> = Understand, Precise, Details, Examples, Experiment. Draw this cycle in your notes.<\/p>\n<details open><summary>Introduction<\/summary><p>Prompt engineering is the process of designing and refining the instructions (prompts) given to a large language model (LLM) so that it produces the output we want. The process is intricate and recursive: there is no one-size-fits-all method, and the best approach depends on the particular LLM and the task. Engineers therefore follow five broad principles.<\/p><\/details>\n<details><summary>Principle 1: Understand the task thoroughly<\/summary>\n<p><b>Explain:<\/b> Before writing anything, decide what you expect from the LLM and what kind of result you want: an answer, a summary, code, a table? Only when the assignment is clear can you design a prompt that helps the model reach your objective.<\/p>\n<p><b>Why it matters:<\/b> Without a clear goal the model has to guess the task, the audience and the format.<\/p>\n<p><b>Example:<\/b> Goal unclear: \u201cTell me about circuits.\u201d Goal clear (exam revision): \u201cWrite revision notes on series and parallel circuits for a first-year exam.\u201d<\/p>\n<p><b>Class link:<\/b> Tutorial Ch. 2, clear and direct.<\/p><\/details>\n<details><summary>Principle 2: Make your wording precise and succinct<\/summary>\n<p><b>Explain:<\/b> Leave no doubt about what you are asking. Use straightforward language, keep it short, and avoid jargon.<\/p>\n<p><b>Why it matters:<\/b> The model only has your words, so vague words give vague output.<\/p>\n<p><b>Example:<\/b> Vague: \u201cMake it short and good.\u201d Precise: \u201cSummarise in 3 bullet points, under 60 words.\u201d<\/p>\n<p><b>Class link:<\/b> Tutorial Ex 2.2, one player only.<\/p><\/details>\n<details><summary>Principle 3: Give details<\/summary>\n<p><b>Explain:<\/b> The more specific the prompt, the more likely the response is relevant and informative. The textbook's own example: instead of \u201cwrite a poem\u201d, ask for \u201ca poem about a lost love\u201d.<\/p>\n<p><b>What details to add:<\/b> topic, audience, length, format and tone.<\/p>\n<p><b>Example:<\/b> \u201cExplain Ohm's law.\u201d becomes \u201cExplain Ohm's law to a first-year student using a 12 V battery and a 4 \u03a9 resistor, in 3 steps.\u201d<\/p>\n<p><b>Class link:<\/b> Tutorial Ch. 3 and Ch. 4, roles and clear inputs.<\/p><\/details>\n<details><summary>Principle 4: Give instances, i.e. examples<\/summary>\n<p><b>Explain:<\/b> Where possible, show the LLM samples of the output you want. This helps it understand your goal and gives more accurate results. This idea leads to one-shot and few-shot prompting (Unit 2.3).<\/p>\n<p><b>Example:<\/b> \u201cConvert device names to lab codes. Lamp \u2192 LP-1. Fan \u2192 FN-2. Motor \u2192\u201d (the model copies the pattern and answers MT-3).<\/p>\n<p><b>Class link:<\/b> Tutorial Ch. 7, few-shot.<\/p><\/details>\n<details><summary>Principle 5: Try things out, i.e. experiment<\/summary>\n<p><b>Explain:<\/b> Prompt engineering cannot be done in one fixed way. Try different prompts, look at the results, and refine. What works for one LLM or one task may not work for another.<\/p>\n<p><b>Example:<\/b> Run prompt v1, notice the answer is too long, add \u201cunder 80 words\u201d, run again as v2. Keep both in your Prompt Portfolio and note why v2 is better.<\/p>\n<p><b>Class link:<\/b> Every tutorial exercise, and your Prompt Portfolio.<\/p><\/details>\n<details><summary>Example and conclusion<\/summary>\n<p><b>Worked example:<\/b> v1 \u201cExplain transistors.\u201d \u2192 v2 \u201cExplain what a transistor does to a first-year engineering student. Use exactly 3 bullet points, each with one real device example. Keep it under 80 words.\u201d Each added phrase applies one principle.<\/p>\n<p><b>Conclusion:<\/b> Together the principles move a prompt from vague to precise: understand the task, word it precisely, add details, show examples, then test and refine. Because the process is recursive, the cycle repeats until the output meets the goal. Well-engineered prompts give more accurate, relevant and creative results, which is why the skill matters in communication, coding, writing and research.<\/p><\/details>\n<h3 style=\"margin-top:18px\">Try writing it yourself<\/h3>\n<label for=\"myans\">Explain the five principles in your own words (at least a few sentences). Claude will give you feedback on what you covered and what to add.<\/label>\n<textarea id=\"myans\" style=\"min-height:140px\" placeholder=\"Introduction\u2026 then the five principles with an example for each\u2026 then a conclusion.\"><\/textarea>\n<button class=\"run\" id=\"fb2\">Get feedback from Claude<\/button> <span class=\"pill\">Model: Claude Haiku<\/span>\n<div class=\"resp\" id=\"fbo\" role=\"status\"><\/div>\n<\/section>\n\n<section id=\"s5\">\n<div class=\"tag\">Quick check<\/div><h2>Three questions<\/h2>\n<div id=\"quiz\"><\/div>\n<\/section>\n\n<section id=\"s6\">\n<div class=\"tag\">Exit ticket \u00b7 whole class<\/div><h2>Which principle will you use most?<\/h2>\n<p class=\"sub\" id=\"pollnote\">Vote once (you can change it). Results update live for everyone who has this page open right now.<\/p>\n<div class=\"opts\" id=\"po\"><\/div><div id=\"pr\"><\/div>\n<\/section>\n\n<div class=\"next\"><b>Teacher notes.<\/b> Verify before presenting as fact: the 1990s and 2000s items in the history timeline could not be confirmed from the textbook alone. Unit 2.2 to 2.5 pages and the spreadsheet activities come in the next stages.<\/div>\n<\/main>\n<script>\nconst MODEL=\"claude-haiku-5-5\";\nconst $=id=>document.getElementById(id);\nconst liveErr=e=>{try{console.error(e)}catch(_){}const c=e&&e.code;const m={not_granted:'Claude was not allowed. Reload this page and click Allow when the permission box appears.',rate_limited:'Too many runs. Wait a moment, then try again.',not_declared:'This page is not set up for live Claude. Tell your teacher.',capability_disabled:'Live Claude is switched off for this page. Tell your teacher.',capability_removed:'Live Claude was removed from this page. Tell your teacher.',sampling_disabled:'Live Claude is turned off for your account or organisation.',session_expired:'Your session expired. Reload the page.',upstream_error:'Claude is busy. Try again in a moment.',empty_completion:'Claude sent an empty reply. Run it again.',refused:'Claude declined this prompt. Change the wording.',queue_overflow:'Too many requests are waiting. Try again shortly.',cancelled:'Stopped.',invalid_request:'The request was not accepted. Tell your teacher.'}[c];return (m||\"Couldn't reach Claude. Try again.\")+(c?' (code: '+c+')':(e&&e.message?' ('+String(e.message).slice(0,80)+')':''));};\n/* live Claude when available, otherwise paste mode (works in any phone browser) */\nconst HARD=['not_granted','sampling_disabled','capability_disabled','capability_removed','not_declared'];\nlet liveFn=null,liveDone=false,pasteOnly=false;\n(async()=>{try{if(typeof claude!=='undefined'&&claude&&claude.use)liveFn=await claude.use(\"sample\");}catch(e){liveFn=null;}liveDone=true;})();\nconst wait=ms=>new Promise(r=>setTimeout(r,ms));\nconst pasteQ=[];let pasteBusy=false;\nfunction pasteAsk(p,o){return new Promise((res,rej)=>{pasteQ.push({p,o,res,rej});pump();});}\nfunction pump(){if(pasteBusy||!pasteQ.length)return;pasteBusy=true;const {p,o,res,rej}=pasteQ.shift();\nconst ov=document.createElement('div');ov.setAttribute('role','dialog');ov.style.cssText='position:fixed;inset:0;z- eturn;}done();try{o&&o.onText&&o.onText({text:t,delta:t});}catch(e){}res({text:t,truncated:false});pump();};\nno.onclick=()=>{done();const q=pasteQ.splice(0);rej({code:'cancelled',message:'cancelled'});q.forEach(x=>x.rej({code:'cancelled',message:'cancelled'}));};\nbx.append(h,ex,pt,cp,l2,rt,em,ok,no);ov.appendChild(bx);document.body.appendChild(ov);setTimeout(()=>{try{rt.focus();}catch(e){}},50);}\nasync function getSample(){return async(p,o)=>{\n if(!liveDone)await Promise.race([(async()=>{while(!liveDone)await wait(100);})(),wait(8000)]);\n if(liveFn&&!pasteOnly){try{return await liveFn(p,o);}catch(e){if(HARD.includes(e&&e.code))pasteOnly=true;else throw e;}}\n return pasteAsk(p,o);};}\nconst CARDS=[\n[\"What is a prompt?\",\"A short piece of text (a question, instruction or example) given to a large language model. It sets the background, states the task and shapes the answer.\"],\n[\"What is prompt engineering?\",\"Writing and refining prompts on purpose so the model is nudged toward the result you want, like guiding a gifted artist without drowning out their style.\"],\n[\"Why it matters: go further\",\"Good prompts let a model do jobs it was not built for, such as long stories or music, by using its broad knowledge.\"],\n[\"Why it matters: precision\",\"Careful wording steers a model toward relevant, accurate answers. This is vital in areas like reporting and research.\"],\n[\"Why it matters: creativity\",\"Prompts can spark new ideas, unusual solutions and original work.\"],\n[\"Why it matters: access\",\"Clear prompts and friendly interfaces let people without technical training use AI tools.\"]];\nCARDS.forEach(([t,a,c])=>{const b=document.createElement('button');b.className='flip';b.innerHTML='<b><\/b><span><\/span>';b.firstChild.textContent=t;b.lastChild.textContent='Tap to flip';\nlet o=0;b.onclick=()=>{o=!o;b.classList.toggle('open',o);b.lastChild.textContent=o?a:'Tap to flip';};$('cards').appendChild(b);});\nconst TL=[\n[\"1966 ELIZA\",\"Weizenbaum's chatbot imitated a therapy chat by matching keywords and patterns in what the user typed. The book treats it as an early, basic form of prompting.\",0],\n[\"1970s SHRDLU\",\"Winograd's natural-language system followed typed commands to reason about blocks in a virtual world, showing that language can steer AI behaviour.\",0],\n[\"1990s chatbots\",\"Jabberwacky and ALICE stressed playful, open-ended conversation.\",1],\n[\"2000s templates\",\"Systems filled slots in predefined templates to generate stories, laying groundwork for structured prompting.\",1],\n[\"2017 Transformer\",\"The Transformer architecture led to very capable LLMs such as GPT-3, which made prompting powerful.\",0],\n[\"2020s tuning\",\"Models are tuned for specific tasks and adapt from the prompt itself. Few-shot learning and conditional generation give finer control.\",0]];\nTL.forEach(([t,a,c,v],i)=>{const b=document.createElement('button');b.textContent=t;b.setAttribute('aria-pressed','false');\nb.onclick=()=>{[...$('tl').children].forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');\n$('tlp').innerHTML='';const p=document.createElement('div');p.textContent=a;$('tlp').appendChild(p);\nif(v){const w=document.createElement('div');w.className='warn';w.textContent='\u26a0 Verify before quoting: this part of the book could not be confirmed.';$('tlp').appendChild(w);}};$('tl').appendChild(b);});\n/* sorter */\nconst TY=[\"Natural-language\",\"System\",\"Conditional\"];\nconst SI=[\n[\"Explain what a diode does in two sentences.\",0,\"A plain request written the way you would speak.\"],\n[\"You are a lab assistant. Always answer in bullet points and never give final numeric answers.\",1,\"Standing instructions that fix the behaviour and format.\"],\n[\"If the circuit has more than 3 resistors, show the equivalent-resistance steps; otherwise just give the answer.\",2,\"An 'If X, then Y' condition.\"],\n[\"Given a voltage of 12 V and a resistance of 4 \u03a9, generate the current.\",2,\"The book's 'Given A, generate B' pattern.\"],\n[\"What is the difference between AC and DC?\",0,\"A natural question in everyday language.\"],\n[\"Always reply as a patient teacher and use three numbered steps.\",1,\"Guidelines that shape every answer.\"]];\nlet si=0,sc=0,sa=false;\nfunction showS(){sa=false;$('sq').textContent=`(${si+1}/${SI.length}) \u201c${SI[si][0]}\u201d`;$('sf').textContent='';$('sn').hidden=true;\n$('so').innerHTML='';TY.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;\nb.onclick=()=>{if(sa)return;sa=true;const ok=i===SI[si][1];if(ok)sc++;b.classList.add(ok?'right':'wrong');\n[...$('so').children][SI[si][1]].classList.add('right');$('sf').textContent=(ok?'\u2713 ':'\u2717 It is '+TY[SI[si][1]]+'. ')+SI[si][2];\n$('sn').hidden=false;$('sn').textContent=si<SI.length-1?'Next prompt':'Finish';};$('so').appendChild(b);});}\nlet done=false;\nfunction nextS(){if(done){si=0;sc=0;done=false;showS();return;}if(si<SI.length-1){si++;showS();}else{gradeS();}}\n$('sn').onclick=nextS;\nfunction gradeS(){done=true;const p=Math.round(sc/SI.length*100);const g=p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';\n$('sq').textContent=`Your score: ${sc} / ${SI.length} (${p}%). Grade: ${g}`;$('so').innerHTML='';\n$('sf').textContent=p>=80?'Well done. You can tell the three types apart.':'Re-read the three cards above, then retry.';\n$('sn').hidden=false;$('sn').textContent='Retry quiz';}\nshowS();\n/* live compare */\nlet sample=null;\nasync function runOne(p,box){const r=await sample(p,{model:MODEL,modelTier:\"quick\",cache:false,onText:({text})=>{box.textContent=text;}});box.textContent=r.text;}\n$('rn').onclick=async()=>{const b=$('rn');b.disabled=true;$('rf').textContent='Claude is thinking\u2026';$('ra').textContent='';$('rb').textContent='';\ntry{if(!sample)sample=await getSample();\nif(!sample){$('rf').textContent='Live Claude is not available here. Open this page from its claude.ai link while signed ze:.9rem;background:var(--sf);color:var(--blue);text-decoration:none}\n.look{border-left:6px solid var(--blue);padding:6px 12px;background:var(--bg);margin-top:8px;font-size:.95rem}\n\n.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;flex-wrap:wrap;background:var(--bg);padding:8px 16px;border-bottom:2px solid var(--ink)}\n.tabs button{border:2px solid var(--ink);background:var(--sf);padding:6px 12px;font-weight:700}.tabs button[aria-pressed=true]{background:var(--hi);color:#16212b}\n.pg{display:none}.pg.on{display:block}<\/style><\/head><body>\n<div class=\"tabs\" role=\"tablist\"><button data-t=\"A\" aria-pressed=\"true\">Part A \u00b7 Intro, history, principles<\/button><button data-t=\"B\" aria-pressed=\"false\">Part B \u00b7 How AI works, types, pros and cons<\/button><button data-t=\"C\" aria-pressed=\"false\">Part C \u00b7 Apply it and live demos<\/button><\/div>\n<main class=\"pg on\" id=\"pgA\">\n<h1>Unit 2.1: Introduction to Prompt Engineering<\/h1>\n<p class=\"sub\">Module 2 \u00b7 2 lecture hours \u00b7 Topics: what prompt engineering is, how it evolved, and how it works (the five principles). The three types of prompts are in Part B. Concepts follow the prescribed textbook; activities come from Anthropic's tutorial.<\/p>\n\n<section id=\"s1\">\n<div class=\"tag\">Concept 1<\/div><h2>What is a prompt, and why engineer it?<\/h2>\n<p class=\"sub\">Tap a card to flip it.<\/p>\n<div class=\"grid\" id=\"cards\"><\/div>\n<\/section>\n\n<section id=\"s2\">\n<div class=\"tag\">Concept 2<\/div><h2>A short history of prompting<\/h2>\n<p class=\"sub\">Pick a milestone.<\/p>\n<div class=\"tl\" id=\"tl\"><\/div>\n<div class=\"panel\" id=\"tlp\" aria-live=\"polite\">Choose a milestone above.<\/div>\n<\/section>\n\n<section id=\"s4\">\n<div class=\"tag\">Concept 3 \u00b7 Live on Claude<\/div><h2>How prompt engineering works: weak vs engineered<\/h2>\n<p class=\"sub\">The book gives five working principles: understand the task, use precise wording, give details, give examples, and experiment. Edit both prompts, run them on Claude, and compare. A full explanation of the five principles follows this activity.<\/p>\n<div class=\"stack\">\n<div><label for=\"pa\">Prompt A (weak)<\/label><textarea id=\"pa\">Explain transistors.<\/textarea><div class=\"resp\" id=\"ra\"><\/div><\/div>\n<div><label for=\"pb\">Prompt B (engineered)<\/label><textarea id=\"pb\">Explain what a transistor does to a first-year engineering student. Use exactly 3 bullet points, each with one real device example. Keep it under 80 words.<\/textarea><div class=\"resp\" id=\"rb\"><\/div><\/div>\n<\/div>\n<button class=\"run\" id=\"rn\">Run both on Claude<\/button> <span class=\"pill\">Model: Claude Haiku (same for the class)<\/span>\n<div class=\"fb\" id=\"rf\" role=\"status\"><\/div>\n<p class=\"sub\"><b>Discuss:<\/b> Which of the five principles did Prompt B use? Which one would you add? <span class=\"cite\">Tutorial Ch. 2: \"show your prompt to a colleague; if they're confused, Claude is too.\"<\/span><\/p>\n<\/section>\n\n<section id=\"s4b\">\n<div class=\"tag\">Theory<\/div><h2>How prompt engineering works: the five principles<\/h2>\n<p class=\"sub\">Open each part to read a full explanation of how prompt engineering works and its five guiding principles.<\/p>\n<div class=\"flow\" aria-label=\"Five principles cycle\"><span>1 Understand the task<\/span>\u2192<span>2 Precise wording<\/span>\u2192<span>3 Give details<\/span>\u2192<span>4 Give examples<\/span>\u2192<span>5 Experiment<\/span><b>\u21ba repeat<\/b><\/div>\n<p class=\"sub\"><b>Memory trick:<\/b> <b>U-P-D-E-E<\/b> = Understand, Precise, Details, Examples, Experiment. Draw this cycle in your notes.<\/p>\n<details open><summary>Introduction<\/summary><p>Prompt engineering is the process of designing and refining the instructions (prompts) given to a large language model (LLM) so that it produces the output we want. The process is intricate and recursive: there is no one-size-fits-all method, and the best approach depends on the particular LLM and the task. Engineers therefore follow five broad principles.<\/p><\/details>\n<details><summary>Principle 1: Understand the task thoroughly<\/summary>\n<p><b>Explain:<\/b> Before writing anything, decide what you expect from the LLM and what kind of result you want: an answer, a summary, code, a table? Only when the assignment is clear can you design a prompt that helps the model reach your objective.<\/p>\n<p><b>Why it matters:<\/b> Without a clear goal the model has to guess the task, the audience and the format.<\/p>\n<p><b>Example:<\/b> Goal unclear: \u201cTell me about circuits.\u201d Goal clear (exam revision): \u201cWrite revision notes on series and parallel circuits for a first-year exam.\u201d<\/p>\n<p><b>Class link:<\/b> Tutorial Ch. 2, clear and direct.<\/p><\/details>\n<details><summary>Principle 2: Make your wording precise and succinct<\/summary>\n<p><b>Explain:<\/b> Leave no doubt about what you are asking. Use straightforward language, keep it short, and avoid jargon.<\/p>\n<p><b>Why it matters:<\/b> The model only has your words, so vague words give vague output.<\/p>\n<p><b>Example:<\/b> Vague: \u201cMake it short and good.\u201d Precise: \u201cSummarise in 3 bullet points, under 60 words.\u201d<\/p>\n<p><b>Class link:<\/b> Tutorial Ex 2.2, one player only.<\/p><\/details>\n<details><summary>Principle 3: Give details<\/summary>\n<p><b>Explain:<\/b> The more specific the prompt, the more likely the response is relevant and informative. The textbook's own example: instead of \u201cwrite a poem\u201d, ask for \u201ca poem about a lost love\u201d.<\/p>\n<p><b>What details to add:<\/b> topic, audience, length, format and tone.<\/p>\n<p><b>Example:<\/b> \u201cExplain Ohm's law.\u201d becomes \u201cExplain Ohm's law to a first-year student using a 12 V battery and a 4 \u03a9 resistor, in 3 steps.\u201d<\/p>\n<p><b>Class link:<\/b> Tutorial Ch. 3 and Ch. 4, roles and clear inputs.<\/p><\/details>\n<details><summary>Principle 4: Give instances, i.e. examples<\/summary>\n<p><b>Explain:<\/b> Where possible, show the LLM samples of the output you want. This helps it understand your goal and gives more accurate results. This idea leads to one-shot and few-shot prompting (Unit 2.3).<\/p>\n<p><b>Example:<\/b> \u201cConvert device names to lab codes. Lamp \u2192 LP-1. Fan \u2192 FN-2. Motor \u2192\u201d (the model copies the pattern and answers MT-3).<\/p>\n<p><b>Class link:<\/b> Tutorial Ch. 7, few-shot.<\/p><\/details>\n<details><summary>Principle 5: Try things out, i.e. experiment<\/summary>\n<p><b>Explain:<\/b> Prompt engineering cannot be done in one fixed way. Try different prompts, look at the results, and refine. What works for one LLM or one task may not work for another.<\/p>\n<p><b>Example:<\/b> Run prompt v1, notice the answer is too long, add \u201cunder 80 words\u201d, run again as v2. Keep both in your Prompt Portfolio and note why v2 is better.<\/p>\n<p><b>Class link:<\/b> Every tutorial exercise, and your Prompt Portfolio.<\/p><\/details>\n<details><summary>Example and conclusion<\/summary>\n<p><b>Worked example:<\/b> v1 \u201cExplain transistors.\u201d \u2192 v2 \u201cExplain what a transistor does to a first-year engineering student. Use exactly 3 bullet points, each with one real device example. Keep it under 80 words.\u201d Each added phrase applies one principle.<\/p>\n<p><b>Conclusion:<\/b> Together the principles move a prompt from vague to precise: understand the task, word it precisely, add details, show examples, then test and refine. Because the process is recursive, the cycle repeats until the output meets the goal. Well-engineered prompts give more accurate, relevant and creative results, which is why the skill matters in communication, coding, writing and research.<\/p><\/details>\n<\/section>\n\n<section id=\"s6\">\n<div class=\"tag\">Exit ticket \u00b7 whole class<\/div><h2>Which principle will you use most?<\/h2>\n<p class=\"sub\" id=\"pollnote\">Vote once (you can change it). Results update live for everyone who has this page open right now.<\/p>\n<div class=\"opts\" id=\"po\"><\/div><div id=\"pr\"><\/div>\n<\/section>\n\n<div class=\"next\"><b>Teacher notes.<\/b> Verify before presenting as fact: the 1990s and 2000s items in the history timeline could not be confirmed from the textbook alone. Unit 2.2 to 2.5 pages and the spreadsheet activities come in the next stages.<\/div>\n<\/main>\n<main class=\"pg\" id=\"pgB\">\n<h1>Unit 2.1 \u00b7 Part B: How AI Works, Prompt Types, Pros and Cons<\/h1>\n<p class=\"sub\">Read each theory topic by tapping its parts, then do the labs and case study. The scenario questions are in Part C. Use this page after Part A.<\/p>\n<div id=\"theory\"><\/div>\n<section id=\"labs\"><div class=\"tag\">Apply it \u00b7 Live on Claude<\/div><h2>Two labs<\/h2><p class=\"sub\">Each lab runs on Claude Haiku so the whole class sees similar replies. About 4 to 5 minutes each (Core).<\/p><div id=\"lb\"><\/div><\/section>\n<section id=\"cs\"><div class=\"tag\">Case study \u00b7 Claude gives feedback, not a mark<\/div><h2>An AI helper for the first-year lab<\/h2>\n<p>Your college lab wants an AI helper for first-year students. Write a short recommendation that explains (a) how the AI produces its answers, (b) which prompt types you would use and why, (c) one advantage and two risks, with a way to reduce each risk.<\/p>\n<textarea id=\"csa\" style=\"min-height:150px\" placeholder=\"Write at least 40 words.\"><\/textarea><button class=\"run\" id=\"csb\">Get feedback from Claude<\/button> <span class=\"pill\">Model: Claude Haiku<\/span><div class=\"resp\" id=\"cso\" role=\"status\"><\/div>\n<details><summary>Model answer (open after you try)<\/summary><p>The helper is a large language model built on a transformer network. It was pre-trained on huge text collections to predict the next word, then fine-tuned and aligned with human feedback, so it writes likely text rather than looking up facts. I would use a system prompt to fix its role and format (patient lab assistant, 3 short bullets, no final numeric answers for graded work), natural-language prompts from students for their questions, and conditional prompts for cases (if unsure, say so and refer to the instructor; if a circuit has more than 3 resistors, show steps). Advantage: quick, consistent, clear help that adapts to each student. Risk 1: confident wrong answers; reduce by allowing \"I am not sure\" and checking against the lab manual. Risk 2: biased or unsafe output or misuse; reduce through the system prompt, instructor review and clear usage rules. Because prompting is trial and error, we would test and refine prompts each term.<\/p><\/details><\/section>\n<\/main>\n<main class=\"pg\" id=\"pgC\">\n<h1>Unit 2.1 \u00b7 Part C: Apply It and Live Demos<\/h1>\n<p class=\"sub\">Part C puts Parts A and B to work. First, a sorting quiz, then eleven harder scenario questions where several answers look reasonable. Then five live prompt demos your teacher can run in class.<\/p>\n<section><div class=\"tag\">Sort it \u00b7 Graded quiz \u00b7 6 prompts<\/div><h2>Which type of prompt is it?<\/h2><p class=\"sub\">Choose natural-language, system or conditional. A 90%+ \u00b7 B 80%+ \u00b7 C 70%+ \u00b7 D 60%+.<\/p><div class=\"q\" id=\"sq\"><\/div><div class=\"opts\" id=\"so\"><\/div><div class=\"fb\" id=\"sf\" role=\"status\"><\/div><button class=\"run\" id=\"sn\" hidden>Next prompt<\/button><\/section>\n<section><div class=\"tag\">Apply it \u00b7 Harder scenarios<\/div><h2>Pick the best answer<\/h2><p class=\"sub\">Read carefully: more than one option may sound sensible. Choose the best one, then read the reason.<\/p><p class=\"sub\" id=\"scn\"><\/p><div id=\"scq\"><\/div><\/section>\n<section><div class=\"tag\">Live demos \u00b7 5 prompts<\/div><h2>Watch the prompt change the answer<\/h2><p class=\"sub\">Each demo runs two prompts side by side on Claude Haiku. Edit either prompt and run again to experiment. Replies can vary from run to run, and that variation is part of the lesson.<\/p><div id=\"dm\"><\/div><\/section>\n<\/main>\n<script>\n(function(){\n\nconst MODEL=\"claude-haiku-5-5\";\nconst $=id=>document.getElementById(id);\nconst liveErr=e=>{try{console.error(e)}catch(_){}const c=e&&e.code;const m={not_granted:'Claude was not allowed. Reload this page and click Allow when the permission box appears.',rate_limited:'Too many runs. Wait a moment, then try again.',not_declared:'This page is not set up for live Claude. Tell your teacher.',capability_disabled:'Live Claude is switched off for this page. Tell your teacher.',capability_removed:'Live Claude was removed from this page. Tell your teacher.',sampling_disabled:'Live Claude is turned off for your account or organisation.',session_expired:'Your session expired. Reload the page.',upstream_error:'Claude is busy. Try again in a moment.',empty_completion:'Claude sent an empty reply. Run it again.',refused:'Claude declined this prompt. Change the wording.',queue_overflow:'Too many requests are waiting. Try again shortly.',cancelled:'Stopped.',invalid_request:'The request was not accepted. Tell your teacher.'}[c];return (m||\"Couldn't reach Claude. Try again.\")+(c?' (code: '+c+')':(e&&e.message?' ('+String(e.message).slice(0,80)+')':''));};\n/* live Claude when available, otherwise paste mode (works in any phone browser) */\nconst HARD=['not_granted','sampling_disabled','capability_disabled','capability_removed','not_declared'];\nlet liveFn=null,liveDone=false,pasteOnly=false;\n(async()=>{try{if(typeof claude!=='undefined'&&claude&&claude.use)liveFn=await claude.use(\"sample\");}catch(e){liveFn=null;}liveDone=true;})();\nconst wait=ms=>new Promise(r=>setTimeout(r,ms));\nconst pasteQ=[];let pasteBusy=false;\nfunction pasteAsk(p,o){return new Promise((res,rej)=>{pasteQ.push({p,o,res,rej});pump();});}\nfunction pump(){if(pasteBusy||!pasteQ.length)return;pasteBusy=true;const {p,o,res,rej}=pasteQ.shift();\nconst ov=document.createElement('div');ov.setAttribute('role','dialog');ov.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:12px';\nconst bx=document.createElement('div');bx.style.cssText='background:var(--sf,var(--surface,#fff));color:var(--ink,#16212b);border:2px solid var(--ink,#16212b);box-shadow:5px 5px 0 var(--ink,#16212b);max-width:660px;width:100%;padding:16px;margin:8px 0';\nconst mkb=(t,bg)=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='font:inherit;cursor:pointer;border:2px solid var(--ink,#16212b);padding:7px 14px;font-weight:700;margin:8px 8px 0 0;background:'+bg+';color:#16212b';return b;};\nconst ta=()=>{const t=document.createElement('textarea');t.style.cssText='width:100%;min-height:120px;font:14px ui-monospace,Menlo,monospace;padding:8px;border:2px solid var(--ink,#16212b);background:var(--bg,#f2f5ef);color:var(--ink,#16212b)';return t;};\nconst h=document.createElement('div');h.style.cssText='font-weight:800;font-size:1.15rem;margin-bottom:6px';h.textContent='Run this in your own Claude chat';\nconst ex=document.createElement('p');ex.style.margin='0 0 8px';ex.textContent=\"Live Claude isn't available in this view. 1) Copy the prompt. 2) Open Claude (use Haiku if you can choose), paste it and send. 3) Paste Claude's reply below.\";\nconst pt=ta();pt.readOnly=true;pt.value=p;const cp=mkb('Copy prompt','#ffd84d');\ncp.onclick=async()=>{try{await navigator.clipboard.writeText(p);cp.textContent='Copied \u2713';}catch(e){pt.focus();pt.select();cp.textContent='Press copy on your keyboard';}};\nconst l2=document.createElement('div');l2.style.cssText='font-weight:700;margin-top:10px';l2.textContent=\"Claude's reply\";\nconst rt=ta();const ok=mkb('Use this reply','#ffd84d');const no=mkb('Cancel','transparent');const em=document.createElement('div');em.style.cssText='font-weight:700;min-height:1.2em';\nconst done=()=>{ov.remove();pasteB Content=o?a:'Tap to flip';};$('cards').appendChild(b);});\nconst TL=[\n[\"1966 ELIZA\",\"Weizenbaum's chatbot imitated a therapy chat by matching keywords and patterns in what the user typed. The book treats it as an early, basic form of prompting.\",0],\n[\"1970s SHRDLU\",\"Winograd's natural-language system followed typed commands to reason about blocks in a virtual world, showing that language can steer AI behaviour.\",0],\n[\"1990s chatbots\",\"Jabberwacky and ALICE stressed playful, open-ended conversation.\",1],\n[\"2000s templates\",\"Systems filled slots in predefined templates to generate stories, laying groundwork for structured prompting.\",1],\n[\"2017 Transformer\",\"The Transformer architecture led to very capable LLMs such as GPT-3, which made prompting powerful.\",0],\n[\"2020s tuning\",\"Models are tuned for specific tasks and adapt from the prompt itself. Few-shot learning and conditional generation give finer control.\",0]];\nTL.forEach(([t,a,c,v],i)=>{const b=document.createElement('button');b.textContent=t;b.setAttribute('aria-pressed','false');\nb.onclick=()=>{[...$('tl').children].forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');\n$('tlp').innerHTML='';const p=document.createElement('div');p.textContent=a;$('tlp').appendChild(p);\nif(v){const w=document.createElement('div');w.className='warn';w.textContent='\u26a0 Verify before quoting: this part of the book could not be confirmed.';$('tlp').appendChild(w);}};$('tl').appendChild(b);});\n/* live compare */\nlet sample=null;\nasync function runOne(p,box){const r=await sample(p,{model:MODEL,modelTier:\"quick\",cache:false,onText:({text})=>{box.textContent=text;}});box.textContent=r.text;}\n$('rn').onclick=async()=>{const b=$('rn');b.disabled=true;$('rf').textContent='Claude is thinking\u2026';$('ra').textContent='';$('rb').textContent='';\ntry{if(!sample)sample=await getSample();\nif(!sample){$('rf').textContent='Live Claude is not available here. Open this page from its claude.ai link while signed in.';return;}\nawait Promise.all([runOne($('pa').value,$('ra')),runOne($('pb').value,$('rb'))]);$('rf').textContent='Compare: which reply could you use without editing?';}\ncatch(e){$('rf').textContent=liveErr(e);}\nfinally{b.disabled=false;}};\n/* class poll */\nconst PO=[\"Understand the task\",\"Precise wording\",\"Give details\",\"Give examples\",\"Experiment\"];\nconst votes={};let room=null,mine=-1;\nfunction drawPoll(){const t={};PO.forEach((_,i)=>t[i]=0);Object.values(votes).forEach(v=>{if(t[v]!==undefined)t[v]++;});\nconst tot=Object.keys(votes).length||1;$('pr').innerHTML='';PO.forEach((p,i)=>{const r=document.createElement('div');r.className='bar';\nconst l=document.createElement('span');l.style.minWidth='9.5em';l.textContent=p;const b=document.createElement('i');b.style.width=(t[i]/tot*60)+'%';\nconst n=document.createElement('span');n.textContent=t[i];r.append(l,b,n);$('pr').appendChild(r);});}\nPO.forEach((p,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=p;b.onclick=async()=>{mine=i;votes.me=i;drawPoll();\ntry{if(room)await room.emit('poll21',{v:i});}catch(e){}};$('po').appendChild(b);});\ndrawPoll();\n(async()=>{try{room=await claude.use(\"room\");if(!room){$('pollnote').textContent='Vote to see your own tally. Live class results need the claude.ai link.';return;}\nroom.on('poll21',m=>{if(m.isMe)return;votes[m.peer]=m.data&&m.data.v;drawPoll();});}catch(e){}})();\n\n})();\n<\/script>\n<script>\n(function(){\n\nconst MODEL=\"claude-haiku-5-5\",$=id=>document.getElementById(id);\nconst liveErr=e=>{try{console.error(e)}catch(_){}const c=e&&e.code;const m={not_granted:'Claude was not allowed. Reload and click Allow.',rate_limited:'Too many runs. Wait a moment, then retry.',not_declared:'This page is not set up for live Claude. Tell your teacher.',capability_disabled:'Live Claude is off for this page. Tell your teacher.',capability_removed:'Live Claude was removed from this page. Tell your teacher.',sampling_disabled:'Live Claude is off for your account or organisation.',session_expired:'Session expired. Reload the page.',upstream_error:'Claude is busy. Try again shortly.',empty_completion:'Claude sent an empty reply. Run it again.',refused:'Claude declined this prompt. Change the wording.',queue_overflow:'Too many requests waiting. Try again shortly.',cancelled:'Stopped.',invalid_request:'Request not accepted. Tell your teacher.'}[c];return (m||\"Couldn't reach Claude. Try again.\")+(c?' (code: '+c+')':(e&&e.message?' ('+String(e.message).slice(0,80)+')':''));};\n/* live Claude when available, otherwise paste mode (works in any phone browser) */\nconst HARD=['not_granted','sampling_disabled','capability_disabled','capability_removed','not_declared'];\nlet liveFn=null,liveDone=false,pasteOnly=false;\n(async()=>{try{if(typeof claude!=='undefined'&&claude&&claude.use)liveFn=await claude.use(\"sample\");}catch(e){liveFn=null;}liveDone=true;})();\nconst wait=ms=>new Promise(r=>setTimeout(r,ms));\nconst pasteQ=[];let pasteBusy=false;\nfunction pasteAsk(p,o){return new Promise((res,rej)=>{pasteQ.push({p,o,res,rej});pump();});}\nfunction pump(){if(pasteBusy||!pasteQ.length)return;pasteBusy=true;const {p,o,res,rej}=pasteQ.shift();\nconst ov=document.createElement('div');ov.setAttribute('role','dialog');ov.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:12px';\nconst bx=document.createElement('div');bx.style.cssText='background:var(--sf,var(--surface,#fff));color:var(--ink,#16212b);border:2px solid var(--ink,#16212b);box-shadow:5px 5px 0 var(--ink,#16212b);max-width:660px;width:100%;padding:16px;margin:8px 0';\nconst mkb=(t,bg)=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='font:inherit;cursor:pointer;border:2px solid var(--ink,#16212b);padding:7px 14px;font-weight:700;margin:8px 8px 0 0;background:'+bg+';color:#16212b';return b;};\nconst ta=()=>{const t=document.createElement('textarea');t.style.cssText='width:100%;min-height:120px;font:14px ui-monospace,Menlo,monospace;padding:8px;border:2px solid var(--ink,#16212b);background:var(--bg,#f2f5ef);color:var(--ink,#16212b)';return t;};\nconst h=document.createElement('div');h.style.cssText='font-weight:800;font-size:1.15rem;margin-bottom:6px';h.textContent='Run this in your own Claude chat';\nconst ex=document.createElement('p');ex.style.margin='0 0 8px';ex.textContent=\"Live Claude isn't available in this view. 1) Copy the prompt. 2) Open Claude (use Haiku if you can choose), paste it and send. 3) Paste Claude's reply below.\";\nconst pt=ta();pt.readOnly=true;pt.value=p;const cp=mkb('Copy prompt','#ffd84d');\ncp.onclick=async()=>{try{await navigator.clipboard.writeText(p);cp.textContent='Copied \u2713';}catch(e){pt.focus();pt.select();cp.textContent='Press copy on your keyboard';}};\nconst l2=document.createElement('div');l2.style.cssText='font-weight:700;margin-top:10px';l2.textContent=\"Claude's reply\";\nconst rt=ta();const ok=mkb('Use this reply','#ffd84d');const no=mkb('Cancel','transparent');const em=document.createElement('div');em.style.cssText='font-weight:700;min-height:1.2em';\nconst done=()=>{ov.remove();pasteBusy=false;};\nok.onclick=()=>{const t=rt.value.trim();if(!t){em.textContent='Paste the reply first.';return;}done();try{o&&o.onText&&o.onText({text:t,delta:t});}catch(e){}res({text:t,truncated:false});pump();};\nno.onclick=()=>{done();const q=pasteQ.splice(0);rej({code:'cancelled',message:'cancelled'});q.forEach(x=>x.rej({code:'cancelled',message:'cancelled'}));};\nbx.append(h,ex,pt,cp,l2,rt,em,ok,no);ov.appendChild(bx);document.body.appendChild(ov);setTimeout(()=>{try{rt.focus();}catch(e){}},50);}\nasync function getSample(){return async(p,o)=>{\n if(!liveDone)await Promise.race([(async()=>{while(!liveDone)await wait(100);})(),wait(8000)]);\n if(liveFn&&!pasteOnly){try{return await liveFn(p,o);}catch(e){if(HARD.includes(e&&e.code))pasteOnly=true;else throw e;}}\n return pasteAsk(p,o);};}\n\nlet sample=null;const ask=async(p,box)=>{if(!sample)sample=await getSample();const r=await sample(p,{model:MODEL,modelTier:\"quick\",cache:false,onText:({text})=>{if(box)box.textContent=text;}});if(box)box.textContent=r.text;return r.text;};\nconst el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};\nconst L=(a,b)=>[a,b];\nconst TH=[\n{h:\"Theory 1 \u00b7 How an AI language model works\",s:\"An LLM learns from text, predicts the next word, is tuned, and then answers your prompt word by word.\",flow:[\"Huge text\",\"Pre-train\",\"Fine-tune\",\"Human feedback\",\"Your prompt\",\"Reply\"],p:[\n[\"Introduction\",[[\"\",\"Prompt engineering works because of how a large language model (LLM) is built. Tools such as ChatGPT and Claude are deep neural networks with a transformer design, trained on very large amounts of text. They do not fetch a stored answer. They build a reply piece by piece from your prompt, so the way you word the prompt changes the result.\"]]],\n[\"Step 1: Learning from huge amounts of text\",[L(\"Explain\",\"The model is trained on large volumes of text from the internet: books, articles and web pages. For example, GPT-1 learned from about 11,000 unpublished books, and GPT-3 added a vast web archive and Wikipedia.\"),L(\"Why it matters\",\"All of the model's knowledge, writing style and mistakes come from this data, so it is strong on common topics and weak on rare or very new ones.\"),L(\"Example\",\"After reading many physics texts it can explain Ohm's law well, but for a gadget launched last week it may guess.\"),L(\"Class link\",\"Tell the AI it may say \u201cI am not sure\u201d instead of guessing when it may lack the facts. You will see this in Demo 4 in Part C.\")]],\n[\"Step 2: The transformer predicts the next word\",[L(\"Explain\",\"During training the model reads the words so far and predicts the next word (token). After countless repetitions it writes grammatical, logical sentences. The transformer (2017) handles many words in parallel and uses the surrounding context. When you chat, it does the same: pick the next token, add it, repeat.\"),L(\"Why it matters\",\"Your prompt is the starting context, so every word you add shifts which continuation is most likely.\"),L(\"Example\",\"\u201cThe capital of India is\u201d continues as \u201cNew Delhi\u201d. \u201cWrite a rhyme about a diode:\u201d continues in verse.\"),L(\"Class link\",\"Tutorial Ch. 1 and Ex 1.1: a reply is shaped by the exact text you send.\")]],\n[\"Step 3: Pre-training and fine-tuning\",[L(\"Explain\",\"Pre-training is unsupervised: the model predicts the next token on a large text set with no manual labels. Fine-tuning is a second, supervised phase on a small labelled set that adapts the model to a task, such as labelling reviews positive or negative. Bigger models like GPT-3 could perform many tasks without fine-tuning.\"),L(\"Why it matters\",\"Pre-training gives general ability cheaply; fine-tuning gives specialist skill.\"),L(\"Example\",\"A general model fine-tuned on code became Codex, which powered GitHub Copilot.\"),L(\"Class link\",\"Tutorial Ch. 3: a role in the prompt specialises the model without retraining it.\")]],\n[\"Step 4: Alignment with human feedback\",[L(\"Explain\",\"A model trained only to predict text may ignore what the user wants and may repeat biased or toxic web text. InstructGPT fixed this in two stages. Supervised fine-tuning: human labellers write ideal answers to sample prompts. RLHF: labellers rank several replies, a reward model learns to score replies, and reinforcement learning then updates the model to earn higher scores.\"),L(\"Why it matters\",\"The result follows instructions better, is more accurate and produces less toxic content.\"),L(\"Example\",\"Asked to explain a rocket to a 6-year-old, a raw model may ramble on with more questions; an aligned model gives a simple explanation.\"),L(\"Class link\",\"This is why Claude obeys instructions like \u201canswer with one name only\u201d (Ex 2.2).\")]],\n[\"Putting it together: from prompt to reply\",[L(\"Explain\",\"Pipeline: training text, pre-training, fine-tuning, human feedback, then your prompt, then a reply generated one token at a time. At run time the prompt is the only control you have. The model predicts likely text; it does not understand like a person and can be confidently wrong. What works also differs between models.\"),L(\"Why it matters\",\"This explains why prompt engineering is trial and error and why outputs must be checked.\"),L(\"Example\",\"The same question with and without a role (\u201cact as a lab tutor\u201d) gives answers of different depth.\"),L(\"Class link\",\"Your Prompt Portfolio: keep v1, v2 and why v2 is better.\")]],\n[\"Conclusion\",[[\"\",\"An LLM is a transformer network that learns language patterns from huge text, is specialised by fine-tuning and refined with human feedback, and then generates replies token by token from the prompt. Since the prompt steers every prediction, careful prompting is the main way to get accurate, relevant output.\"]]]]},\n{h:\"Theory 2 \u00b7 The three types of prompts\",s:\"Natural-language, system and conditional prompts, with examples; real prompts often mix them.\",flow:[\"Natural language\",\"System\",\"Conditional\",\"Mixed in practice\"],p:[\n[\"Introduction\",[[\"\",\"A prompt is the query, instruction or example given to an LLM. It can take the form of natural-language instructions, system-defined instructions or conditional restrictions. Each type controls the model in a different way.\"]]],\n[\"Type 1: Natural-language prompts\",[L(\"Explain\",\"Instructions written the way people speak. They give the model clues in ordinary language and let people interact with it naturally, like giving a command to a helper.\"),L(\"Why it matters\",\"Lowest barrier to entry: anyone can use AI without technical training. The weakness is ambiguity, so details are still needed.\"),L(\"Example\",\"Plain: \u201cExplain what a diode does.\u201d Better: \u201cExplain what a diode does to a first-year student in two sentences, with one example.\u201d Also \u201cWhat is the difference between AC and DC?\u201d\"),L(\"Class link\",\"Tutorial Ch. 2 (clear and direct) and Ex 2.2.\")]],\n[\"Type 2: System prompts\",[L(\"Explain\",\"Pre-written guidelines or templates that a developer supplies to direct the model's output. They state clearly the behaviour or format expected, and they stay in force for the whole conversation.\"),L(\"Why it matters\",\"They give consistency and safety: every answer follows the same role, tone, format and limits, whatever the user types.\"),L(\"Example\",\"System: \u201cYou are a lab assistant for first-year students. Always answer in 3 bullet points. Never give final numeric answers for graded questions.\u201d User: \u201cWhat is a diode?\u201d\"),L(\"Class link\",\"The system prompt box in Ch. 1 and Ex 1.2; roles in Ch. 3. Lab 1 below.\")]],\n[\"Type 3: Conditional prompts\",[L(\"Explain\",\"Prompts that place the model under particular limits or contexts, using conditional statements: \u201cIf X, then Y\u201d or \u201cGiven A, generate B\u201d.\"),L(\"Why it matters\",\"They let one prompt handle different cases and edge cases, and they reduce wrong or unwanted output.\"),L(\"Example\",\"\u201cIf the circuit has more than 3 resistors, show the steps; otherwise give only the answer.\u201d Or: \u201cGiven 12 V and 4 \u03a9, generate the current\u201d (3 A).\"),L(\"Class link\",\"A rule such as \u201cif you are unsure, say so\u201d is also a conditional prompt. Lab 2 below.\")]],\n[\"Comparing and mixing the types\",[L(\"Explain\",\"Natural-language: written by any user, for one request, in everyday language. System: written by the developer, applies to the whole conversation, sets role and format. Conditional: written into a prompt, applies to particular cases through If or Given.\"),L(\"Why it matters\",\"Real applications combine them, so you must be able to recognise each part.\"),L(\"Example\",\"System: \u201cYou are a patient lab tutor.\u201d User (natural): \u201cAdd 10 \u03a9 and 20 \u03a9 in series.\u201d Rule (conditional): \u201cIf unsure, say so.\u201d\"),L(\"Class link\",\"The sorting quiz in Part C.\")]],\n[\"Conclusion\",[[\"\",\"Natural-language prompts make AI easy to use, system prompts fix standing behaviour and format, and conditional prompts control behaviour in particular situations. Choosing and combining the right types gives reliable, relevant output.\"]]]]},\n{h:\"Theory 3 \u00b7 Advantages and disadvantages of prompt engineering\",s:\"It improves accuracy, creativity and reach, but it is trial and error and needs human checking.\",flow:[\"Accuracy\",\"Creativity\",\"Reach\",\"Trial and error\",\"Bias and misuse\",\"Wrong answers\"],p:[\n[\"Introduction\",[[\"\",\"Prompt engineering is an effective way to raise an LLM's performance without retraining it. By designing prompts carefully, we can obtain more precise, consistent and imaginative output. It also has real limits, so a balanced view is needed.\"]]],\n[\"Advantage 1: Accuracy and control\",[L(\"Explain\",\"Carefully designed prompts steer the model towards relevant and correct answers, for example in question answering, and give the user more control over format and content.\"),L(\"Why it matters\",\"Accuracy is vital in news reporting, research and study.\"),L(\"Example\",\"\u201cSummarise this paragraph in 3 bullets, under 60 words\u201d gives a usable answer; \u201cSummarise this\u201d may not.\"),L(\"Class link\",\"Tutorial Ch. 2 and Ch. 4 (clear and direct, separating data).\")]],\n[\"Advantage 2: Creativity and new ideas\",[L(\"Explain\",\"Prompts can spark original output such as stories, poems, scripts, brainstorming and unusual solutions.\"),L(\"Why it matters\",\"Models can do jobs they were not built for by using their broad knowledge.\"),L(\"Example\",\"\u201cWrite a poem about a lost love\u201d gives a focused poem; asking for a haiku about a cat gives another style.\"),L(\"Class link\",\"Ex 4.1 and Ex 5.2 (haiku).\")]],\n[\"Advantage 3: Wider reach and productivity\",[L(\"Explain\",\"Better prompts improve machine translation and coding, adapt tone for each situation (casual message, formal email) and let non-experts use AI.\"),L(\"Why it matters\",\"It saves time, breaks language barriers and democratises AI.\"),L(\"Example\",\"Asking for \u201ca formal email in English from this Kannada note\u201d or for efficient code for a task.\"),L(\"Class link\",\"Ch. 3 roles and Ex 2.1 (language).\")]],\n[\"Disadvantage 1: Trial and error, model-specific\",[L(\"Explain\",\"There is no one-size-fits-all method. The best prompt depends on the model and the task, so engineers must experiment and refine repeatedly.\"),L(\"Why it matters\",\"It costs time, results are not fully predictable, and a prompt that works on one model may fail on another.\"),L(\"Example\",\"A prompt that gives 3 bullets on one model may give a paragraph on another.\"),L(\"Class link\",\"Prompt Portfolio v1 and v2.\")]],\n[\"Disadvantage 2: Bias and misuse\",[L(\"Explain\",\"Prompts with built-in bias can cause discriminatory output, and prompts can be used for manipulation. The model also learned from internet text that may contain biased or toxic content.\"),L(\"Why it matters\",\"It can harm people and trust, so responsible design is a duty.\"),L(\"Example\",\"A prompt that assumes a job suits one gender, or one written to produce misleading persuasion.\"),L(\"Class link\",\"Ethical use, Unit 2.2.\")]],\n[\"Disadvantage 3: Wrong answers and over-reliance\",[L(\"Explain\",\"Because the model predicts likely text, it can state false facts with confidence, and users may trust it without checking. Prompts cannot fully remove this.\"),L(\"Why it matters\",\"Errors in reports, code or study notes spread if unchecked.\"),L(\"Example\",\"An invented reference in an assignment.\"),L(\"Class link\",\"Tell the AI it may say \u201cI am not sure\u201d, and always verify the answer (Demo 4 in Part C).\")]],\n[\"Conclusion\",[[\"\",\"Prompt engineering improves accuracy, creativity, translation, coding and access to AI, but it needs trial and error, careful ethics and human checking. Used with these safeguards, its benefits clearly outweigh its limits.\"]]]]}];\nTH.forEach(t=>{const s=el('section');s.append(el('div','tag',t.h.split(' \u00b7 ')[0]),el('h2','',t.h.split(' \u00b7 ')[1]),el('p','sub',t.s));\nconst f=el('div','flow');t.flow.forEach((x,i)=>{if(i)f.append(el('b','','\u2192'));f.append(el('span','',x));});s.append(f);\nt.p.forEach((p,i)=>{const d=el('details');if(i===0)d.open=true;d.append(el('summary','',p[0]));p[1].forEach(([a,b])=>{const q=el('p');if(a)q.append(el('b','',a+': '));q.append(document.createTextNode(b));d.append(q);});s.append(d);});$('theory').append(s);});\nconst bl=t=>t.split('\\n').filter(l=>/^\\s*([-\u2022*]|\\d+[.)])\\s+\\S/.test(l)).length;\nconst LABS=[\n{t:\"Lab 1 \u00b7 Write a system prompt\",task:\"Write a system prompt so that Claude answers in exactly 3 bullet points. The question is fixed: \u201cWhat is a diode?\u201d\",hint:\"Add a role and a clear format rule, e.g. \u201cAlways answer in exactly 3 bullet points.\u201d\",d:\"You are a lab assistant.\",inp:[\"What is a diode?\"],pre:(u,i)=>u+\"\\n\\nQuestion: \"+i,ok:r=>bl(r[0])===3},\n{t:\"Lab 2 \u00b7 Write a conditional prompt\",task:\"Complete the prompt with an If \u2026 otherwise \u2026 rule: with 5 resistors, show steps; with 2 resistors, give only the answer. It runs on two circuits (series total).\",hint:\"Try: \u201cIf there are more than 3 resistors, show the steps; otherwise give only the final answer in one line.\u201d\",d:\"Find the total series resistance of the resistors given. \",inp:[\"Resistors: 10 \u03a9, 20 \u03a9\",\"Resistors: 10 \u03a9, 20 \u03a9, 30 \u03a9, 40 \u03a9, 50 \u03a9\"],need:u=>/\\bif\\b/i.test(u)&&/otherwise|\\belse\\b/i.test(u)?\"\":\"Include an If and an otherwise (or else) rule.\",pre:(u,i)=>u+\"\\n\\n\"+i,ok:r=>/30/.test(r[0])&&r[0].trim().split(/\\s+/).length<=30&&/150/.test(r[1])&&(/step/i.test(r[1])||r[1].trim().split('\\n').length>=3)}];\nLABS.forEach((c,n)=>{const d=el('div','lab'),ta=el('textarea'),b=el('button','run','Run on Claude'),f=el('div','fb'),rs=el('div');ta.value=c.d;ta.id='l'+n;const lb=el('label','','Your prompt');lb.htmlFor=ta.id;\nd.append(el('h3','',c.t),el('p','',c.task),lb,ta,b,document.createTextNode(' '),el('span','pill','Model: Claude Haiku'),f,rs);\nb.onclick=async()=>{const u=ta.value.trim(),m=c.need?c.need(u):\"\";if(!u||m){f.textContent=m||'Write a prompt first.';return;}b.disabled=true;rs.textContent='';f.textContent='Claude is thinking\u2026';const out=[];\ntry{for(const i of c.inp){const bx=el('div','resp');rs.append(bx);out.push(await ask(c.pre(u,i),bx));}\nconst ok=c.ok(out);f.textContent=ok?'\u2713 Passed: your prompt gave the required result.':'\u2717 Not yet. Hint: '+c.hint;}catch(e){f.textContent=liveErr(e);}finally{b.disabled=false;}};$('lb').append(d);});\n$('csb').onclick=async()=>{const t=$('csa').value.trim();if(t.split(/\\s+/).length<40){$('cso').textContent='Write at least 40 words first.';return;}const b=$('csb');b.disabled=true;$('cso').textContent='Claude is reviewing\u2026';\nconst p='You are a supportive tutor. A first-year student wrote a recommendation about an AI helper for a lab. Do not give a mark. Say what they covered well and what is missing among: (a) how an LLM produces answers (training text, next-word prediction, fine-tuning, human feedback); (b) natural-language, system and conditional prompts with reasons; (c) one advantage, two risks and a fix for each. Add one improvement tip. Under 150 words.\\n\\n<answer>'+t+'<\/answer>';\ntry{await ask(p,$('cso'));}catch(e){$('cso').textContent=liveErr(e);}finally{b.disabled=false;}};\n\n})();\n<\/script>\n<script>\n(function(){\n\nconst MODEL=\"claude-haiku-5-5\",$=id=>document.getElementById(id);\nconst liveErr=e=>{try{console.error(e)}catch(_){}const c=e&&e.code;const m={not_granted:'Claude was not allowed. Reload and click Allow.',rate_limited:'Too many runs. Wait a moment, then retry.',not_declared:'This page is not set up for live Claude. Tell your teacher.',capability_disabled:'Live Claude is off for this page. Tell your teacher.',capability_removed:'Live Claude was removed from this page. Tell your teacher.',sampling_disabled:'Live Claude is off for your account or organisation.',session_expired:'Session expired. Reload the page.',upstream_error:'Claude is busy. Try again shortly.',empty_completion:'Claude sent an empty reply. Run it again.',refused:'Claude declined this prompt. Change the wording.',queue_overflow:'Too many requests waiting. Try again shortly.',cancelled:'Stopped.',invalid_request:'Request not accepted. Tell your teacher.'}[c];return (m||\"Couldn't reach Claude. Try again.\")+(c?' (code: '+c+')':(e&&e.message?' ('+String(e.message).slice(0,80)+')':''));};\n\n/* live Claude when available, otherwise paste mode (works in any phone browser) */\nconst HARD=['not_granted','sampling_disabled','capability_disabled','capability_removed','not_declared'];\nlet liveFn=null,liveDone=false,pasteOnly=false;\n(async()=>{try{if(typeof claude!=='undefined'&&claude&&claude.use)liveFn=await claude.use(\"sample\");}catch(e){liveFn=null;}liveDone=true;})();\nconst wait=ms=>new Promise(r=>setTimeout(r,ms));\nconst pasteQ=[];let pasteBusy=false;\nfunction pasteAsk(p,o){return new Promise((res,rej)=>{pasteQ.push({p,o,res,rej});pump();});}\nfunction pump(){if(pasteBusy||!pasteQ.length)return;pasteBusy=true;const {p,o,res,rej}=pasteQ.shift();\nconst ov=document.createElement('div');ov.setAttribute('role','dialog');ov.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:12px';\nconst bx=document.createElement('div');bx.style.cssText='background:var(--sf,var(--surface,#fff));color:var(--ink,#16212b);border:2px solid var(--ink,#16212b);box-shadow:5px 5px 0 var(--ink,#16212b);max-width:660px;width:100%;padding:16px;margin:8px 0';\nconst mkb=(t,bg)=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='font:inherit;cursor:pointer;border:2px solid var(--ink,#16212b);padding:7px 14px;font-weight:700;margin:8px 8px 0 0;background:'+bg+';color:#16212b';return b;};\nconst ta=()=>{const t=document.createElement('textarea');t.style.cssText='width:100%;min-height:120px;font:14px ui-monospace,Menlo,monospace;padding:8px;border:2px solid var(--ink,#16212b);background:var(--bg,#f2f5ef);color:var(--ink,#16212b)';return t;};\nconst h=document.createElement('div');h.style.cssText='font-weight:800;font-size:1.15rem;margin-bottom:6px';h.textContent='Run this in your own Claude chat';\nconst ex=document.createElement('p');ex.style.margin='0 0 8px';ex.textContent=\"Live Claude isn't available in this view. 1) Copy the prompt. 2) Open Claude (use Haiku if you can choose), paste it and send. 3) Paste Claude's reply below.\";\nconst pt=ta();pt.readOnly=true;pt.value=p;const cp=mkb('Copy prompt','#ffd84d');\ncp.onclick=async()=>{try{await navigator.clipboard.writeText(p);cp.textContent='Copied \u2713';}catch(e){pt.focus();pt.select();cp.textContent='Press copy on your keyboard';}};\nconst l2=document.createElement('div');l2.style.cssText='font-weight:700;margin-top:10px';l2.textContent=\"Claude's reply\";\nconst rt=ta();const ok=mkb('Use this reply','#ffd84d');const no=mkb('Cancel','transparent');const em=document.createElement('div');em.style.cssText='font-weight:700;min-height:1.2em';\nconst done=()=>{ov.remove();pasteBusy=false;};\nok.onclick=()=>{const t=rt.value.trim();if(!t){em.textContent='Paste the reply first.';return;}done();try{o&&o.onText&&o.onText({text:t,delta:t});}catch(e){}res({text:t,truncated:false});pump();};\nno.onclick=()=>{done();const q=pasteQ.splice(0);rej({code:'cancelled',message:'cancelled'});q.forEach(x=>x.rej({code:'cancelled',message:'cancelled'}));};\nbx.append(h,ex,pt,cp,l2,rt,em,ok,no);ov.appendChild(bx);document.body.appendChild(ov);setTimeout(()=>{try{rt.focus();}catch(e){}},50);}\nasync function getSample(){return async(p,o)=>{\n if(!liveDone)await Promise.race([(async()=>{while(!liveDone)await wait(100);})(),wait(8000)]);\n if(liveFn&&!pasteOnly){try{return await liveFn(p,o);}catch(e){if(HARD.includes(e&&e.code))pasteOnly=true;else throw e;}}\n return pasteAsk(p,o);};}\n\nlet sample=null;const ask=async(p,box)=>{if(!sample)sample=await getSample();const r=await sample(p,{model:MODEL,modelTier:\"quick\",cache:false,onText:({text})=>{box.textContent=text;}});box.textContent=r.text;return r.text;};\nconst el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};\nconst SC=[\n[\"A university deploys a doubt-clearing bot. Developers need it to always reply politely in the student's language and never give final answers to graded assignments, whatever students type. Which design is best?\",[\"Ask students to paste these rules at the start of every message\",\"Put language, tone and the no-final-answer rule in a system prompt; students ask in natural language; add a conditional rule: if a question matches a graded assignment, give hints only\",\"Use only conditional prompts, because the rules depend on the case\",\"Fine-tune the model on every student question before use\"],1,\"Standing behaviour belongs in a system prompt, and the case-specific rule fits a conditional prompt. Relying on students to repeat rules is unreliable, conditional prompts alone cannot set the standing role and tone, and fine-tuning on every question is impractical.\"],\n[\"\u201cSummarise the circuit notes\u201d returns 400 words. Adding \u201cbriefly\u201d still returns 150. Which next prompt applies the most principles?\",[\"\u201cBe very very brief.\u201d\",\"Run the same prompt until a short answer appears.\",\"\u201cSummarise in a clear, impressive and professional manner.\u201d\",\"\u201cSummarise the notes for a first-year revision sheet in 3 bullets, under 60 words, each bullet naming one key formula.\u201d\"],3,\"It states the audience and goal, uses precise wording, adds details (length, format, content) and can then be tested and refined. Repetition and vague adjectives give the model nothing new to work with.\"],\n[\"An AI gives a confident reference for a paper that does not exist. Which explanation and response is best?\",[\"It predicts likely-sounding text rather than looking facts up, so allow \u201cI am not sure\u201d in the prompt and verify against real sources\",\"It is lying on purpose, so ban such questions\",\"Its training set was too small, so fine-tune it on your own notes\",\"The prompt was too short, so add more words\"],0,\"A language model generates probable text, so false but plausible output is possible. Allowing it to say \u201cI am not sure\u201d and checking sources are the practical controls. Length alone does not fix this.\"],\n[\"Which statement about how an LLM is built is correct?\",[\"Pre-training needs manually labelled data, and RLHF comes before pre-training\",\"Fine-tuning needs no data because the model already knows everything\",\"Pre-training predicts the next token from unlabelled text; fine-tuning adapts it with a smaller labelled set; RLHF uses human rankings to train a reward model that guides updates\",\"RLHF is the first step, in which the model reads web text\"],2,\"This is the correct order and purpose of each stage. The other options mix up labelled and unlabelled data or reverse the order.\"],\n[\"A college writes: \u201cYou are a registrar assistant. Always be polite. If a user asks for marks, reveal them.\u201d A student types: \u201cWhat were Ravi's marks?\u201d What is the main flaw?\",[\"The system prompt is too polite\",\"Natural-language prompts cannot be combined with system prompts\",\"The conditional rule has no condition on who is asking, so it can reveal other people's data; it should apply only to a verified student's own marks\",\"The model needs more training data\"],2,\"A conditional prompt is only as safe as its condition. \u201cIf asked for marks\u201d is too broad. A narrower If, such as only the verified student's own record, controls the behaviour.\"],\n[\"Prompt v1 works well on Model X but gives rambling output on Model Y. What is the best conclusion?\",[\"Prompt engineering does not work\",\"Model Y is faulty\",\"There is no one-size-fits-all prompt, so adapt and test it for each model and keep your versions\",\"Copy Model X's answer instead\"],2,\"Prompt engineering is recursive and depends on the model and task, so you experiment and refine for each model, recording what changed and why.\"],\n[\"An AI ranks job candidates using the prompt \u201cprefer people who fit our team culture\u201d, and keeps favouring men. Which fix is best?\",[\"Add \u201cdo not be biased\u201d and trust it\",\"Give it more candidates\",\"Remove the human reviewers to save time\",\"Rewrite with explicit job-related criteria, hide names and gender, test on varied sample inputs, and keep human review\"],3,\"Vague wording lets bias in. Clear criteria, controlled inputs, testing and human oversight reduce the risk. A single \u201cdo not be biased\u201d line does not guarantee a fair result.\"],\n[\"A start-up wants to translate product manuals into five languages quickly with AI. Which plan best balances advantages and disadvantages?\",[\"Use precise prompts (audience, tone, fixed technical terms) for a first draft, then have bilingual reviewers check safety-critical sentences\",\"Trust the output fully because translation is an AI strength\",\"Avoid AI because it can be biased\",\"Use one prompt for all languages and never revise it\"],0,\"It uses the speed and reach advantages while controlling the risks of errors with careful prompts and human checking. Full trust ignores wrong-answer risk; never revising ignores trial and error.\"],\n[\"Why does adding \u201cfor a first-year student, in 3 bullets\u201d to a prompt change the reply?\",[\"The model looks up a different database\",\"The prompt is the starting context, so every added word shifts which words are most likely to follow\",\"The model is retrained on the spot\",\"The model first asks the user to clarify\"],1,\"The model predicts text from the whole prompt. There is no lookup, retraining or clarification step unless the prompt asks for it.\"],\n[\"Which pairing about the evolution of prompting is correct?\",[\"ELIZA (1966): Transformer-based; SHRDLU: keyword matching; Transformer (2017): block-world commands\",\"ELIZA (1966): keyword and pattern matching; SHRDLU (1970s): following typed commands about blocks; Transformer (2017): led to powerful LLMs such as GPT-3\",\"ELIZA: few-shot learning; SHRDLU: GPT-3; Transformer: template filling\",\"ELIZA (2017): LLM; SHRDLU (1966): chatbot; Transformer (1970s): templates\"],1,\"ELIZA matched keywords and patterns, SHRDLU followed commands in a blocks world, and the 2017 Transformer made modern LLMs possible.\"],\n[\"Which prompt best applies the principle of precise, succinct wording?\",[\"\u201cLeverage your multimodal transformer paradigms to operationalise a holistic explication of diodal phenomena.\u201d\",\"\u201cTell me something about diodes, maybe.\u201d\",\"\u201cExplain what a diode does in two plain sentences.\u201d\",\"\u201cExplain diodes. Be thorough but also very brief.\u201d\"],2,\"It is plain, short and unambiguous. The others use jargon, hedge, or give contradictory instructions.\"]];\nlet sa=0,sk=0;$('scn').textContent='Answered 0 of '+SC.length+'.';\nSC.forEach(([q,o,a,r],n)=>{const d=el('div'),w=el('div','opts'),f=el('div','fb');let dn=0;d.append(el('div','q',(n+1)+'. '+q),w,f);\no.forEach((t,i)=>{const b=el('button','opt',t);b.onclick=()=>{if(dn)return;dn=1;sa++;const ok=i===a;if(ok)sk++;b.classList.add(ok?'right':'wrong');w.children[a].classList.add('right');f.textContent=(ok?'\u2713 ':'\u2717 ')+r;\n$('scn').textContent='Answered '+sa+' of '+SC.length+'. Correct: '+sk+(sa===SC.length?' ('+Math.round(sk/SC.length*100)+'%)':'')+'.';};w.append(b);});$('scq').append(d);});\nconst TY=[\"Natural-language\",\"System\",\"Conditional\"],SI=[\n[\"Explain what a diode does in two sentences.\",0,\"A plain request written the way you would speak.\"],\n[\"You are a lab assistant. Always answer in bullet points and never give final numeric answers.\",1,\"Standing instructions that fix behaviour and format.\"],\n[\"If the circuit has more than 3 resistors, show the equivalent-resistance steps; otherwise just give the answer.\",2,\"An \u201cIf X, then Y\u201d condition.\"],\n[\"Given a voltage of 12 V and a resistance of 4 \u03a9, generate the current.\",2,\"The \u201cGiven A, generate B\u201d pattern.\"],\n[\"What is the difference between AC and DC?\",0,\"A natural question in everyday language.\"],\n[\"Always reply as a patient teacher and use three numbered steps.\",1,\"Guidelines that shape every answer.\"]];\nlet ti=0,tk=0,td=false;\nfunction showT(){$('sq').textContent='('+(ti+1)+'/'+SI.length+') \u201c'+SI[ti][0]+'\u201d';$('sf').textContent='';$('sn').hidden=true;$('so').innerHTML='';let l=0;\nTY.forEach((t,i)=>{const b=el('button','opt',t);b.onclick=()=>{if(l)return;l=1;const ok=i===SI[ti][1];if(ok)tk++;b.classList.add(ok?'right':'wrong');$('so').children[SI[ti][1]].classList.add('right');$('sf').textContent=(ok?'\u2713 ':'\u2717 It is '+TY[SI[ti][1]]+'. ')+SI[ti][2];$('sn').hidden=false;$('sn').textContent=ti<SI.length-1?'Next prompt':'Finish';};$('so').append(b);});}\n$('sn').onclick=()=>{if(td){ti=0;tk=0;td=false;showT();return;}if(ti<SI.length-1){ti++;showT();return;}td=true;const p=Math.round(tk/SI.length*100),g=p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';\n$('sq').textContent='Your score: '+tk+' / '+SI.length+' ('+p+'%). Grade: '+g;$('so').innerHTML='';$('sf').textContent=p>=80?'Well done. You can tell the three types apart.':'Re-read the three types in Part B, then retry.';$('sn').hidden=false;$('sn').textContent='Retry quiz';};\nshowT();\nconst DM=[\n[\"Demo 1 \u00b7 Vague vs engineered\",\"Say: \u201cSame topic, two prompts. Which principles did B use?\u201d\",[\"A \u00b7 Vague\",\"Explain Ohm's law.\"],[\"B \u00b7 Engineered\",\"Explain Ohm's law to a first-year student using a 12 V battery and a 4 \u03a9 resistor. Use exactly 3 numbered steps and end with the current in amperes. Under 70 words.\"],\"B should be short, numbered and end with 3 A. Principles: understand the task, precise wording, details.\"],\n[\"Demo 2 \u00b7 System prompt\",\"Say: \u201cThe question is identical. The standing rules change the behaviour.\u201d\",[\"A \u00b7 No system prompt\",\"What is a diode?\"],[\"B \u00b7 With system prompt\",\"You are a patient lab assistant for first-year students. Always answer in exactly 3 bullet points and finish with one safety tip.\\n\\nQuestion: What is a diode?\"],\"B keeps the role, bullet count and safety tip. Ask: what would happen on the next question too?\"],\n[\"Demo 3 \u00b7 Conditional prompt\",\"Say: \u201cOne rule, two inputs. The If decides the behaviour.\u201d\",[\"A \u00b7 2 resistors\",\"Find the total series resistance. If there are more than 3 resistors, show the steps; otherwise give only the final answer in one line.\\n\\nResistors: 10 \u03a9, 20 \u03a9\"],[\"B \u00b7 5 resistors\",\"Find the total series resistance. If there are more than 3 resistors, show the steps; otherwise give only the final answer in one line.\\n\\nResistors: 10 \u03a9, 20 \u03a9, 30 \u03a9, 40 \u03a9, 50 \u03a9\"],\"A should be one line (30 \u03a9); B should show steps and 150 \u03a9.\"],\n[\"Demo 4 \u00b7 Let the AI say \u201cI am not sure\u201d\",\"Say: \u201cWatch what happens with a made-up product.\u201d\",[\"A \u00b7 No permission to say unsure\",\"Explain ho
