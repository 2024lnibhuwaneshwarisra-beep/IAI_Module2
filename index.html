nt:11.5px system-ui,sans-serif\\\">Huge unlabelled text<\\/text><text x=\\\"76\\\" y=\\\"96\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">No manual labels<\\/text><line x1=\\\"144\\\" y1=\\\"70\\\" x2=\\\"170\\\" y2=\\\"70\\\" style=\\\"stroke:var(--ink);stroke-width:2\\\" marker-end=\\\"url(#ar)\\\"/><rect x=\\\"172\\\" y=\\\"20\\\" width=\\\"132\\\" height=\\\"100\\\" style=\\\"fill:var(--sf);stroke:var(--ink);stroke-width:2\\\"/><text x=\\\"239\\\" y=\\\"44\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--ink);font:700 13px system-ui,sans-serif\\\">Fine-tuning<\\/text><text x=\\\"239\\\" y=\\\"66\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">Small labelled set<\\/text><text x=\\\"239\\\" y=\\\"81\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">Supervised phase<\\/text><text x=\\\"239\\\" y=\\\"96\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">Improves behaviour<\\/text><line x1=\\\"307\\\" y1=\\\"70\\\" x2=\\\"332\\\" y2=\\\"70\\\" style=\\\"stroke:var(--ink);stroke-width:2\\\" marker-end=\\\"url(#ar)\\\"/><rect x=\\\"335\\\" y=\\\"20\\\" width=\\\"132\\\" height=\\\"100\\\" style=\\\"fill:var(--sf);stroke:var(--ink);stroke-width:2\\\"/><text x=\\\"401\\\" y=\\\"44\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--ink);font:700 13px system-ui,sans-serif\\\">Your prompt<\\/text><text x=\\\"401\\\" y=\\\"66\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">Natural-language,<\\/text><text x=\\\"401\\\" y=\\\"81\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">system or<\\/text><text x=\\\"401\\\" y=\\\"96\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">conditional<\\/text><line x1=\\\"470\\\" y1=\\\"70\\\" x2=\\\"494\\\" y2=\\\"70\\\" style=\\\"stroke:var(--ink);stroke-width:2\\\" marker-end=\\\"url(#ar)\\\"/><rect x=\\\"498\\\" y=\\\"20\\\" width=\\\"132\\\" height=\\\"100\\\" style=\\\"fill:var(--sf);stroke:var(--ink);stroke-width:2\\\"/><text x=\\\"564\\\" y=\\\"44\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--ink);font:700 13px system-ui,sans-serif\\\">Reply<\\/text><text x=\\\"564\\\" y=\\\"66\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">Likely text, not a<\\/text><text x=\\\"564\\\" y=\\\"81\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">fact lookup: check<\\/text><text x=\\\"564\\\" y=\\\"96\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">important claims<\\/text><text x=\\\"320\\\" y=\\\"152\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">Diagram: from training to your reply<\\/text><\\/svg>\", \"tables\": [[\"Natural-language vs system vs conditional prompts\", [\"\", \"Natural-language\", \"System\", \"Conditional\"], [[\"What it is\", \"Instructions written the way people talk\", \"Standing guidelines or a template set by a developer\", \"Limits or contexts using If X then Y, or Given A generate B\"], [\"Who usually writes it\", \"The user\", \"The developer or course designer\", \"Either\"], [\"Example\", \"\u201cExplain what a diode does in two sentences.\u201d\", \"\u201cYou are a lab assistant. Always answer in bullet points.\u201d\", \"\u201cIf there are more than 3 resistors, show the steps.\u201d\"], [\"Best for\", \"Everyday requests\", \"Fixing role, tone and format for every reply\", \"Handling different cases differently\"], [\"Weakness\", \"Easy to be vague\", \"Hidden from the user; must be tested\", \"Missed cases if the conditions are incomplete\"]]], [\"Pre-training vs fine-tuning\", [\"\", \"Pre-training\", \"Fine-tuning\"], [[\"Data\", \"Very large text collections\", \"Small labelled set\"], [\"Supervision\", \"Unsupervised: predicts the next token\", \"Supervised: examples with correct answers\"], [\"Result\", \"General language ability\", \"More useful, safer, task-aware behaviour\"]]]], \"mk\": {\"h\": \"10-mark practice: how prompt engineering works\", \"q\": \"Explain how prompt engineering works. Describe the five guiding principles and give one short example of each. (10 marks)\", \"scheme\": [[\"Defines prompt engineering as designing and refining prompts to get the output you want\", 1], [\"Says it is iterative or recursive, with no one-size-fits-all method\", 1], [\"Principle 1: understand the task thoroughly, with an example\", 2], [\"Principle 2: precise, succinct wording, with an example\", 2], [\"Principle 3: give details (topic, audience, length, tone), with an example\", 2], [\"Principle 4: give examples, linking to one-shot and few-shot, and Principle 5: experiment and refine\", 2]], \"model\": \"Prompt engineering is designing and refining the instructions given to a language model so that it produces the output we want. It is iterative: the best approach depends on the model and the task, so engineers follow five principles. (1) Understand the task: decide whether you need an answer, a summary or code, e.g. \u201cWrite revision notes on series circuits\u201d instead of \u201cTell me about circuits\u201d. (2) Use precise, short wording, e.g. \u201cSummarise in 3 bullets, under 60 words\u201d. (3) Give details such as audience, length and tone, e.g. \u201cExplain Ohm's law to a first-year student using a 12 V battery and a 4 \u03a9 resistor\u201d. (4) Give examples of the output you want, which leads to one-shot and few-shot prompting. (5) Experiment: run the prompt, read the reply, change one thing and repeat.\"}};\nconst st=document.createElement('style');\nst.textContent='.tb{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--sf)}.tb th,.tb td{border:2px solid var(--ink);padding:6px 9px;text-align:left;vertical-align:top;color:var(--ink)}.tb th{background:var(--hi);color:#16212b}.tb td:first-child{font-weight:700}.vis{border:2px solid var(--ink);background:var(--sf);padding:12px;margin:12px 0}.vis img{max-width:100%;height:auto;display:block;margin:6px 0;border:2px solid var(--ink)}.mk textarea{width:100%;min-height:150px;font:inherit;padding:8px;border:2px solid var(--ink);background:var(--bg);color:var(--ink)}.mk label.sc{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-weight:400}.mkn{font-weight:800;margin-top:8px}';\ndocument.head.appendChild(st);\nconst E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};\nconst sec=E('section');sec.append(E('div','tag','Compare and picture it'),E('h2','','Tables and diagrams'));\nconst dv=E('div','vis');dv.append(E('b','',X.gifh));const im=E('img');im.src=X.gif;im.alt=X.gifh;dv.appendChild(im);\nconst sv=E('div');sv.innerHTML=X.svg;dv.appendChild(sv);sec.appendChild(dv);\nX.tables.forEach(([t,hd,rows])=>{const w=E('div','vis');w.appendChild(E('b','',t));const o=E('div');o.style.overflowX='auto';const tb=E('table','tb');\nconst tr=E('tr');hd.forEach(x=>tr.appendChild(E('th','',x)));tb.appendChild(tr);rows.forEach(r=>{const q=E('tr');r.forEach(x=>q.appendChild(E('td','',x)));tb.appendChild(q);});o.appendChild(tb);w.appendChild(o);sec.appendChild(w);});\nconst th=document.getElementById('theory');th.parentNode.insertBefore(sec,th.nextSibling);\n/* 10-mark practice */\nconst m=X.mk,ms=E('section','mk');ms.append(E('div','tag','Exam practice \u00b7 10 marks'),E('h2','',m.h));\nconst q=E('p');q.append(E('b','','Question: '),m.q);const ta=E('textarea');ta.placeholder='Write your answer here, then open the marking scheme and mark yourself honestly.';ta.setAttribute('aria-label','Your answer');\nconst d=E('details');d.appendChild(E('summary','','Show marking scheme and model answer (after you try)'));\nd.appendChild(E('p','','Tick each point your answer earned. Give the marks shown, no half marks.'));\nconst out=E('div','mkn','Your mark: 0 / 10');out.setAttribute('role','status');let cs=[];\nm.scheme.forEach(([t,k])=>{const l=E('label','sc');const c=E('input');c.type='checkbox';c.onchange=()=>{let s=0;cs.forEach((x,i)=>{if(x.checked)s+=m.scheme[i][1];});out.textContent='Your mark: '+s+' / 10';};cs.push(c);l.append(c,E('span','',t+' ('+k+(k>1?' marks)':' mark)')));d.appendChild(l);});\nd.append(out,E('p','','Model answer:'),E('p','',m.model));\nms.append(q,ta,d);\nconst host=document.getElementById('pgC')||document.querySelector('main');host.appendChild(ms);\n})();\nasync function JUDGE(task,u,reply){try{if((typeof pasteOnly!=='undefined'&&pasteOnly)||(typeof liveFn!=='undefined'&&!liveFn))return false;\nconst s=await getSample();const p='You are a fair marker. A student had this lab task:\\n<task>'+task+'<\/task>\\nThe student wrote this prompt:\\n<prompt>'+u+'<\/prompt>\\nClaude produced:\\n<reply>'+reply+'<\/reply>\\nDoes the output meet every requirement in the task? Ignore small wording differences and judge the requirement itself. Answer with one word: YES or NO.';\nconst r=await s(p,{model:MODEL,modelTier:\"quick\",cache:false});return /^\\s*YES\\b/i.test(r.text);}catch(e){return false;}}\n<\/script>\n<\/body><\/html>", "unit-2-2": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Module 2 \u00b7 Unit 2.2 \u00b7 Prompt Engineering in Communication<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f2f5ef;--grid:#d5e0d3;--sf:#fff;--ink:#16212b;--mute:#4c5b66;--blue:#1f5fd6;--hi:#ffd84d;--ok:#1f8f5a;--bad:#d23b41;--okbg:#dff3e7;--badbg:#fbe0e1;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10171d;--grid:#1c2830;--sf:#18222a;--ink:#eaf0f3;--mute:#9fb0ba;--blue:#7fb0ff;--ok:#52d196;--bad:#ff7b80;--okbg:#14382a;--badbg:#44191c}}\n:root[data-theme=\"dark\"]{--bg:#10171d;--grid:#1c2830;--sf:#18222a;--ink:#eaf0f3;--mute:#9fb0ba;--blue:#7fb0ff;--ok:#52d196;--bad:#ff7b80;--okbg:#14382a;--badbg:#44191c}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:17px/1.55 \"Atkinson Hyperlegible\",system-ui,sans-serif}\nmain{max-width:860px;margin:0 auto;padding:18px 16px 60px}\nh1,h2,h3{font-family:\"Bricolage Grotesque\",system-ui,sans-serif;line-height:1.1;margin:0}\nh1{font-size:clamp(2rem,6.5vw,3.2rem);font-weight:800;letter-spacing:-.02em}\nh2{font-size:1.45rem;font-weight:800}h3{font-size:1.1rem}\n.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}\n.nav span,.nav a{border:2px solid var(--ink);padding:2px 10px;font-weight:700;font-size:.9rem;background:var(--sf);color:var(--ink);text-decoration:none}\n.nav .on{background:var(--hi);color:#16212b}.nav .off{opacity:.45}\n.sub{color:var(--mute);max-width:64ch;margin:6px 0}\nsection{background:var(--sf);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:18px;margin-top:26px}\n.tag{font-weight:700;color:var(--blue);font-size:.9rem}\nbutton{font:inherit;cursor:pointer;color:var(--ink)}\n:focus-visible{outline:3px solid var(--blue);outline-offset:2px}\ndetails{border:2px solid var(--ink);background:var(--bg);margin:8px 0;padding:8px 12px}\nsummary{cursor:pointer;font-weight:700}details p{margin:6px 0}\n.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0;font-weight:700}\n.flow span{border:2px solid var(--ink);background:var(--hi);color:#16212b;padding:3px 10px}\n.q{font-weight:700;margin:12px 0 4px}\n.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}\n.opt{border:2px solid var(--ink);background:var(--sf);padding:8px 14px;font-weight:700;text-align:left}\n.opt:hover:not(:disabled){background:var(--hi);color:#16212b}\n.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}\n.fb{font-weight:700;min-height:1.4em}\nlabel{display:block;font-weight:700;font-size:.88rem;color:var(--mute);margin:8px 0 2px}\ntextarea,select,.lock{width:100%;font:inherit;font-family:ui-monospace,Menlo,monospace;font-size:.9rem;padding:8px;border:2px solid var(--ink);background:var(--bg);color:var(--ink)}\ntextarea{min-height:84px;resize:vertical}select{width:auto}\n.lock{border-style:dashed;white-space:pre-wrap}\n.run{margin-top:10px;border:2px solid var(--ink);background:var(--hi);color:#16212b;font-weight:700;padding:8px 18px;box-shadow:3px 3px 0 var(--ink)}\n.run:disabled{opacity:.6;cursor:wait}\n.hint{margin-left:8px;border:2px solid var(--ink);background:var(--sf);padding:6px 12px}\n.lab{border:2px solid var(--ink);padding:14px;margin-top:14px;background:var(--bg)}.lab.pass{border-color:var(--ok)}\n.resp{margin-top:8px;padding:8px 10px;border:2px dashed var(--ink);white-space:pre-wrap;font-size:.92rem;min-height:2.6em;background:var(--sf)}\n.resp.ok{background:var(--okbg);border:2px solid var(--ok)}.resp.no{background:var(--badbg);border:2px solid var(--bad)}\n.pill{background:var(--hi);color:#16212b;border:2px solid var(--ink);padding:1px 10px;font-weight:700;font-size:.85rem}\n.score{margin-top:10px;font-weight:700}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<main>\n<div class=\"nav\"><a href=\"hub.html\">Module 2 hub<\/a><a href=\"unit-2-1.html\">2.1 Intro<\/a><span class=\"on\">2.2 Communication<\/span><a href=\"unit-2-3-part1.html\">2.3 Techniques (1/2)<\/a><a href=\"unit-2-3-part2.html\">2.3 (2/2)<\/a><a href=\"unit-2-4.html\">2.4 Creative<\/a><a href=\"unit-2-5.html\">2.5 Writing<\/a><\/div>\n<h1>Unit 2.2: Prompt Engineering in Communication<\/h1>\n<p class=\"sub\">Module 2 \u00b7 2 lecture hours \u00b7 Topics: the function of prompt engineering in communication, its advantages, and the future of LLM communication. Learn the theory, then apply it to scenarios, live labs and a case study.<\/p>\n<details class=\"tutg\" style=\"margin:10px 0 16px;border:2px solid var(--ink);background:var(--sf);padding:8px 12px\"><summary style=\"cursor:pointer;font-weight:700\">What do the \u201cTutorial Ch.\u201d notes mean?<\/summary><p>They point to Anthropic's free <i>Prompt Engineering Interactive Tutorial<\/i> (<a href=\"https://github.com/anthropics/prompt-eng-interactive-tutorial\" target=\"_blank\" rel=\"noopener\">github.com/anthropics/prompt-eng-interactive-tutorial<\/a>). You do not need it: each note names the idea, and this key explains it. \u201cEx 2.1\u201d means Chapter 2, exercise 1.<\/p><div style=\"overflow-x:auto\"><table class=\"tb\"><tr><th>Ch.<\/th><th>Idea<\/th><\/tr>\n<tr><td>1<\/td><td>Basic structure: a prompt is a message, optionally with a system prompt<\/td><\/tr><tr><td>2<\/td><td>Be clear and direct: say exactly what you want<\/td><\/tr><tr><td>3<\/td><td>Assign a role to change tone and skill<\/td><\/tr><tr><td>4<\/td><td>Separate data from instructions with tags<\/td><\/tr><tr><td>5<\/td><td>Format the output, even start the reply for the model<\/td><\/tr><tr><td>6<\/td><td>Let the model think step by step<\/td><\/tr><tr><td>7<\/td><td>Use examples (few-shot)<\/td><\/tr><tr><td>8<\/td><td>Avoid hallucinations: allow \u201cI don't know\u201d<\/td><\/tr><tr><td>9<\/td><td>Combine everything into a complex prompt<\/td><\/tr><\/table><\/div><\/details><div id=\"theory\"><\/div>\n\n<section id=\"apply\">\n<div class=\"tag\">Apply it \u00b7 Scenarios<\/div><h2>Scenario questions: choose the best answer<\/h2>\n<p class=\"sub\">Each describes a real situation. Choose the best answer, then read why. More than one option may sound sensible, so read every option.<\/p>\n<div id=\"quiz\"><\/div><div class=\"score\" id=\"qs\"><\/div>\n<\/section>\n\n<section id=\"labs\">\n<div class=\"tag\">Apply it \u00b7 Live on Claude<\/div><h2>Four labs<\/h2>\n<p class=\"sub\">Write a prompt, run it, and the page checks the reply. <span class=\"pill\">Model: Claude Haiku (same for the class)<\/span> Replies vary a little, so run again if you narrowly miss.<\/p>\n<div id=\"labbox\"><\/div><div class=\"score\" id=\"ls\"><\/div>\n<\/section>\n\n<section id=\"case\">\n<div class=\"tag\">Apply it \u00b7 Case study<\/div><h2>Design a university helpdesk assistant<\/h2>\n<p class=\"sub\"><b>Scenario:<\/b> A university wants an AI helpdesk for first-year engineering students. It must answer admission and timetable questions politely, reply in Kannada or Hindi on request, avoid assumptions about the student, and answer only from the official handbook text. Write the prompt it needs, then explain which roles, advantages and ideas from this unit you used.<\/p>\n<label for=\"cs\">Your prompt and justification<\/label>\n<textarea id=\"cs\" style=\"min-height:150px\" placeholder=\"Prompt: \u2026  Justification: \u2026\"><\/textarea>\n<button class=\"run\" id=\"csb\">Get feedback from Claude<\/button>\n<div class=\"resp\" id=\"cso\" role=\"status\"><\/div>\n<details><summary>Show a model answer<\/summary>\n<p><b>Prompt:<\/b> You are a friendly helpdesk assistant for first-year engineering students. Answer politely in simple English. If the student asks for Kannada or Hindi, reply in that language and keep course codes and units unchanged. Use only the text inside &lt;handbook&gt; tags. If the answer is not there, say \u201cI could not find that in the handbook; please contact the office.\u201d Do not assume the student's gender, region or background. Example: Student: \u201cWhen does the Physics lab start?\u201d Helpdesk: \u201cAccording to the timetable, the Physics lab starts in Week 2.\u201d Think first, then give your reply inside &lt;answer&gt; tags. &lt;handbook&gt;{{TEXT}}&lt;/handbook&gt; Student question: {{QUESTION}}<\/p>\n<p><b>Justification:<\/b> Clarity: a role, tone and format are stated. Adapting context: formal but friendly helpdesk voice. Linguistic barriers: Kannada or Hindi on request, with codes and units kept. Ethics: no assumptions about the student. Question answering: answers come only from the handbook, with an \u201cI could not find that\u201d fallback (a conditional prompt). Data kept apart from instructions with tags (Tutorial Ch. 4 (Separating data from instructions)), and an \u201cout\u201d to reduce invented answers (Tutorial Ch. 8 (Avoiding hallucinations)). Future link: an adaptive version could change its tone based on how the student replies.<\/p><\/details>\n<\/section>\n<\/main>\n<script>\nconst MODEL=\"claude-haiku-5-5\";\nconst $=id=>document.getElementById(id);\nconst liveErr=e=>{try{console.error(e)}catch(_){}const c=e&&e.code;const m={not_granted:'Claude was not allowed. Reload this page and click Allow when the permission box appears.',rate_limited:'Too many runs. Wait a moment, then try again.',not_declared:'This page is not set up for live Claude. Please report this problem.',capability_disabled:'Live Claude is switched off for this page. Please report this problem.',capability_removed:'Live Claude was removed from this page. Please report this problem.',sampling_disabled:'Live Claude is turned off for your account or organisation.',session_expired:'Your session expired. Reload the page.',upstream_error:'Claude is busy. Try again in a moment.',empty_completion:'Claude sent an empty reply. Run it again.',refused:'Claude declined this prompt. Change the wording.',queue_overflow:'Too many requests are waiting. Try again shortly.',cancelled:'Stopped.',invalid_request:'The request was not accepted. Please report this problem.'}[c];return (m||\"Couldn't reach Claude. Try again.\")+(c?' (code: '+c+')':(e&&e.message?' ('+String(e.message).slice(0,80)+')':''));};\n/* live Claude when available, otherwise paste mode (works in any phone browser) */\nconst HARD=['not_granted','sampling_disabled','capability_disabled','capability_removed','not_declared'];\nlet liveFn=null,liveDone=false,pasteOnly=false;\n(async()=>{try{if(typeof claude!=='undefined'&&claude&&claude.use)liveFn=await claude.use(\"sample\");}catch(e){liveFn=null;}liveDone=true;})();\nconst wait=ms=>new Promise(r=>setTimeout(r,ms));\nconst pasteQ=[];let pasteBusy=false;\nfunction pasteAsk(p,o){return new Promise((res,rej)=>{pasteQ.push({p,o,res,rej});pump();});}\nfunction pump(){if(pasteBusy||!pasteQ.length)return;pasteBusy=true;const {p,o,res,rej}=pasteQ.shift();\nconst ov=document.createElement('div');ov.setAttribute('role','dialog');ov.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:12px';\nconst bx=document.createElement('div');bx.style.cssText='background:var(--sf,var(--surface,#fff));color:var(--ink,#16212b);border:2px solid var(--ink,#16212b);box-shadow:5px 5px 0 var(--ink,#16212b);max-width:660px;width:100%;padding:16px;margin:8px 0';\nconst mkb=(t,bg)=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='font:inherit;cursor:pointer;border:2px solid var(--ink,#16212b);padding:7px 14px;font-weight:700;margin:8px 8px 0 0;background:'+bg+';color:#16212b';return b;};\nconst ta=()=>{const t=document.createElement('textarea');t.style.cssText='width:100%;min-height:120px;font:14px ui-monospace,Menlo,monospace;padding:8px;border:2px solid var(--ink,#16212b);background:var(--bg,#f2f5ef);color:var(--ink,#16212b)';return t;};\nconst h=document.createElement('div');h.style.cssText='font-weight:800;font-size:1.15rem;margin-bottom:6px';h.textContent='Run this in your own Claude chat';\nconst ex=document.createElement('p');ex.style.margin='0 0 8px';ex.textContent=\"Live Claude isn't available in this view. 1) Copy the prompt. 2) Open Claude (use Haiku if you can choose), paste it and send. 3) Paste Claude's reply below.\";\nconst pt=ta();pt.readOnly=true;pt.value=p;const cp=mkb('Copy prompt','#ffd84d');\ncp.onclick=async()=>{try{await navigator.clipboard.writeText(p);cp.textContent='Copied \u2713';}catch(e){pt.focus();pt.select();cp.textContent='Press copy on your keyboard';}};\nconst l2=document.createElement('div');l2.style.cssText='font-weight:700;margin-top:10px';l2.textContent=\"Claude's reply\";\nconst rt=ta();const ok=mkb('Use this reply','#ffd84d');const no=mkb('Cancel','transparent');const em=document.createElement('div');em.style.cssText='font-weight:700;min-height:1.2em';\nconst done=()=>{ov.remove();pasteBusy=false;};\nok.onclick=()=>{const t=rt.value.trim();if(!t){em.textContent='Paste the reply first.';return;}done();try{o&&o.onText&&o.onText({text:t,delta:t});}catch(e){}res({text:t,truncated:false});pump();};\nno.onclick=()=>{done();const q=pasteQ.splice(0);rej({code:'cancelled',message:'cancelled'});q.forEach(x=>x.rej({code:'cancelled',message:'cancelled'}));};\nbx.append(h,ex,pt,cp,l2,rt,em,ok,no);ov.appendChild(bx);document.body.appendChild(ov);setTimeout(()=>{try{rt.focus();}catch(e){}},50);}\nasync function getSample(){return async(p,o)=>{\n if(!liveDone)await Promise.race([(async()=>{while(!liveDone)await wait(100);})(),wait(8000)]);\n if(liveFn&&!pasteOnly){try{return await liveFn(p,o);}catch(e){if(HARD.includes(e&&e.code))pasteOnly=true;else throw e;}}\n return pasteAsk(p,o);};}\nconst TH=[\n{h:\"Theory 1 \u00b7 The function of prompt engineering in communication\",s:\"Human contact is built on communication. As large language models (LLMs) become common, prompts decide how clearly, creatively and responsibly they communicate for us. Open each part.\",\nflow:[\"Clarity\",\"Creativity\",\"Context\",\"Language\",\"Ethics\"],\np:[\n[\"Introduction\",[[\"\",\"Prompt engineering is the practice of designing prompts that tell an LLM the context, the goal and the tone of a message. Because the prompt steers the whole message, prompt engineering has five roles in communication: it improves clarity, increases creativity and engagement, adapts communication to different contexts, overcomes linguistic barriers, and raises ethical issues that must be handled responsibly.\"]]],\n[\"Role 1: Improving specificity and clarity\",[[\"Explain\",\"Prompts point the LLM toward clear, concise communication. By giving context, defining the goal and naming the tone you want, you avoid misunderstandings and make sure the intended audience understands the message.\"],[\"Why it matters\",\"A message that confuses the reader fails, even when it is correct.\"],[\"Example\",\"Vague: \u201cWrite about the lab delay.\u201d Clear: \u201cWrite a 3-line notice for first-year students: Lab 4 moves from Monday to Wednesday at 2 pm. Polite, clear tone.\u201d\"],[\"Class link\",\"Tutorial Ch. 2 (Clear and direct), clear and direct.\"]]],\n[\"Role 2: Increasing creativity and engagement\",[[\"Explain\",\"Prompts help the LLM reach its creative potential and produce lively, thought-provoking exchanges. Debate prompts start discussions and storytelling prompts produce engaging stories, which opens new forms of expression.\"],[\"Why it matters\",\"Engaging communication holds attention and invites the reader to think.\"],[\"Example\",\"\u201cArgue for and against open-book exams in two short paragraphs, then end by asking the reader one question.\u201d\"],[\"Class link\",\"Unit 2.4, creative thinking.\"]]],\n[\"Role 3: Adapting communication to different contexts\",[[\"Explain\",\"Prompts can change the LLM's style to suit the situation. A persuasive argument, a casual chat message and a formal email each need a different tone and approach. Focused prompts let the LLM handle these differences smoothly.\"],[\"Why it matters\",\"The same facts sound wrong in the wrong tone.\"],[\"Example\",\"Same news, two prompts: \u201cTell my friend, casual, one line\u201d and \u201cTell the Head of Department, formal, three sentences.\u201d\"],[\"Class link\",\"Tutorial Ch. 3 (Assigning roles), roles. Giving Claude the role of a cat changes its view of skateboarding.\"]]],\n[\"Role 4: Overcoming linguistic barriers\",[[\"Explain\",\"Prompt engineering supports cross-cultural communication by letting LLMs translate accurately and naturally. Prompts can add cultural references, nuances and the intended meaning, so language difficulties become easier to overcome.\"],[\"Why it matters\",\"People understand and trust information that arrives in their own language.\"],[\"Example\",\"\u201cTranslate this lab-safety notice into Hindi for first-year students. Keep a polite tone and keep unit symbols such as V and A unchanged.\u201d\"],[\"Class link\",\"Tutorial Ex 2.1, answering in Spanish. Lab 2 below.\"]]],\n[\"Role 5: Ethical issues\",[[\"Explain\",\"The potential is large, but ethics must be considered. Prompts with built-in bias can lead to discriminatory communication, and manipulation techniques can be used maliciously. Responsible design and use of prompts is essential for communication that is moral and helpful.\"],[\"Why it matters\",\"A biased prompt produces biased output at scale.\"],[\"Example\",\"\u201cDescribe a typical male engineer\u201d invites a stereotype. \u201cDescribe the skills of a good engineer\u201d does not.\"],[\"Class link\",\"Lab 3 below.\"]]],\n[\"Conclusion\",[[\"\",\"Prompt engineering makes communication with LLMs clear, engaging, suitable for its context, inclusive across languages and responsible. The LLM provides the ability, and the prompt decides the direction. Ethical vigilance is needed to reduce bias and keep communication responsible.\"]]]]},\n{h:\"Theory 2 \u00b7 The advantages of prompt engineering\",s:\"Careful prompts help LLMs give more precise, consistent and imaginative results. Four uses show the benefit.\",\nflow:[\"Question answering\",\"Creative writing\",\"Translation\",\"Coding\"],\np:[\n[\"Introduction\",[[\"\",\"Prompt engineering is an effective way to raise LLM performance. By constructing prompts carefully, prompt engineers help LLMs produce results that are more precise, more consistent and more imaginative. Four common uses are question answering, creative writing, machine translation and coding.\"]]],\n[\"Advantage 1: Question answering\",[[\"Explain\",\"With well-built prompts, LLMs answer factual questions more accurately.\"],[\"Example prompt\",\"\u201cUsing only the text below, state the maximum input voltage. If it is not stated, say so.\u201d\"],[\"Class link\",\"Tutorial Ch. 8 (Avoiding hallucinations), avoiding hallucinations, and Ex 2.2, answering with one name only.\"]]],\n[\"Advantage 2: Creative writing\",[[\"Explain\",\"Prompt engineering helps LLMs write more imaginative and captivating material such as stories, poetry and scripts.\"],[\"Example prompt\",\"\u201cWrite a 6-line poem about the last day of college in a calm tone, ending with a question.\u201d\"],[\"Class link\",\"Tutorial haiku exercises (Ch. 5).\"]]],\n[\"Advantage 3: Machine translation\",[[\"Explain\",\"Prompts can raise the precision of translations, for example by stating the audience, tone and what must stay unchanged.\"],[\"Example prompt\",\"\u201cTranslate into Kannada for school students. Polite tone. Keep numbers and units unchanged.\u201d\"],[\"Class link\",\"Tutorial Ex 2.1.\"]]],\n[\"Advantage 4: Coding\",[[\"Explain\",\"Prompt engineering helps LLMs produce more precise and efficient code.\"],[\"Example prompt\",\"\u201cWrite a Python function that returns the average of a list. Handle the empty list. Add two test cases.\u201d\"],[\"Class link\",\"Tutorial Ch. 9 (Building complex prompts), the Codebot exercise.\"]]],\n[\"Conclusion\",[[\"\",\"Prompt engineering brings accuracy, consistency and creativity across question answering, creative writing, translation and coding. It does not guarantee perfect answers, so outputs still need checking, which is why Chapter 8 of the tutorial teaches how to reduce hallucinations.\"]]]]},\n{h:\"Theory 3 \u00b7 The future of LLM communication\",s:\"As LLMs and prompting techniques advance, communication will change further. The field is dynamic and research continues.\",\nflow:[\"Automated prompts\",\"Adaptive prompts\",\"Prompting languages\",\"Explainability\",\"Ethics\"],\np:[\n[\"Introduction\",[[\"\",\"As LLM technology and prompt engineering mature, even bigger changes in communication are expected. The book imagines AI-powered negotiation tools that help reach win-win agreements, real-time translation with deeper understanding, and news updates personalised to your preferences.\"]]],\n[\"Automated prompt generation\",[[\"Explain\",\"Methods that create prompts automatically, so people do not have to write every prompt by hand.\"],[\"Class link\",\"The tutorial's experimental metaprompt lets Claude write prompt templates for you.\"]]],\n[\"Adaptive prompts\",[[\"Explain\",\"Prompts that adjust themselves based on how the user interacts, for example changing tone or detail as the conversation goes on.\"]]],\n[\"Subtle cues in complex tasks\",[[\"Explain\",\"Research aims to handle problems linked to subtle cues in intricate tasks, where the right instruction is hard to state.\"]]],\n[\"Specialist prompting languages\",[[\"Explain\",\"Just as programming languages guide computers, specialist prompting languages could make writing effective prompts more accessible and intuitive.\"],[\"Class link\",\"Tags like <email> in Tutorial Ch. 4 (Separating data from instructions) already add a little structure.\"]]],\n[\"Control and explainability\",[[\"Explain\",\"As LLMs grow more complex, it becomes important to know how a prompt affects the result. Explainable AI methods are expected to show what happens inside.\"]]],\n[\"Ethical considerations\",[[\"Explain\",\"Using the ability to influence LLM behaviour is a duty. Bias, fairness and manipulation must be handled for the field to grow responsibly. Well-built prompts can also help control bias and guide model behaviour.\"]]],\n[\"Conclusion\",[[\"\",\"Prompt engineering is expected to support more capable, context-aware AI through automated and adaptive prompts, specialist languages and better explainability, provided ethical issues are tackled. Better prompts will keep shaping how people and AI work together.\"]]]]}];\nTH.forEach((t,ti)=>{const s=document.createElement('section');const tg=document.createElement('div');tg.className='tag';tg.textContent=t.h.split(' \u00b7 ')[0];\nconst h=document.createElement('h2');h.textContent=t.h.split(' \u00b7 ')[1];const sb=document.createElement('p');sb.className='sub';sb.textContent=t.s;s.append(tg,h,sb);\nconst fl=document.createElement('div');fl.className='flow';t.flow.forEach((f,i)=>{if(i)fl.append('\u2192');const sp=document.createElement('span');sp.textContent=f;fl.appendChild(sp);});s.appendChild(fl);\nt.p.forEach(([sm,rows],i)=>{const d=document.createElement('details');if(i===0&&ti===0)d.open=true;const su=document.createElement('summary');su.textContent=sm;d.appendChild(su);\nrows.forEach(([l,x])=>{const p=document.createElement('p');if(l){const b=document.createElement('b');b.textContent=l+': ';p.appendChild(b);}p.append(x);d.appendChild(p);});s.appendChild(d);});\n$('theory').appendChild(s);});\n/* scenario quiz */\nconst QZ=[[\"The college sends one fact, \u201cLab 4 moves to Wednesday, 2 pm\u201d, to students on WhatsApp, to the Head of Department and to a visiting Kannada-speaking parent. A teammate used one prompt, \u201cAnnounce the lab change,\u201d and the result suits nobody. Which revision best applies the unit?\", [\"Add \u201cbe clear and short\u201d and reuse the same prompt for all three readers\", \"Write three prompts that each name the audience and tone, and for the parent the language, while keeping the day, time and room unchanged\", \"Ask for the most creative announcement once and translate it afterwards\", \"Add an ethics disclaimer to the same prompt\"], 1, \"Audience, tone and language change per reader (context and language roles), while the facts stay fixed. Clarity alone cannot fit three audiences, and creativity or an ethics line does not fix the mismatch.\"], [\"A scholarship email prompt reads: \u201cWrite to the winner and say he should be proud of his family business.\u201d The output is polite and error-free. What is the best next step?\", [\"Keep it, because the output is polite and correct\", \"Add a more formal tone instruction\", \"Rewrite it without assumptions about gender or family background, then review the output for stereotypes\", \"Translate the email so more readers can see it\"], 2, \"Politeness does not remove bias. The prompt itself assumes gender and background, and a biased prompt produces biased output at scale, so rewrite it and review the result.\"], [\"An admissions assistant was told to answer from the handbook. A student asks for the library fine per day, which the handbook does not state, and the assistant replies \u201c\u20b95\u201d. Which fix targets this failure?\", [\"Tell it to use only the text in <handbook> tags and to say it could not find the answer if it is missing\", \"Give it a friendlier role and tone\", \"Ask it to translate answers into Kannada\", \"Ask for longer, more detailed answers\"], 0, \"The failure is an invented answer. A conditional rule (\u201cif not found, say so\u201d) tied to supplied text fixes it, whereas tone, language or length do not.\"], [\"A tutoring app notices a student answers quickly and correctly. The team wants explanations to become shorter without the student asking. Which future direction is this, and what must the team still watch?\", [\"Automated prompt generation, with no extra risk\", \"Specialist prompting languages, mainly the cost of learning the syntax\", \"Explainability, mainly slower replies\", \"Adaptive prompts, while checking that adapting to the student does not introduce unfair assumptions\"], 3, \"Prompts that adjust to how the user interacts are adaptive prompts. Adapting to a person can slide into assumptions about them, so ethics and bias stay on the checklist.\"], [\"A colleague says clarity (Role 1) and adapting to context (Role 3) are the same thing. Which statement separates them best?\", [\"Clarity is only for emails and context is only for chat\", \"Clarity removes ambiguity so the audience understands, while context changes the style to suit the situation\", \"Clarity needs examples and context needs a role\", \"They are the same, but context also covers translation\"], 1, \"A message can be perfectly clear and still wrong in tone. Clarity is about being understood, and context is about fitting the situation.\"], [\"A student's prompt, \u201cWrite a Python function that returns the average of a list. Handle the empty list. Add two test cases,\u201d produces working code. A reviewer says prompt engineering has now guaranteed correct code. What is the best response?\", [\"Agree, because the prompt gave details and an example\", \"Agree, because tests were requested\", \"Partly agree: the prompt shows the coding advantage, but outputs still need to be run and checked, as prompting does not guarantee perfect answers\", \"Disagree, because code cannot benefit from prompting\"], 2, \"Specific prompts improve precision, but the unit stresses that outputs still need checking. Running the code and tests is that check.\"]];\nlet qd=0,qc=0;\nQZ.forEach(([q,o,a,e])=>{const d=document.createElement('div');const h=document.createElement('div');h.className='q';h.textContent=q;\nconst w=document.createElement('div');w.className='opts';const f=document.createElement('div');f.className='fb';let dn=false;\no.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{if(dn)return;dn=true;qd++;\nif(i===a){qc++;b.classList.add('right');f.textContent='\u2713 '+e;}else{b.classList.add('wrong');w.children[a].classList.add('right');f.textContent='\u2717 '+e;}\n$('qs').textContent=`Answered ${qd} of ${QZ.length}. Correct: ${qc}.`+(qd===QZ.length?` Score: ${Math.round(qc/QZ.length*100)}%.`:'');};w.appendChild(b);});\nd.append(h,w,f);$('quiz').appendChild(d);});\n/* labs */\nconst SC={Hindi:/[\\u0900-\\u097F]/,Kannada:/[\\u0C80-\\u0CFF]/,Tamil:/[\\u0B80-\\u0BFF]/,Telugu:/[\\u0C00-\\u0C7F]/};\nconst words=t=>t.trim().split(/\\s+/).filter(Boolean).length;\nconst LABS=[\n{t:\"Lab 1: Adapt to the audience\",task:\"Write ONE prompt that makes Claude write a message to a professor saying you missed Monday's lab because you were ill. It must be formal, three sentences or fewer, and end by asking for a make-up slot.\",hint:\"State the audience, tone, length and how it must end.\",u:\"\",\n ok:(r)=>{const n=r.trim().split(/(?<=[.!?])\\s+/).filter(Boolean).length;return n<=3&&/Dear|Respected|Sir|Madam|Professor/i.test(r)&&/make-?up|reschedul|another (slot|session|time)/i.test(r);}},\n{t:\"Lab 2: Cross the language barrier\",task:\"Choose a language, then write a prompt that makes Claude translate \u201cWear safety goggles before entering the lab.\u201d Reply with only the translation, in that language's own script.\",hint:\"Name the language, say \u201conly the translation\u201d, and ask for the native script.\",u:\"\",sel:Object.keys(SC),\n ok:(r,p,s)=>SC[s].test(r)&&(r.match(/[A-Za-z]/g)||[]).length<=3},\n{t:\"Lab 3: Fix the biased prompt\",task:\"This prompt hides a stereotype. Rewrite it so Claude describes the skills of a good engineer in three bullets, with no assumption about gender.\",hint:\"Remove the gender words from your prompt, and ask for skills.\",u:\"Describe a typical male engineer and what he wears.\",\n ok:(r,p)=>!/\\b(male|he|his|him|man)\\b/i.test(p)&&!/\\b(he|his|him|male)\\b/i.test(r)&&r.trim().split(\"\\n\").filter(x=>x.trim()).length>=3},\n{t:\"Lab 4: A role fixes the maths (Tutorial Ex 3.1)\",task:\"Claude may wrongly call this solution correct (2x \u2212 3 = 9 gives 2x = 6, which is wrong). Add a role in the system box so Claude says it is incorrect.\",hint:\"Give Claude a role that makes it careful with maths. The check looks for \u201cincorrect\u201d or \u201cnot correct\u201d.\",s:\"\",u:\"Is this equation solved correctly below?\\n\\n2x - 3 = 9\\n2x = 6\\nx = 3\",lock:1,\n ok:(r)=>/incorrect|not correct/i.test(r)}];\nlet sample=null,ldone=new Set();\nLABS.forEach((L,i)=>{const d=document.createElement('div');d.className='lab';\nd.innerHTML='<h3><\/h3><p class=\"sub\"><\/p>';d.firstChild.textContent=L.t;d.children[1].textContent=L.task;\nlet sel,sy,ut;\nif(L.sel){const lb=document.createElement('label');lb.textContent='Language';sel=document.createElement('select');L.sel.forEach(x=>{const o=document.createElement('option');o.textContent=x;sel.appendChild(o);});d.append(lb,sel);}\nif(L.s!==undefined){const lb=document.createElement('label');lb.textContent='System prompt (edit this)';sy=document.createElement('textarea');d.append(lb,sy);}\nconst lb2=document.createElement('label');lb2.textContent=L.lock?'User message (fixed)':'Your prompt (edit this)';d.appendChild(lb2);\nif(L.lock){ut=document.createElement('div');ut.className='lock';ut.textContent=L.u;}else{ut=document.createElement('textarea');ut.value=L.u;}d.appendChild(ut);\nconst bw=document.createElement('div');const run=document.createElement('button');run.className='run';run.textContent='Run on Claude';\nconst hb=document.createElement('button');hb.className='hint';hb.textContent='Hint';bw.append(run,hb);d.appendChild(bw);\nconst msg=document.createElement('div');msg.className='fb';msg.setAttribute('role','status');const out=document.createElement('div');out.className='resp';d.append(msg,out);\nhb.onclick=()=>{msg.textContent='Hint: '+L.hint;};\nrun.onclick=async()=>{const u=L.lock?L.u:ut.value.trim(),s=sy?sy.value.trim():'';\nif(!u||(sy&&!s)){msg.textContent='Fill in the box first.';return;}\nlet p=s?s+'\\n\\n'+u:u;run.disabled=true;msg.textContent='Claude is thinking\u2026';out.className='resp';out.textContent='';\ntry{if(!sample)sample=await getSample();\nif(!sample){msg.textContent='Live Claude is not available here. Open this page from its claude.ai link while signed in.';return;}\nconst r=await sample(p,{model:MODEL,modelTier:\"quick\",cache:false,onText:({text})=>{out.textContent=text;}});out.textContent=r.text;\nlet ok=L.ok(r.text,u,sel&&sel.value);if(!ok){msg.textContent='Checking the reply against the task\u2026';ok=await JUDGE(L.task,u,r.text);}out.className='resp '+(ok?'ok':'no');msg.textContent=ok?'\u2713 Passed.':'\u2717 Not yet. Read the reply and tighten your prompt.';\nif(ok){d.classList.add('pass');ldone.add(i);}$('ls').textContent=`Labs passed: ${ldone.size} of ${LABS.length}`;}\ncatch(e){msg.textContent=liveErr(e);}\nfinally{run.disabled=false;}};\n$('labbox').appendChild(d);});\n/* case feedback */\n$('csb').onclick=async()=>{const t=$('cs').value.trim();if(words(t)<40){$('cso').textContent='Write your prompt and a short justification first.';return;}\nconst b=$('csb');b.disabled=true;$('cso').textContent='Claude is reviewing\u2026';\nconst p='You are a supportive tutor. A first-year engineering student was given this case: design a prompt for a university helpdesk assistant that answers admission and timetable questions politely, replies in Kannada or Hindi on request, avoids assumptions about the student, and answers only from the official handbook text. They must also justify their design using ideas from prompt engineering in communication (clarity, creativity, adapting context, language barriers, ethics), the advantages (question answering etc.) and future ideas. Do not give a mark. Reply with: what the prompt does well, what is missing (check for role and tone, handbook data in tags, an \u201cif not found\u201d fallback, language handling, bias handling, an example), whether the justification links to the unit ideas, and one improvement tip. Under 170 words.\\n\\n<answer>'+t+'<\/answer>';\ntry{if(!sample)sample=await getSample();\nif(!sample){$('cso').textContent='Live Claude is not available here. Open this page from its claude.ai link while signed in.';return;}\nconst r=await sample(p,{model:MODEL,modelTier:\"quick\",cache:false,onText:({text})=>{$('cso').textContent=text;}});$('cso').textContent=r.text;}\ncatch(e){$('cso').textContent=liveErr(e);}\nfinally{b.disabled=false;}};\n<\/script>\n<script>document.addEventListener(\"click\",function(e){var a=e.target.closest&&e.target.closest(\"a[href]\");if(!a)return;var h=a.getAttribute(\"href\");var m=h&&h.match(/^([a-z0-9-]+)\\.html$/i);if(m){e.preventDefault();parent.postMessage({go:m[1]},\"*\");}});<\/script>\n<script>\n(function(){\nconst X={\"gif\": \"data:image/gif;base64,R0lGODlhqAK+AIMAAP////z9/fr6+vf69fPz9N7g4f/YTcTDuZaZl3qAg21zd1thZEJLUTA5PxwnMRYhKyH/C05FVFNDQVBFMi4wAwEAAAAh+QQAoAAAACwAAAAAqAK+AAAI/wAfCBxIsKDBgwgTKlzIsKHDhxAjSpxIsaLFixgzatzIsaPHjyBDihxJsqTJkyhTqlzJsqXLlzBjypxJcoDNmzhz6tzJs6fPn0CDCh1KtKjRo0iTKl3KtKnTp1CjSp1KtarVq1h9EszKtavXr2DDih1LtqzZs2jTEt2qtq3bt3Djyp1Lt65ds2zv6t3Lt6/fv4ADB84ruLDhw4gTK178lzDjx5AjS55MuTJOx5Yza97MubNnq5g/ix5NurTpyaFPq17NurVrvANfy55Nu7bto6lv697Nu3fn3L6DCx9OvC/w4siTK1/+9Tjz59CjSx/qfLr169iVV8/Ovbv32du/i/8fT55z+PLo06s/fH69+/fw5baPT7++/eax7+vfzx+/wP4ABiigU8DRZKBBTR2o4H9MLahggg4aCGGEM/1UIIUVNoihTBNu+FKHHrYEYogrWZgfTyR+qCEALLbo4oswxijjjDTWaOONOLLI4FIC5ejjj0AGKaSOD0A45JFIJvnjjkr1qOSTUEbJ5E4XPmDAlVhmqeWWXHbp5ZdghinmmCc2+UCUaKYp5JRIOanmm3DOyCZuZ8Zp550AzGmUm3j2iaaeN1U55qCEFmrooVselBSffjaaJKBr1enopEdCSp2klGa6ZJErauppjpYKiuiopJZqqKJtYvrpqjJaKhSjrMb/2qKrQcEqa6y0AmXrrauGWqZOA5kq7LDEYokqnbwmm6uJyfK6rFaqNvvpsz3tKi2lvkIabLHcdlvosXtGe22m1KIo7riTlkvlueg2qi6w7LbbZ7acmmult/jm2yW4RVkrL57v5uTvv3YGfFm8BMdpcKAIJ/wmvdDeq+/E+vIbqcPp1msmxo4ubNPAHP+p8aINhwwlxNUKRPHK+Fp8qcnzjpwqzADLjCzNBdscLs45m6ityiwHTazLr5bM85AeDwDy0Ujr3K/RTAOZ9NJRS+30x78KDLTQXJNKdK1QVw3q1S+LLSXZRZt9tpFqP4myvV3HjejXuobdNo1T2313q2iD/733o33X/TeSb68rsdyIi0k3s4M3zXbjQeYN+ZqBMz75pj5
