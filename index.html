w the Nexora X9 quantum transistor from 2031 works.\"],[\"B \u00b7 Allowed to say unsure\",\"Explain how the Nexora X9 quantum transistor from 2031 works. If you do not recognise it or are not sure it exists, say so instead of guessing.\"],\"B should admit it does not know. Newer models may refuse in both cases, so discuss why allowing \u201cI am not sure\u201d is still a good habit.\"],\n[\"Demo 5 \u00b7 Precision and fairness\",\"Say: \u201cCareful wording reduces bias and vagueness.\u201d\",[\"A \u00b7 Plain\",\"Write a short job advert for a junior electrical engineer.\"],[\"B \u00b7 Engineered\",\"Write a short job advert for a junior electrical engineer. Use gender-neutral language, list only skills and duties needed for the job, and avoid phrases such as \u201cyoung\u201d or \u201crockstar\u201d. Under 80 words.\"],\"Compare tone, length and the criteria listed. Ask students to improve B once more.\"]];\nDM.forEach(([t,say,A,B,look])=>{const d=el('div','lab'),st=el('div','stack'),run=el('button','run','Run both on Claude'),f=el('div','fb'),ta=[],rs=[];\n[A,B].forEach((x,i)=>{const c=el('div'),l=el('label','',x[0]),t2=el('textarea'),r=el('div','resp');t2.value=x[1];t2.id='d'+DM.indexOf(DM.find(z=>z[0]===t))+'_'+i;l.htmlFor=t2.id;c.append(l,t2,r);st.append(c);ta.push(t2);rs.push(r);});\nd.append(el('h3','',t),el('p','sub',say),st,run,document.createTextNode(' '),el('span','pill','Model: Claude Haiku'),f,el('div','look','Look for: '+look));\nrun.onclick=async()=>{run.disabled=true;rs.forEach(r=>r.textContent='');f.textContent='Claude is thinking\u2026';try{await Promise.all(ta.map((x,i)=>ask(x.value,rs[i])));f.textContent='Compare the two replies.';}catch(e){f.textContent=liveErr(e);}finally{run.disabled=false;}};$('dm').append(d);});\n\n})();\n<\/script>\n<script>document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('.pg').forEach(p=>p.classList.toggle('on',p.id==='pg'+b.dataset.t));window.scrollTo(0,0);});<\/script>\n<script>document.addEventListener(\"click\",function(e){var a=e.target.closest&&e.target.closest(\"a[href]\");if(!a)return;var h=a.getAttribute(\"href\");var m=h&&h.match(/^([a-z0-9-]+)\\.html$/i);if(m){e.preventDefault();parent.postMessage({go:m[1]},\"*\");}});<\/script><\/body><\/html>", "unit-2-2": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Module 2 \u00b7 Unit 2.2 \u00b7 Prompt Engineering in Communication<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f2f5ef;--grid:#d5e0d3;--sf:#fff;--ink:#16212b;--mute:#4c5b66;--blue:#1f5fd6;--hi:#ffd84d;--ok:#1f8f5a;--bad:#d23b41;--okbg:#dff3e7;--badbg:#fbe0e1;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10171d;--grid:#1c2830;--sf:#18222a;--ink:#eaf0f3;--mute:#9fb0ba;--blue:#7fb0ff;--ok:#52d196;--bad:#ff7b80;--okbg:#14382a;--badbg:#44191c}}\n:root[data-theme=\"dark\"]{--bg:#10171d;--grid:#1c2830;--sf:#18222a;--ink:#eaf0f3;--mute:#9fb0ba;--blue:#7fb0ff;--ok:#52d196;--bad:#ff7b80;--okbg:#14382a;--badbg:#44191c}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:17px/1.55 \"Atkinson Hyperlegible\",system-ui,sans-serif}\nmain{max-width:860px;margin:0 auto;padding:18px 16px 60px}\nh1,h2,h3{font-family:\"Bricolage Grotesque\",system-ui,sans-serif;line-height:1.1;margin:0}\nh1{font-size:clamp(2rem,6.5vw,3.2rem);font-weight:800;letter-spacing:-.02em}\nh2{font-size:1.45rem;font-weight:800}h3{font-size:1.1rem}\n.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}\n.nav span,.nav a{border:2px solid var(--ink);padding:2px 10px;font-weight:700;font-size:.9rem;background:var(--sf);color:var(--ink);text-decoration:none}\n.nav .on{background:var(--hi);color:#16212b}.nav .off{opacity:.45}\n.sub{color:var(--mute);max-width:64ch;margin:6px 0}\nsection{background:var(--sf);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:18px;margin-top:26px}\n.tag{font-weight:700;color:var(--blue);font-size:.9rem}\nbutton{font:inherit;cursor:pointer;color:var(--ink)}\n:focus-visible{outline:3px solid var(--blue);outline-offset:2px}\ndetails{border:2px solid var(--ink);background:var(--bg);margin:8px 0;padding:8px 12px}\nsummary{cursor:pointer;font-weight:700}details p{margin:6px 0}\n.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0;font-weight:700}\n.flow span{border:2px solid var(--ink);background:var(--hi);color:#16212b;padding:3px 10px}\n.q{font-weight:700;margin:12px 0 4px}\n.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}\n.opt{border:2px solid var(--ink);background:var(--sf);padding:8px 14px;font-weight:700;text-align:left}\n.opt:hover:not(:disabled){background:var(--hi);color:#16212b}\n.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}\n.fb{font-weight:700;min-height:1.4em}\nlabel{display:block;font-weight:700;font-size:.88rem;color:var(--mute);margin:8px 0 2px}\ntextarea,select,.lock{width:100%;font:inherit;font-family:ui-monospace,Menlo,monospace;font-size:.9rem;padding:8px;border:2px solid var(--ink);background:var(--bg);color:var(--ink)}\ntextarea{min-height:84px;resize:vertical}select{width:auto}\n.lock{border-style:dashed;white-space:pre-wrap}\n.run{margin-top:10px;border:2px solid var(--ink);background:var(--hi);color:#16212b;font-weight:700;padding:8px 18px;box-shadow:3px 3px 0 var(--ink)}\n.run:disabled{opacity:.6;cursor:wait}\n.hint{margin-left:8px;border:2px solid var(--ink);background:var(--sf);padding:6px 12px}\n.lab{border:2px solid var(--ink);padding:14px;margin-top:14px;background:var(--bg)}.lab.pass{border-color:var(--ok)}\n.resp{margin-top:8px;padding:8px 10px;border:2px dashed var(--ink);white-space:pre-wrap;font-size:.92rem;min-height:2.6em;background:var(--sf)}\n.resp.ok{background:var(--okbg);border:2px solid var(--ok)}.resp.no{background:var(--badbg);border:2px solid var(--bad)}\n.pill{background:var(--hi);color:#16212b;border:2px solid var(--ink);padding:1px 10px;font-weight:700;font-size:.85rem}\n.score{margin-top:10px;font-weight:700}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<main>\n<div class=\"nav\"><a href=\"unit-2-1.html\">2.1 Intro<\/a><span class=\"on\">2.2 Communication<\/span><span class=\"off\">2.3 Techniques<\/span><span class=\"off\">2.4 Creative<\/span><span class=\"off\">2.5 Writing<\/span><\/div>\n<h1>Unit 2.2: Prompt Engineering in Communication<\/h1>\n<p class=\"sub\">Module 2 \u00b7 2 lecture hours \u00b7 Topics: the function of prompt engineering in communication, its advantages, and the future of LLM communication. Learn the theory, then apply it to scenarios, live labs and a case study.<\/p>\n<div id=\"theory\"><\/div>\n\n<section id=\"apply\">\n<div class=\"tag\">Apply it \u00b7 Scenarios<\/div><h2>Six application questions<\/h2>\n<p class=\"sub\">Each describes a real situation. Choose the best answer, then read why.<\/p>\n<div id=\"quiz\"><\/div><div class=\"score\" id=\"qs\"><\/div>\n<\/section>\n\n<section id=\"labs\">\n<div class=\"tag\">Apply it \u00b7 Live on Claude<\/div><h2>Four labs<\/h2>\n<p class=\"sub\">Write a prompt, run it, and the page checks the reply. <span class=\"pill\">Model: Claude Haiku (same for the class)<\/span> Replies vary a little, so run again if you narrowly miss.<\/p>\n<div id=\"labbox\"><\/div><div class=\"score\" id=\"ls\"><\/div>\n<\/section>\n\n<section id=\"case\">\n<div class=\"tag\">Apply it \u00b7 Case study<\/div><h2>Design a university helpdesk assistant<\/h2>\n<p class=\"sub\"><b>Scenario:<\/b> A university wants an AI helpdesk for first-year engineering students. It must answer admission and timetable questions politely, reply in Kannada or Hindi on request, avoid assumptions about the student, and answer only from the official handbook text. Write the prompt it needs, then explain which roles, advantages and ideas from this unit you used.<\/p>\n<label for=\"cs\">Your prompt and justification<\/label>\n<textarea id=\"cs\" style=\"min-height:150px\" placeholder=\"Prompt: \u2026  Justification: \u2026\"><\/textarea>\n<button class=\"run\" id=\"csb\">Get feedback from Claude<\/button>\n<div class=\"resp\" id=\"cso\" role=\"status\"><\/div>\n<details><summary>Show a model answer<\/summary>\n<p><b>Prompt:<\/b> You are a friendly helpdesk assistant for first-year engineering students. Answer politely in simple English. If the student asks for Kannada or Hindi, reply in that language and keep course codes and units unchanged. Use only the text inside &lt;handbook&gt; tags. If the answer is not there, say \u201cI could not find that in the handbook; please contact the office.\u201d Do not assume the student's gender, region or background. Example: Student: \u201cWhen does the Physics lab start?\u201d Helpdesk: \u201cAccording to the timetable, the Physics lab starts in Week 2.\u201d Think first, then give your reply inside &lt;answer&gt; tags. &lt;handbook&gt;{{TEXT}}&lt;/handbook&gt; Student question: {{QUESTION}}<\/p>\n<p><b>Justification:<\/b> Clarity: a role, tone and format are stated. Adapting context: formal but friendly helpdesk voice. Linguistic barriers: Kannada or Hindi on request, with codes and units kept. Ethics: no assumptions about the student. Question answering: answers come only from the handbook, with an \u201cI could not find that\u201d fallback (a conditional prompt). Data kept apart from instructions with tags (Tutorial Ch. 4), and an \u201cout\u201d to reduce invented answers (Tutorial Ch. 8). Future link: an adaptive version could change its tone based on how the student replies.<\/p><\/details>\n<\/section>\n<\/main>\n<script>\nconst MODEL=\"claude-haiku-5-5\";\nconst $=id=>document.getElementById(id);\nconst liveErr=e=>{try{console.error(e)}catch(_){}const c=e&&e.code;const m={not_granted:'Claude was not allowed. Reload this page and click Allow when the permission box appears.',rate_limited:'Too many runs. Wait a moment, then try again.',not_declared:'This page is not set up for live Claude. Tell your teacher.',capability_disabled:'Live Claude is switched off for this page. Tell your teacher.',capability_removed:'Live Claude was removed from this page. Tell your teacher.',sampling_disabled:'Live Claude is turned off for your account or organisation.',session_expired:'Your session expired. Reload the page.',upstream_error:'Claude is busy. Try again in a moment.',empty_completion:'Claude sent an empty reply. Run it again.',refused:'Claude declined this prompt. Change the wording.',queue_overflow:'Too many requests are waiting. Try again shortly.',cancelled:'Stopped.',invalid_request:'The request was not accepted. Tell your teacher.'}[c];return (m||\"Couldn't reach Claude. Try again.\")+(c?' (code: '+c+')':(e&&e.message?' ('+String(e.message).slice(0,80)+')':''));};\n/* live Claude when available, otherwise paste mode (works in any phone browser) */\nconst HARD=['not_granted','sampling_disabled','capability_disabled','capability_removed','not_declared'];\nlet liveFn=null,liveDone=false,pasteOnly=false;\n(async()=>{try{if(typeof claude!=='undefined'&&claude&&claude.use)liveFn=await claude.use(\"sample\");}catch(e){liveFn=null;}liveDone=true;})();\nconst wait=ms=>new Promise(r=>setTimeout(r,ms));\nconst pasteQ=[];let pasteBusy=false;\nfunction pasteAsk(p,o){return new Promise((res,rej)=>{pasteQ.push({p,o,res,rej});pump();});}\nfunction pump(){if(pasteBusy||!pasteQ.length)return;pasteBusy=true;const {p,o,res,rej}=pasteQ.shift();\nconst ov=document.createElement('div');ov.setAttribute('role','dialog');ov.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:12px';\nconst bx=document.createElement('div');bx.style.cssText='background:var(--sf,var(--surface,#fff));color:var(--ink,#16212b);border:2px solid var(--ink,#16212b);box-shadow:5px 5px 0 var(--ink,#16212b);max-width:660px;width:100%;padding:16px;margin:8px 0';\nconst mkb=(t,bg)=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='font:inherit;cursor:pointer;border:2px solid var(--ink,#16212b);padding:7px 14px;font-weight:700;margin:8px 8px 0 0;background:'+bg+';color:#16212b';return b;};\nconst ta=()=>{const t=document.createElement('textarea');t.style.cssText='width:100%;min-height:120px;font:14px ui-monospace,Menlo,monospace;padding:8px;border:2px solid var(--ink,#16212b);background:var(--bg,#f2f5ef);color:var(--ink,#16212b)';return t;};\nconst h=document.createElement('div');h.style.cssText='font-weight:800;font-size:1.15rem;margin-bottom:6px';h.textContent='Run this in your own Claude chat';\nconst ex=document.createElement('p');ex.style.margin='0 0 8px';ex.textContent=\"Live Claude isn't available in this view. 1) Copy the prompt. 2) Open Claude (use Haiku if you can choose), paste it and send. 3) Paste Claude's reply below.\";\nconst pt=ta();pt.readOnly=true;pt.value=p;const cp=mkb('Copy prompt','#ffd84d');\ncp.onclick=async()=>{try{await navigator.clipboard.writeText(p);cp.textContent='Copied \u2713';}catch(e){pt.focus();pt.select();cp.textContent='Press copy on your keyboard';}};\nconst l2=document.createElement('div');l2.style.cssText='font-weight:700;margin-top:10px';l2.textContent=\"Claude's reply\";\nconst rt=ta();const ok=mkb('Use this reply','#ffd84d');const no=mkb('Cancel','transparent');const em=document.createElement('div');em.style.cssText='font-weight:700;min-height:1.2em';\nconst done=()=>{ov.remove();pasteBusy=false;};\nok.onclick=()=>{const t=rt.value.trim();if(!t){em.textContent='Paste the reply first.';return;}done();try{o&&o.onText&&o.onText({text:t,delta:t});}catch(e){}res({text:t,truncated:false});pump();};\nno.onclick=()=>{done();const q=pasteQ.splice(0);rej({code:'cancelled',message:'cancelled'});q.forEach(x=>x.rej({code:'cancelled',message:'cancelled'}));};\nbx.append(h,ex,pt,cp,l2,rt,em,ok,no);ov.appendChild(bx);document.body.appendChild(ov);setTimeout(()=>{try{rt.focus();}catch(e){}},50);}\nasync function getSample(){return async(p,o)=>{\n if(!liveDone)await Promise.race([(async()=>{while(!liveDone)await wait(100);})(),wait(8000)]);\n if(liveFn&&!pasteOnly){try{return await liveFn(p,o);}catch(e){if(HARD.includes(e&&e.code))pasteOnly=true;else throw e;}}\n return pasteAsk(p,o);};}\nconst TH=[\n{h:\"Theory 1 \u00b7 The function of prompt engineering in communication\",s:\"Human contact is built on communication. As large language models (LLMs) become common, prompts decide how clearly, creatively and responsibly they communicate for us. Open each part.\",\nflow:[\"Clarity\",\"Creativity\",\"Context\",\"Language\",\"Ethics\"],\np:[\n[\"Introduction\",[[\"\",\"Prompt engineering is the practice of designing prompts that tell an LLM the context, the goal and the tone of a message. Because the prompt steers the whole message, prompt engineering has five roles in communication: it improves clarity, increases creativity and engagement, adapts communication to different contexts, overcomes linguistic barriers, and raises ethical issues that must be handled responsibly.\"]]],\n[\"Role 1: Improving specificity and clarity\",[[\"Explain\",\"Prompts point the LLM toward clear, concise communication. By giving context, defining the goal and naming the tone you want, you avoid misunderstandings and make sure the intended audience understands the message.\"],[\"Why it matters\",\"A message that confuses the reader fails, even when it is correct.\"],[\"Example\",\"Vague: \u201cWrite about the lab delay.\u201d Clear: \u201cWrite a 3-line notice for first-year students: Lab 4 moves from Monday to Wednesday at 2 pm. Polite, clear tone.\u201d\"],[\"Class link\",\"Tutorial Ch. 2, clear and direct.\"]]],\n[\"Role 2: Increasing creativity and engagement\",[[\"Explain\",\"Prompts help the LLM reach its creative potential and produce lively, thought-provoking exchanges. Debate prompts start discussions and storytelling prompts produce engaging stories, which opens new forms of expression.\"],[\"Why it matters\",\"Engaging communication holds attention and invites the reader to think.\"],[\"Example\",\"\u201cArgue for and against open-book exams in two short paragraphs, then end by asking the reader one question.\u201d\"],[\"Class link\",\"Unit 2.4, creative thinking.\"]]],\n[\"Role 3: Adapting communication to different contexts\",[[\"Explain\",\"Prompts can change the LLM's style to suit the situation. A persuasive argument, a casual chat message and a formal email each need a different tone and approach. Focused prompts let the LLM handle these differences smoothly.\"],[\"Why it matters\",\"The same facts sound wrong in the wrong tone.\"],[\"Example\",\"Same news, two prompts: \u201cTell my friend, casual, one line\u201d and \u201cTell the Head of Department, formal, three sentences.\u201d\"],[\"Class link\",\"Tutorial Ch. 3, roles. Giving Claude the role of a cat changes its view of skateboarding.\"]]],\n[\"Role 4: Overcoming linguistic barriers\",[[\"Explain\",\"Prompt engineering supports cross-cultural communication by letting LLMs translate accurately and naturally. Prompts can add cultural references, nuances and the intended meaning, so language difficulties become easier to overcome.\"],[\"Why it matters\",\"People understand and trust information that arrives in their own language.\"],[\"Example\",\"\u201cTranslate this lab-safety notice into Hindi for first-year students. Keep a polite tone and keep unit symbols such as V and A unchanged.\u201d\"],[\"Class link\",\"Tutorial Ex 2.1, answering in Spanish. Lab 2 below.\"]]],\n[\"Role 5: Ethical issues\",[[\"Explain\",\"The potential is large, but ethics must be considered. Prompts with built-in bias can lead to discriminatory communication, and manipulation techniques can be used maliciously. Responsible design and use of prompts is essential for communication that is moral and helpful.\"],[\"Why it matters\",\"A biased prompt produces biased output at scale.\"],[\"Example\",\"\u201cDescribe a typical male engineer\u201d invites a stereotype. \u201cDescribe the skills of a good engineer\u201d does not.\"],[\"Class link\",\"Lab 3 below.\"]]],\n[\"Conclusion\",[[\"\",\"Prompt engineering makes communication with LLMs clear, engaging, suitable for its context, inclusive across languages and responsible. The LLM provides the ability, and the prompt decides the direction. Ethical vigilance is needed to reduce bias and keep communication responsible.\"]]]]},\n{h:\"Theory 2 \u00b7 The advantages of prompt engineering\",s:\"Careful prompts help LLMs give more precise, consistent and imaginative results. Four uses show the benefit.\",\nflow:[\"Question answering\",\"Creative writing\",\"Translation\",\"Coding\"],\np:[\n[\"Introduction\",[[\"\",\"Prompt engineering is an effective way to raise LLM performance. By constructing prompts carefully, prompt engineers help LLMs produce results that are more precise, more consistent and more imaginative. Four common uses are question answering, creative writing, machine translation and coding.\"]]],\n[\"Advantage 1: Question answering\",[[\"Explain\",\"With well-built prompts, LLMs answer factual questions more accurately.\"],[\"Example prompt\",\"\u201cUsing only the text below, state the maximum input voltage. If it is not stated, say so.\u201d\"],[\"Class link\",\"Tutorial Ch. 8, avoiding hallucinations, and Ex 2.2, answering with one name only.\"]]],\n[\"Advantage 2: Creative writing\",[[\"Explain\",\"Prompt engineering helps LLMs write more imaginative and captivating material such as stories, poetry and scripts.\"],[\"Example prompt\",\"\u201cWrite a 6-line poem about the last day of college in a calm tone, ending with a question.\u201d\"],[\"Class link\",\"Tutorial haiku exercises (Ch. 5).\"]]],\n[\"Advantage 3: Machine translation\",[[\"Explain\",\"Prompts can raise the precision of translations, for example by stating the audience, tone and what must stay unchanged.\"],[\"Example prompt\",\"\u201cTranslate into Kannada for school students. Polite tone. Keep numbers and units unchanged.\u201d\"],[\"Class link\",\"Tutorial Ex 2.1.\"]]],\n[\"Advantage 4: Coding\",[[\"Explain\",\"Prompt engineering helps LLMs produce more precise and efficient code.\"],[\"Example prompt\",\"\u201cWrite a Python function that returns the average of a list. Handle the empty list. Add two test cases.\u201d\"],[\"Class link\",\"Tutorial Ch. 9, the Codebot exercise.\"]]],\n[\"Conclusion\",[[\"\",\"Prompt engineering brings accuracy, consistency and creativity across question answering, creative writing, translation and coding. It does not guarantee perfect answers, so outputs still need checking, which is why Chapter 8 of the tutorial teaches how to reduce hallucinations.\"]]]]},\n{h:\"Theory 3 \u00b7 The future of LLM communication\",s:\"As LLMs and prompting techniques advance, communication will change further. The field is dynamic and research continues.\",\nflow:[\"Automated prompts\",\"Adaptive prompts\",\"Prompting languages\",\"Explainability\",\"Ethics\"],\np:[\n[\"Introduction\",[[\"\",\"As LLM technology and prompt engineering mature, even bigger changes in communication are expected. The book imagines AI-powered negotiation tools that help reach win-win agreements, real-time translation with deeper understanding, and news updates personalised to your preferences.\"]]],\n[\"Automated prompt generation\",[[\"Explain\",\"Methods that create prompts automatically, so people do not have to write every prompt by hand.\"],[\"Class link\",\"The tutorial's experimental metaprompt lets Claude write prompt templates for you.\"]]],\n[\"Adaptive prompts\",[[\"Explain\",\"Prompts that adjust themselves based on how the user interacts, for example changing tone or detail as the conversation goes on.\"]]],\n[\"Subtle cues in complex tasks\",[[\"Explain\",\"Research aims to handle problems linked to subtle cues in intricate tasks, where the right instruction is hard to state.\"]]],\n[\"Specialist prompting languages\",[[\"Explain\",\"Just as programming languages guide computers, specialist prompting languages could make writing effective prompts more accessible and intuitive.\"],[\"Class link\",\"Tags like <email> in Tutorial Ch. 4 already add a little structure.\"]]],\n[\"Control and explainability\",[[\"Explain\",\"As LLMs grow more complex, it becomes important to know how a prompt affects the result. Explainable AI methods are expected to show what happens inside.\"]]],\n[\"Ethical considerations\",[[\"Explain\",\"Using the ability to influence LLM behaviour is a duty. Bias, fairness and manipulation must be handled for the field to grow responsibly. Well-built prompts can also help control bias and guide model behaviour.\"]]],\n[\"Conclusion\",[[\"\",\"Prompt engineering is expected to support more capable, context-aware AI through automated and adaptive prompts, specialist languages and better explainability, provided ethical issues are tackled. Better prompts will keep shaping how people and AI work together.\"]]]]}];\nTH.forEach((t,ti)=>{const s=document.createElement('section');const tg=document.createElement('div');tg.className='tag';tg.textContent=t.h.split(' \u00b7 ')[0];\nconst h=document.createElement('h2');h.textContent=t.h.split(' \u00b7 ')[1];const sb=document.createElement('p');sb.className='sub';sb.textContent=t.s;s.append(tg,h,sb);\nconst fl=document.createElement('div');fl.className='flow';t.flow.forEach((f,i)=>{if(i)fl.append('\u2192');const sp=document.createElement('span');sp.textContent=f;fl.appendChild(sp);});s.appendChild(fl);\nt.p.forEach(([sm,rows],i)=>{const d=document.createElement('details');if(i===0&&ti===0)d.open=true;const su=document.createElement('summary');su.textContent=sm;d.appendChild(su);\nrows.forEach(([l,x])=>{const p=document.createElement('p');if(l){const b=document.createElement('b');b.textContent=l+': ';p.appendChild(b);}p.append(x);d.appendChild(p);});s.appendChild(d);});\n$('theory').appendChild(s);});\n/* scenario quiz */\nconst QZ=[\n[\"A college club must send one announcement as a casual WhatsApp message and as a formal email to the principal. Which role of prompt engineering is used most directly?\",[\"Improving clarity only\",\"Adapting communication to different contexts\",\"Overcoming linguistic barriers\",\"Raising ethical issues\"],1,\"The same facts need different tone and style for different situations.\"],\n[\"An exchange student cannot read English lab-safety notices. The department wants polite notices in Kannada with units unchanged. Which role is used?\",[\"Increasing creativity\",\"Adapting to context only\",\"Overcoming linguistic barriers\",\"None of these\"],2,\"The prompt supplies language, tone and what to keep, so the translation is natural and accurate.\"],\n[\"A hiring tool's prompt says: \u201cList the qualities of a typical male engineer.\u201d What is the main problem?\",[\"It is too short\",\"It has built-in bias that can cause discriminatory output\",\"It uses technical language\",\"It lacks an example\"],1,\"Biased wording produces biased output. Rewrite it without the gender assumption.\"],\n[\"A startup wants an assistant that answers admission FAQs only from a given document and says \u201cnot stated\u201d otherwise. Which advantage and prompt style fit best?\",[\"Creative writing, natural-language prompt\",\"Question answering, with a conditional \u201cif not found, say so\u201d rule\",\"Coding, system prompt only\",\"Translation, no instructions\"],1,\"It is a question-answering task, and the \u201cif not found\u201d rule is a conditional prompt.\"],\n[\"A student types \u201cWrite code\u201d and gets something unusable. Which principles fix this best?\",[\"Use more jargon\",\"Give details and give examples\",\"Experiment only, never change the prompt\",\"Make it shorter\"],1,\"State the task, inputs, language and behaviour (details), and show a sample (examples).\"],\n[\"A company wants a helpdesk prompt that changes its tone as the user replies. Which future direction is this?\",[\"Adaptive prompts\",\"Specialist prompting languages\",\"Explainability only\",\"Automated translation\"],0,\"Adaptive prompts adjust based on user interaction.\"]];\nlet qd=0,qc=0;\nQZ.forEach(([q,o,a,e])=>{const d=document.createElement('div');const h=document.createElement('div');h.className='q';h.textContent=q;\nconst w=document.createElement('div');w.className='opts';const f=document.createElement('div');f.className='fb';let dn=false;\no.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{if(dn)return;dn=true;qd++;\nif(i===a){qc++;b.classList.add('right');f.textContent='\u2713 '+e;}else{b.classList.add('wrong');w.children[a].classList.add('right');f.textContent='\u2717 '+e;}\n$('qs').textContent=`Answered ${qd} of ${QZ.length}. Correct: ${qc}.`+(qd===QZ.length?` Score: ${Math.round(qc/QZ.length*100)}%.`:'');};w.appendChild(b);});\nd.append(h,w,f);$('quiz').appendChild(d);});\n/* labs */\nconst SC={Hindi:/[\\u0900-\\u097F]/,Kannada:/[\\u0C80-\\u0CFF]/,Tamil:/[\\u0B80-\\u0BFF]/,Telugu:/[\\u0C00-\\u0C7F]/};\nconst words=t=>t.trim().split(/\\s+/).filter(Boolean).length;\nconst LABS=[\n{t:\"Lab 1: Adapt to the audience\",task:\"Write ONE prompt that makes Claude write a message to a professor saying you missed Monday's lab because you were ill. It must be formal, three sentences or fewer, and end by asking for a make-up slot.\",hint:\"State the audience, tone, length and how it must end.\",u:\"\",\n ok:(r)=>{const n=r.trim().split(/(?<=[.!?])\\s+/).filter(Boolean).length;return n<=3&&/Dear|Respected|Sir|Madam|Professor/i.test(r)&&/make-?up|reschedul|another (slot|session|time)/i.test(r);}},\n{t:\"Lab 2: Cross the language barrier\",task:\"Choose a language, then write a prompt that makes Claude translate \u201cWear safety goggles before entering the lab.\u201d Reply with only the translation, in that language's own script.\",hint:\"Name the language, say \u201conly the translation\u201d, and ask for the native script.\",u:\"\",sel:Object.keys(SC),\n ok:(r,p,s)=>SC[s].test(r)&&(r.match(/[A-Za-z]/g)||[]).length<=3},\n{t:\"Lab 3: Fix the biased prompt\",task:\"This prompt hides a stereotype. Rewrite it so Claude describes the skills of a good engineer in three bullets, with no assumption about gender.\",hint:\"Remove the gender words from your prompt, and ask for skills.\",u:\"Describe a typical male engineer and what he wears.\",\n ok:(r,p)=>!/\\b(male|he|his|him|man)\\b/i.test(p)&&!/\\b(he|his|him|male)\\b/i.test(r)&&r.trim().split(\"\\n\").filter(x=>x.trim()).length>=3},\n{t:\"Lab 4: A role fixes the maths (Tutorial Ex 3.1)\",task:\"Claude may wrongly call this solution correct (2x \u2212 3 = 9 gives 2x = 6, which is wrong). Add a role in the system box so Claude says it is incorrect.\",hint:\"Give Claude a role that makes it careful with maths. The check looks for \u201cincorrect\u201d or \u201cnot correct\u201d.\",s:\"\",u:\"Is this equation solved correctly below?\\n\\n2x - 3 = 9\\n2x = 6\\nx = 3\",lock:1,\n ok:(r)=>/incorrect|not correct/i.test(r)}];\nlet sample=null,ldone=new Set();\nLABS.forEach((L,i)=>{const d=document.createElement('div');d.className='lab';\nd.innerHTML='<h3><\/h3><p class=\"sub\"><\/p>';d.firstChild.textContent=L.t;d.children[1].textContent=L.task;\nlet sel,sy,ut;\nif(L.sel){const lb=document.createElement('label');lb.textContent='Language';sel=document.createElement('select');L.sel.forEach(x=>{const o=document.createElement('option');o.textContent=x;sel.appendChild(o);});d.append(lb,sel);}\nif(L.s!==undefined){const lb=document.createElement('label');lb.textContent='System prompt (edit this)';sy=document.createElement('textarea');d.append(lb,sy);}\nconst lb2=document.createElement('label');lb2.textContent=L.lock?'User message (fixed)':'Your prompt (edit this)';d.appendChild(lb2);\nif(L.lock){ut=document.createElement('div');ut.className='lock';ut.textContent=L.u;}else{ut=document.createElement('textarea');ut.value=L.u;}d.appendChild(ut);\nconst bw=document.createElement('div');const run=document.createElement('button');run.className='run';run.textContent='Run on Claude';\nconst hb=document.createElement('button');hb.className='hint';hb.textContent='Hint';bw.append(run,hb);d.appendChild(bw);\nconst msg=document.createElement('div');msg.className='fb';msg.setAttribute('role','status');const out=document.createElement('div');out.className='resp';d.append(msg,out);\nhb.onclick=()=>{msg.textContent='Hint: '+L.hint;};\nrun.onclick=async()=>{const u=L.lock?L.u:ut.value.trim(),s=sy?sy.value.trim():'';\nif(!u||(sy&&!s)){msg.textContent='Fill in the box first.';return;}\nlet p=s?s+'\\n\\n'+u:u;run.disabled=true;msg.textContent='Claude is thinking\u2026';out.className='resp';out.textContent='';\ntry{if(!sample)sample=await getSample();\nif(!sample){msg.textContent='Live Claude is not available here. Open this page from its claude.ai link while signed in.';return;}\nconst r=await sample(p,{model:MODEL,modelTier:\"quick\",cache:false,onText:({text})=>{out.textContent=text;}});out.textContent=r.text;\nconst ok=L.ok(r.text,u,sel&&sel.value);out.className='resp '+(ok?'ok':'no');msg.textContent=ok?'\u2713 Passed.':'\u2717 Not yet. Read the reply and tighten your prompt.';\nif(ok){d.classList.add('pass');ldone.add(i);}$('ls').textContent=`Labs passed: ${ldone.size} of ${LABS.length}`;}\ncatch(e){msg.textContent=liveErr(e);}\nfinally{run.disabled=false;}};\n$('labbox').appendChild(d);});\n/* case feedback */\n$('csb').onclick=async()=>{const t=$('cs').value.trim();if(words(t)<40){$('cso').textContent='Write your prompt and a short justification first.';return;}\nconst b=$('csb');b.disabled=true;$('cso').textContent='Claude is reviewing\u2026';\nconst p='You are a supportive tutor. A first-year engineering student was given this case: design a prompt for a university helpdesk assistant that answers admission and timetable questions politely, replies in Kannada or Hindi on request, avoids assumptions about the student, and answers only from the official handbook text. They must also justify their design using ideas from prompt engineering in communication (clarity, creativity, adapting context, language barriers, ethics), the advantages (question answering etc.) and future ideas. Do not give a mark. Reply with: what the prompt does well, what is missing (check for role and tone, handbook data in tags, an \u201cif not found\u201d fallback, language handling, bias handling, an example), whether the justification links to the unit ideas, and one improvement tip. Under 170 words.\\n\\n<answer>'+t+'<\/answer>';\ntry{if(!sample)sample=await getSample();\nif(!sample){$('cso').textContent='Live Claude is not available here. Open this page from its claude.ai link while signed in.';return;}\nconst r=await sample(p,{model:MODEL,modelTier:\"quick\",cache:false,onText:({text})=>{$('cso').textContent=text;}});$('cso').textContent=r.text;}\ncatch(e){$('cso').textContent=liveErr(e);}\nfinally{b.disabled=false;}};\n<\/script>\n<script>document.addEventListener(\"click\",function(e){var a=e.target.closest&&e.target.closest(\"a[href]\");if(!a)return;var h=a.getAttribute(\"href\");var m=h&&h.match(/^([a-z0-9-]+)\\.html$/i);if(m){e.preventDefault();parent.postMessage({go:m[1]},\"*\");}});<\/script><\/body>\n<\/html>\n", "unit-2-3-part1": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Module 2 \u00b7 Unit 2.3 (part 1) \u00b7 Prompt Engineering Techniques<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f2f5ef;--grid:#d5e0d3;--sf:#fff;--ink:#16212b;--mute:#4c5b66;--blue:#1f5fd6;--hi:#ffd84d;--ok:#1f8f5a;--bad:#d23b41;--okbg:#dff3e7;--badbg:#fbe0e1;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10171d;--grid:#1c2830;--sf:#18222a;--ink:#eaf0f3;--mute:#9fb0ba;--blue:#7fb0ff;--ok:#52d196;--bad:#ff7b80;--okbg:#14382a;--badbg:#44191c}}\n:root[data-theme=\"dark\"]{--bg:#10171d;--grid:#1c2830;--sf:#18222a;--ink:#eaf0f3;--mute:#9fb0ba;--blue:#7fb0ff;--ok:#52d196;--bad:#ff7b80;--okbg:#14382a;--badbg:#44191c}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:17px/1.55 \"Atkinson Hyperlegible\",system-ui,sans-serif}\nmain{max-width:860px;margin:0 auto;padding:18px 16px 60px}\nh1,h2,h3{font-family:\"Bricolage Grotesque\",system-ui,sans-serif;line-height:1.1;margin:0}\nh1{font-size:clamp(2rem,6.5vw,3.2rem);font-weight:800;letter-spacing:-.02em}\nh2{font-size:1.45rem;font-weight:800}h3{font-size:1.1rem}\n.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}\n.nav span,.nav a{border:2px solid var(--ink);padding:2px 10px;font-weight:700;font-size:.9rem;background:var(--sf);color:var(--ink);text-decoration:none}\n.nav .on{background:var(--hi);color:#16212b}.nav .off{opacity:.45}\n.sub{color:var(--mute);max-width:64ch;margin:6px 0}\nsection{background:var(--sf);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:18px;margin-top:26px}\n.tag{font-weight:700;color:var(--blue);font-size:.9rem}\nbutton{font:inherit;cursor:pointer;color:var(--ink)}\n:focus-visible{outline:3px solid var(--blue);outline-offset:2px}\ndetails{border:2px solid var(--ink);background:var(--bg);margin:8px 0;padding:8px 12px}\nsummary{cursor:pointer;font-weight:700}details p{margin:6px 0}\n.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0;font-weight:700}\n.flow span{border:2px solid var(--ink);background:var(--hi);color:#16212b;padding:3px 10px}\n.q{font-weight:700;margin:12px 0 4px}\n.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}\n.opt{border:2px solid var(--ink);background:var(--sf);padding:8px 14px;font-weight:700;text-align:left}\n.opt:hover:not(:disabled){background:var(--hi);color:#16212b}\n.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}\n.fb{font-weight:700;min-height:1.4em}\nlabel{display:block;font-weight:700;font-size:.88rem;color:var(--mute);margin:8px 0 2px}\ntextarea,.lock{width:100%;font:inherit;font-family:ui-monospace,Menlo,monospace;font-size:.88rem;padding:8px;border:2px solid var(--ink);background:var(--bg);color:var(--ink)}\ntextarea{min-height:110px;resize:vertical}.lock{border-style:dashed;white-space:pre-wrap}\n.run{margin-top:10px;border:2px solid var(--ink);background:var(--hi);color:#16212b;font-weight:700;padding:8px 18px;box-shadow:3px 3px 0 var(--ink)}\n.run:disabled{opacity:.6;cursor:wait}\n.hint{margin-left:8px;border:2px solid var(--ink);background:var(--sf);padding:6px 12px}\n.lab{border:2px solid var(--ink);padding:14px;margin-top:14px;background:var(--bg)}.lab.pass{border-color:var(--ok)}\n.trio{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}\n.resp{margin-top:8px;padding:8px 10px;border:2px dashed var(--ink);white-space:pre-wrap;font-size:.9rem;min-height:2.6em;background:var(--sf)}\n.resp.ok{background:var(--okbg);border:2px solid var(--ok)}.resp.no{background:var(--badbg);border:2px solid var(--bad)}\n.pill{background:var(--hi);color:#16212b;border:2px solid var(--ink);padding:1px 10px;font-weight:700;font-size:.85rem}\n.score{margin-top:10px;font-weight:700}\n<\/style>\n<\/head>\n<body>\n<main>\n<div class=\"nav\"><a href=\"hub.html\">Module 2 hub<\/a><a href=\"unit-2-1.html\">2.1 Intro<\/a><a href=\"unit-2-2.html\">2.2 Communication<\/a><span class=\"on\">2.3 Techniques (1/2)<\/span><a href=\"unit-2-3-part2.html\">2.3 (2/2)<\/a><a href=\"unit-2-4.html\">2.4 Creative<\/a><a href=\"index.html\">2.5 Writing<\/a><\/div>\n<h1>Unit 2.3 (part 1): Prompt Engineering Techniques<\/h1>\n<p class=\"sub\">Module 2 \u00b7 2 lecture hours across two pages \u00b7 Part 1: the techniques overview, the instructions prompt, and zero-, one- and few-shot prompting. Part 2 covers self-consistency and the prompt gallery.<\/p>\n<div id=\"theory\"><\/div>\n<section><div class=\"tag\">Apply it \u00b7 Scenarios<\/div><h2>Six application questions<\/h2><p class=\"sub\">Pick the best technique for each situation, then read why.<\/p><div id=\"quiz\"><\/div><div class=\"score\" id=\"qs\"><\/div><\/section>\n<section><div class=\"tag\">Apply it \u00b7 Live on Claude<\/div><h2>Three labs<\/h2>\n<p class=\"sub\">Run prompts on Claude and see the techniques at work. <span class=\"pill\">Model: Claude Haiku (same for the class)<\/span> Replies vary a little, so run again if you narrowly miss.<\/p>\n<div id=\"labbox\"><\/div><div class=\"score\" id=\"ls\"><\/div><\/section>\n<\/main>\n<script>\nconst MODEL=\"claude-haiku-5-5\";\nconst $=id=>document.getElementById(id);\nconst liveErr=e=>{try{console.error(e)}catch(_){}const c=e&&e.code;const m={not_granted:'Claude was not allowed. Reload this page and click Allow when the permission box appears.',rate_limited:'Too many runs. Wait a moment, then try again.',not_declared:'This page is not set up for live Claude. Tell your teacher.',capability_disabled:'Live Claude is switched off for this page. Tell your teacher.',capability_removed:'Live Claude was removed from this page. Tell your teacher.',sampling_disabled:'Live Claude is turned off for your account or organisation.',session_expired:'Your session expired. Reload the page.',upstream_error:'Claude is busy. Try again in a moment.',empty_completion:'Claude sent an empty reply. Run it again.',refused:'Claude declined this prompt. Change the wording.',queue_overflow:'Too many requests are waiting. Try again shortly.',cancelled:'Stopped.',invalid_request:'The request was not accepted. Tell your teacher.'}[c];return (m||\"Couldn't reach Claude. Try again.\")+(c?' (code: '+c+')':(e&&e.message?' ('+String(e.message).slice(0,80)+')':''));};\n/* live Claude when available, otherwise paste mode (works in any phone browser) */\nconst HARD=['not_granted','sampling_disabled','capability_disabled','capability_removed','not_declared'];\nlet liveFn=null,liveDone=false,pasteOnly=false;\n(async()=>{try{if(typeof claude!=='undefined'&&claude&&claude.use)liveFn=await claude.use(\"sample\");}catch(e){liveFn=null;}liveDone=true;})();\nconst wait=ms=>new Promise(r=>setTimeout(r,ms));\nconst pasteQ=[];let pasteBusy=false;\nfunction pasteAsk(p,o){return new Promise((res,rej)=>{pasteQ.push({p,o,res,rej});pump();});}\nfunction pump(){if(pasteBusy||!pasteQ.length)return;pasteBusy=true;const {p,o,res,rej}=pasteQ.shift();\nconst ov=document.createElement('div');ov.setAttribute('role','dialog');ov.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:12px';\nconst bx=document.createElement('div');bx.style.cssText='background:var(--sf,var(--surface,#fff));color:var(--ink,#16212b);border:2px solid var(--ink,#16212b);box-shadow:5px 5px 0 var(--ink,#16212b);max-width:660px;width:100%;padding:16px;margin:8px 0';\nconst mkb=(t,bg)=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='font:inherit;cursor:pointer;border:2px solid var(--ink,#16212b);padding:7px 14px;font-weight:700;margin:8px 8px 0 0;background:'+bg+';color:#16212b';return b;};\nconst ta=()=>{const t=document.createElement('textarea');t.style.cssText='width:100%;min-height:120px;font:14px ui-monospace,Menlo,monospace;padding:8px;border:2px solid var(--ink,#16212b);background:var(--bg,#f2f5ef);color:var(--ink,#16212b)';return t;};\nconst h=document.createElement('div');h.style.cssText='font-weight:800;font-size:1.15rem;margin-bottom:6px';h.textContent='Run this in your own Claude chat';\nconst ex=document.createElement('p');ex.style.margin='0 0 8px';ex.textContent=\"Live Claude isn't available in this view. 1) Copy the prompt. 2) Open Claude (use Haiku if you can choose), paste it and send. 3) Paste Claude's reply below.\";\nconst pt=ta();pt.readOnly=true;pt.value=p;const cp=mkb('Copy prompt','#ffd84d');\ncp.onclick=async()=>{try{await navigator.clipboard.writeText(p);cp.textContent='Copied \u2713';}catch(e){pt.focus();pt.select();cp.textContent='Press copy on your keyboard';}};\nconst l2=document.createElement('div');l2.style.cssText='font-weight:700;margin-top:10px';l2.textContent=\"Claude's reply\";\nconst rt=ta();const ok=mkb('Use this reply','#ffd84d');const no=mkb('Cancel','transparent');const em=document.createElement('div');em.style.cssText='font-weight:700;min-height:1.2em';\nconst done=()=>{ov.remove();pasteBusy=false;};\nok.onclick=()=>{const t=rt.value.trim();if(!t){em.textContent='Paste the reply first.';return;}done();try{o&&o.onText&&o.onText({text:t,delta:t});}catch(e){}res({text:t,truncated:false});pump();};\nno.onclick=()=>{done();const q=pasteQ.splice(0);rej({code:'cancelled',message:'cancelled'});q.forEach(x=>x.rej({code:'cancelled',message:'cancelled'}));};\nbx.append(h,ex,pt,cp,l2,rt,em,ok,no);ov.appendChild(bx);document.body.appendChild(ov);setTimeout(()=>{try{rt.focus();}catch(e){}},50);}\nasync function getSample(){return async(p,o)=>{\n if(!liveDone)await Promise.race([(async()=>{while(!liveDone)await wait(100);})(),wait(8000)]);\n if(liveFn&&!pasteOnly){try{return await liveFn(p,o);}catch(e){if(HARD.includes(e&&e.code))pasteOnly=true;else throw e;}}\n return pasteAsk(p,o);};}\nconst TH=[\n{h:\"Theory 1 \u00b7 Prompt engineering techniques: an overview\",s:\"Techniques are the methods used to guide what a language model produces. They can be combined. Open each part.\",flow:[\"Standard prompt\",\"Role prompting\",\"Seed-word prompting\",\"Instructions prompt\",\"Zero / one / few shot\"],p:[\n[\"Introduction\",[[\"\",\"Prompt engineering techniques are the methods used to guide the output of language models such as ChatGPT or Claude. Each technique shapes how the model generates text. Used well, they help the model produce relevant, accurate and high-quality responses across many tasks and domains, and they can be mixed to suit the task.\"]]],\n[\"Standard prompts\",[[\"Explain\",\"A plain instruction or question with no special technique added. It is the baseline that other techniques improve on. (The textbook names it without detail; this is the common meaning.)\"],[\"Example\",\"\u201cExplain what a diode does.\u201d\"]]],\n[\"Role prompting\",[[\"Explain\",\"The model is told to adopt a role or perspective, such as a tech expert, so its tone, focus and content change.\"],[\"Example\",\"\u201cYou are a tech reviewer. Explain what a diode does.\u201d\"],[\"Class link\",\"Tutorial Ch. 3, roles.\"]]],\n[\"Seed-word prompting\",[[\"Explain\",\"The prompt supplies key words or topics that the answer should focus on, for example the specific features of a smartphone.\"],[\"Example\",\"\u201cReview this phone. Focus on: battery, camera, display.\u201d\"]]],\n[\"Choosing and combining\",[[\"Explain\",\"No single technique is best everywhere. The right choice depends on the task, and several techniques are often combined, then tested and refined. The next two topics explain the instructions prompt and shot prompting.\"]]]]},\n{h:\"Theory 2 \u00b7 The instructions prompt technique\",s:\"Give the model specific instructions to follow, so the text matches the objectives and requirements of the task.\",flow:[\"State the rule\",\"Model follows it\",\"Output meets the requirement\"],p:[\n[\"Introduction\",[[\"\",\"The instructions prompt technique guides a language model by giving it specific instructions to follow. This makes the generated text line up with the objectives and requirements of the task.\"]]],\n[\"Example 1: customer service\",[[\"Instruction\",\"\u201cResponses should be professional and provide accurate information.\u201d\"],[\"Effect\",\"The model is steered toward replies that meet the criteria of professionalism and accuracy.\"]]],\n[\"Example 2: a legal document\",[[\"Instruction\",\"\u201cThe document should comply with relevant laws and regulations.\u201d\"],[\"Effect\",\"The instruction makes the draft follow legal standards and requirements.\"]]],\n[\"Combining with other techniques\",[[\"Explain\",\"Instructions can be combined with other methods for more precision and control. For a smartphone review, the instruction \u201cthe review should be unbiased and informative\u201d can be joined with role prompting (the perspective of a tech expert) and seed-word prompting (specific features). Together they give a comprehensive, insightful review.\"],[\"Class link\",\"Tutorial Ch. 2, clear and direct, and Ch. 9, where rules like \u201cif unsure, say\u2026\u201d are written as instructions. Lab 3 below.\"]]],\n[\"Conclusion\",[[\"\",\"The instructions prompt is the simplest way to control behaviour: say what the output must be like. It works best when the instructions are specific, and it becomes stronger when combined with a role and focus words.\"]]]]},\n{h:\"Theory 3 \u00b7 Zero-, one- and few-shot prompting\",s:\"\u201cShots\u201d are the examples you give. More context usually means more accurate answers.\",flow:[\"Zero shot: no example\",\"One shot: one example\",\"Few shot: a few examples\"],p:[\n[\"Introduction\",[[\"\",\"Zero-, one- and few-shot prompting give a model varying amounts of context when it answers. The \u201cshot\u201d count is the number of examples in the prompt. The approach is useful when the model must respond from limited examples or context.\"]]],\n[\"Zero-shot prompting\",[[\"Explain\",\"The user gives only an instruction, with no examples. The model relies on what it already knows.\"],[\"Example\",\"\u201cWrite a poem about nature.\u201d\"],[\"Good for\",\"Open-ended, creative tasks and seeing how well the model generalises.\"],[\"Limitation\",\"Answers can be less accurate or relevant than when examples are given.\"]]],\n[\"One-shot prompting\",[[\"Explain\",\"The user supplies a single example, and the model uses it to produce its response. The textbook's example is giving one sentence from a paragraph when asking for a summary.\"],[\"Good for\",\"Cases where only one example or little context is available.\"],[\"Limitation\",\"Its success depends on the task's complexity and the quality of the example. A harder task may need more.\"]]],\n[\"Few-shot prompting\",[[\"Explain\",\"The user supplies a small number of examples, and the model uses them to respond. The textbook's example is giving a few sentences about a smartphone's features before asking for a review.\"],[\"Good for\",\"More accurate and relevant answers than zero or one shot, because the model sees more of the task's nuances.\"],[\"Limitation\",\"It still depends on the quality and relevance of the examples, which must be representative. You may need to experiment with how many to use and what kind.\"]]],\n[\"In practice (tutorial)\",[[\"Explain\",\"In the tutorial, few-shot means writing input and output pairs in the exact format you want, then ending with the new input. Include the trickier cases, because examples teach the format and the answer.\"],[\"Example\",\"Q: How much does a Mixmaster4000 cost? A: A  |  Q: My mixer will not turn on. A: B  |  Q: {new email} A:\"],[\"Class link\",\"Tutorial Ch. 7, Ex 7.1. Lab 1 and Lab 2 below.\"]]],\n[\"Conclusion\",[[\"\",\"Choose the number of shots by the task: zero for open-ended work, one when examples are scarce, and few for accuracy and format control. In every case, good examples matter more than many examples.\"]]]]}];\nTH.forEach((t,ti)=>{const s=document.createElement('section');const tg=document.createElement('div');tg.className='tag';tg.textContent=t.h.split(' \u00b7 ')[0];\nconst h=document.createElement('h2');h.textContent=t.h.split(' \u00b7 ')[1];const sb=document.createElement('p');sb.className='sub';sb.textContent=t.s;s.append(tg,h,sb);\nconst fl=document.createElement('div');fl.className='flow';t.flow.forEach((f,i)=>{if(i)fl.append('\u2192');const sp=document.createElement('span');sp.textContent=f;fl.appendChild(sp);});s.appendChild(fl);\nt.p.forEach(([sm,rows],i)=>{const d=document.createElement('details');if(i===0&&ti===0)d.open=true;const su=document.createElement('summary');su.textContent=sm;d.appendChild(su);\nrows.forEach(([l,x])=>{const p=document.createElement('p');if(l){const b=document.createElement('b');b.textContent=l+': ';p.appendChild(b);}p.append(x);d.appendChild(p);});s.appendChild(d);});\n$('theory').appendChild(s);});\n/* scenarios */\nconst QZ=[\n[\"A support chatbot must always sound professional and give accurate information. Which technique states this most directly?\",[\"Zero-shot prompting\",\"Instructions prompt\",\"Seed-word prompting\",\"Self-consistency\"],1,\"The instructions prompt tells the model what the output must be like.\"],\n[\"A student asks for \u201ca poem about nature\u201d and gives no examples or context. Which technique is this, and what is the trade-off?\",[\"Few-shot, more accurate\",\"Zero-shot, flexible but sometimes less accurate\",\"One-shot, always accurate\",\"Role prompting, always creative\"],1,\"No examples means zero-shot. It is open-ended but can be less accurate or relevant.\"],\n[\"A team wants a smartphone review that is unbiased, written like a tech expert, and focused on battery and camera. Which combination fits?\",[\"Zero-shot only\",\"Few-shot only\",\"Instructions + role prompting + seed-word prompting\",\"One-shot only\"],2,\"Instructions set the rules, the role sets the perspective, and seed words set the focus.\"],\n[\"A classifier keeps giving answers in inconsistent formats. Which fix is most effective?\",[\"Remove all instructions\",\"Add few-shot examples that show the exact format\",\"Make the prompt shorter\",\"Use zero-shot\"],1,\"Examples that show the exact output format teach the pattern.\"],\n[\"You have only one sample support ticket with its correct label. Which technique can you use now, and what is the risk?\",[\"One-shot, but a hard task may need more examples\",\"Few-shot, with no risk\",\"Zero-shot, with no risk\",\"Seed-word, with no risk\"],0,\"One example is one-shot. Success depends on the task and the example's quality.\"],\n[\"Your few-shot examples are all easy cases, but real emails are tricky. What should you change?\",[\"Add examples of the trickier cases\",\"Delete the examples\",\"Make the examples longer\",\"Switch to zero-shot\"],0,\"Examples must be representative, so include the tricky categories.\"]];\nlet qd=0,qc=0;\nQZ.forEach(([q,o,a,e])=>{const d=document.createElement('div');const h=document.createElement('div');h.className='q';h.textContent=q;\nconst w=document.createElement('div');w.className='opts';const f=document.createElement('div');f.className='fb';let dn=false;\no.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{if(dn)return;dn=true;qd++;\nif(i===a){qc++;b.classList.add('right');f.textContent='\u2713 '+e;}else{b.classList.add('wrong');w.children[a].classList.add('right');f.textContent='\u2717 '+e;}\n$('qs').textContent=`Answered ${qd} of ${QZ.length}. Correct: ${qc}.`+(qd===QZ.length?` Score: ${Math.round(qc/QZ.length*100)}%.`:'');};w.appendChild(b);});\nd.append(h,w,f);$('quiz').appendChild(d);});\n/* labs */\nconst CATS=\"(A) Pre-sale question\\n(B) Broken or defective item\\n(C) Billing question\\n(D) Other (please explain)\";\nconst EM=[\"Hi -- My Mixmaster4000 is producing a strange noise when I operate it. It also smells a bit smoky and plasticky, like burning electronics.  I need a replacement.\",\"Can I use my Mixmaster 4000 to mix paint, or is it only meant for mixing food?\",\"I HAVE BEEN WAITING 4 MONTHS FOR MY MONTHLY CHARGES TO END AFTER CANCELLING!!  WTF IS GOING ON???\",\"How did I get here I am not good with computer.  Halp.\"];\nconst EXP=[\"B\",\"AD\",\"C\",\"D\"];\nconst MAIL=EM[1];\nconst ZERO=\"Classify this email into one category. Reply with only the letter.\\n\\n\"+CATS+\"\\n\\nEmail: \"+MAIL;\nconst ONE=\"Classify this email into one category. Reply with only the letter.\\n\\n\"+CATS+\"\\n\\nExample:\\nEmail: My blender will not turn on.\\nAnswer: B\\n\\nEmail: \"+MAIL+\"\\nAnswer:\";\nconst FEW=\"Classify this email into one category. Reply with only the letter.\\n\\n\"+CATS+\"\\n\\nExamples:\\nEmail: How much does a Mixmaster4000 cost?\\nAnswer: A\\n\\nEmail: My blender will not turn on.\\nAnswer: B\\n\\nEmail: Why was I charged twice this month?\\nAnswer: C\\n\\nEmail: Please remove me from your mailing list.\\nAnswer: D\\n\\nEmail: \"+MAIL+\"\\nAnswer:\";\nlet sample=null,ldone=new Set();\nasync function ensure(){if(!sample)sample=await getSample();return sample;}\nasync function call(p,box){const r=await sample(p,{model:MODEL,modelTier:\"quick\",cache:false,onText:({text})=>{box.textContent=text;}});box.textContent=r.text;return r.text;}\nconst err=e=>liveErr(e);\nconst NOLIVE='Live Claude is not available here. Open this page from its claude.ai link while signed in.';\nfunction mk(L){const d=document.createElement('div');d.className='lab';const h=document.createElement('h3');h.textContent=L.t;const p=document.createElement('p');p.className='sub';p.textContent=L.task;d.append(h,p);return d;}\n/* lab 1: trio */\n(function(){const d=mk({t:\"Lab 1: Zero vs one vs few shot\",task:\"Same email (\u201cCan I use my Mixmaster 4000 to mix paint\u2026?\u201d), three prompts. Edit them if you like, run all three, and compare. A reply ends with just a letter when the format is right.\"});\nconst g=document.createElement('div');g.className='trio';const T=[],R=[];\n[[\"Zero-shot\",ZERO],[\"One-shot\",ONE],[\"Few-shot\",FEW]].forEach(([n,v])=>{const c=document.createElement('div');const l=document.createElement('label');l.textContent=n;const t=document.createElement('textarea');t.value=v;const r=document.createElement('div');r.className='resp';c.append(l,t,r);g.appendChild(c);T.push(t);R.push(r);});\nconst run=document.createElement('button');run.className='run';run.textContent='Run all three';const m=document.createElement('div');m.className='fb';m.setAttribute('role','status');d.append(g,run,m);\nrun.onclick=async()=>{run.disabled=true;m.textContent='Claude is thinking\u2026';R.forEach(r=>{r.className='resp';r.textContent='';});\ntry{if(!await ensure()){m.textContent=NOLIVE;return;}\nconst out=await Promise.all(T.map((t,i)=>call(t.value,R[i])));\nout.forEach((t,i)=>{R[i].className='resp '+(/^[A-D]$/.test(t.trim().slice(-1))&&t.trim().length<=3?'ok':'no');});\nm.textContent='Green = reply is only a letter. Did more examples change the format or the answer? Discuss.';}\ncatch(e){m.textContent=err(e);}finally{run.disabled=false;}};\n$('labbox').appendChild(d);})();\n/* labs 2 and 3 */\nconst LABS=[\n{t:\"Lab 2: Few-shot classifier (Tutorial Ex 7.1)\",task:\"Edit the template so every reply ENDS with only the category letter, for all four emails. Include the categories and at least two examples, and keep {{EMAIL}}.\",hint:\"Write example emails with answers in the exact format you want, include the trickier categories, and keep {{EMAIL}} at the end. Email 2 may be A or D.\",u:\"Please classify this email as either green or blue: {{EMAIL}}\",inp:EM.map(e=>({EMAIL:e})),\n need:u=>u.includes(\"{{EMAIL}}\")?\"\":\"Keep {{EMAIL}} in the template.\",ok:R=>R.every((t,i)=>EXP[i].includes(t.trim().slice(-1)))},\n{t:\"Lab 3: Combine three techniques\",task:\"Write one prompt that gives Claude an instruction (the review must be unbiased and informative), a role (a tech expert), and focus words (battery and camera) to review a new smartphone.\",hint:\"Use the words \u201cunbiased\u201d and \u201cinformative\u201d, start with \u201cYou are\u2026\u201d, and name battery and camera.\",u:\"\",\n ok:(R,u)=>/unbiased/i.test(u)&&/informative/i.test(u)&&/you are|act as/i.test(u)&&/battery/i.test(R[0])&&/camera/i.test(R[0])&&R[0].trim().split(/\\s+/).length>=40}];\nLABS.forEach((L,i)=>{const d=mk(L);d.classList.add('l2');\nconst lb=document.createElement('label');lb.textContent=L.inp?'Prompt template (edit this)':'Your prompt (edit this)';const ta=document.createElement('textarea');ta.value=L.u;d.append(lb,ta);\nconst bw=document.createElement('div');const run=document.createElement('button');run.className='run';run.textContent='Run on Claude';const hb=document.createElement('button');hb.className='hint';hb.textContent='Hint';bw.append(run,hb);d.appendChild(bw);\nconst msg=document.createElement('div');msg.className='fb';msg.setAttribute('role','status');const out=document.createElement('div');d.append(msg,out);\nhb.onclick=()=>{msg.textContent='Hint: '+L.hint;};\nrun.onclick=async()=>{const u=ta.value.trim();if(!u){msg.textContent='Fill in the box first.';return;}const bad=L.need?L.need(u):'';if(bad){msg.textContent=bad;return;}\nrun.disabled=true;out.innerHTML='';msg.textContent='Claude is thinking\u2026';\ntry{if(!await ensure()){msg.textContent=NOLIVE;return;}\nconst inp=L.inp||[{}],R=[],boxes=[];\nfor(let k=0;k<inp.length;k++){const b=document.createElement('div');b.className='resp';out.appendChild(b);boxes.push(b);let p=u;for(const v in inp[k])p=p.split(\"{{\"+v+\"}}\").join(inp[k][v]);R.push(await call(p,b));}\nconst ok=L.ok(R,u);boxes.forEach(b=>b.classList.add(ok?'ok':'no'));msg.textContent=ok?'\u2713 Passed.':'\u2717 Not yet. Read the replies and tighten your prompt.';\nif(ok){d.classList.add('pass');ldone.add(i);}$('ls').textContent=`Graded labs passed: ${ldone.size} of ${LABS.length}`;}\ncatch(e){msg.textContent=err(e);}finally{run.disabled=false;}};\n$('labbox').appendChild(d);});\n<\/script>\n<script>document.addEventListener(\"click\",function(e){var a=e.target.closest&&e.target.closest(\"a[href]\");if(!a)return;var h=a.getAttribute(\"href\");var m=h&&h.match(/^([a-z0-9-]+)\\.html$/i);if(m){e.preventDefault();parent.postMessage({go:m[1]},\"*\");}});<\/script><\/body>\n<\/html>\n", "unit-2-3-part2": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Module 2 \u00b7 Unit 2.3 (part 2) \u00b7 Self-Consistency and the Prompt Gallery<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f2f5ef;--grid:#d5e0d3;--sf:#fff;--ink:#16212b;--mute:#4c5b66;--blue:#1f5fd6;--hi:#ffd84d;--ok:#1f8f5a;--bad:#d23b41;--okbg:#dff3e7;--badbg:#fbe0e1;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10171d;--grid:#1c2830;--sf:#18222a;--ink:#eaf0f3;--mute:#9fb0ba;--blue:#7fb0ff;--ok:#52d196;--bad:#ff7b80;--okbg:#14382a;--badbg:#44191c}}\n:root[data-theme=\"dark\"]{--bg:#10171d;--grid:#1c2830;--sf:#18222a;--ink:#eaf0f3;--mute:#9fb0ba;--blue:#7fb0ff;--ok:#52d196;--bad:#ff7b80;--okbg:#14382a;--badbg:#44191c}\nhtml{sc ts. Learn the theory, then apply it.<\/p>\n<div id=\"theory\"><\/div>\n<section><div class=\"tag\">Apply it \u00b7 Scenarios<\/div><h2>Six application questions<\/h2><p class=\"sub\">Pick the best answer for each situation, then read why.<\/p><div id=\"quiz\"><\/div><div class=\"score\" id=\"qs\"><\/div><\/section>\n<section><div class=\"tag\">Apply it \u00b7 Live on Claude<\/div><h2>Labs<\/h2>\n<p class=\"sub\">Write a prompt, run it, and the page checks the reply. <span class=\"pill\">Model: Claude Haiku (same for the class)<\/span> If live Claude is not available, the page asks you to run the prompt in your own Claude chat and paste the reply back. Replies vary a little, so run again if you narrowly miss.<\/p>\n<div id=\"labbox\"><\/div><div class=\"score\" id=\"ls\"><\/div><\/section>\n\n<\/main>\n<script>\nconst MODEL=\"claude-haiku-5-5\";\nconst $=id=>document.getElementById(id);\nconst liveErr=e=>{try{console.error(e)}catch(_){}const c=e&&e.code;const m={not_granted:'Claude was not allowed. Reload this page and click Allow when the permission box appears.',rate_limited:'Too many runs. Wait a moment, then try again.',not_declared:'This page is not set up for live Claude. Tell your teacher.',capability_disabled:'Live Claude is switched off for this page. Tell your teacher.',capability_removed:'Live Claude was removed from this page. Tell your teacher.',sampling_disabled:'Live Claude is turned off for your account or organisation.',session_expired:'Your session expired. Reload the page.',upstream_error:'Claude is busy. Try again in a moment.',empty_completion:'Claude sent an empty reply. Run it again.',refused:'Claude declined this prompt. Change the wording.',queue_overflow:'Too many requests are waiting. Try again shortly.',cancelled:'Stopped.',invalid_request:'The request was not accepted. Tell your teacher.'}[c];return (m||\"Couldn't reach Claude. Try again.\")+(c?' (code: '+c+')':(e&&e.message?' ('+String(e.message).slice(0,80)+')':''));};\n/* live Claude when available, otherwise paste mode (works in any phone browser) */\nconst HARD=['not_granted','sampling_disabled','capability_disabled','capability_removed','not_declared'];\nlet liveFn=null,liveDone=false,pasteOnly=false;\n(async()=>{try{if(typeof claude!=='undefined'&&claude&&claude.use)liveFn=await claude.use(\"sample\");}catch(e){liveFn=null;}liveDone=true;})();\nconst wait=ms=>new Promise(r=>setTimeout(r,ms));\nconst pasteQ=[];let pasteBusy=false;\nfunction pasteAsk(p,o){return new Promise((res,rej)=>{pasteQ.push({p,o,res,rej});pump();});}\nfunction pump(){if(pasteBusy||!pasteQ.length)return;pasteBusy=true;const {p,o,res,rej}=pasteQ.shift();\nconst ov=document.createElement('div');ov.setAttribute('role','dialog');ov.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:12px';\nconst bx=document.createElement('div');bx.style.cssText='background:var(--sf,var(--surface,#fff));color:var(--ink,#16212b);border:2px solid var(--ink,#16212b);box-shadow:5px 5px 0 var(--ink,#16212b);max-width:660px;width:100%;padding:16px;margin:8px 0';\nconst mkb=(t,bg)=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='font:inherit;cursor:pointer;border:2px solid var(--ink,#16212b);padding:7px 14px;font-weight:700;margin:8px 8px 0 0;background:'+bg+';color:#16212b';return b;};\nconst ta=()=>{const t=document.createElement('textarea');t.style.cssText='width:100%;min-height:120px;font:14px ui-monospace,Menlo,monospace;padding:8px;border:2px solid var(--ink,#16212b);background:var(--bg,#f2f5ef);color:var(--ink,#16212b)';return t;};\nconst h=document.createElement('div');h.style.cssText='font-weight:800;font-size:1.15rem;margin-bottom:6px';h.textContent='Run this in your own Claude chat';\nconst ex=document.createElement('p');ex.style.margin='0 0 8px';ex.textContent=\"Live Claude isn't available in this view. 1) Copy the prompt. 2) Open Claude (use Haiku if you can choose), paste it and send. 3) Paste Claude's reply below.\";\nconst pt=ta();pt.readOnly=true;pt.value=p;const cp=mkb('Copy prompt','#ffd84d');\ncp.onclick=async()=>{try{await navigator.clipboard.writeText(p);cp.textContent='Copied \u2713';}catch(e){pt.focus();pt.select();cp.textContent='Press copy on your keyboard';}};\nconst l2=document.createElement('div');l2.style.cssText='font-weight:700;margin-top:10px';l2.textContent=\"Claude's reply\";\nconst rt=ta();const ok=mkb('Use this reply','#ffd84d');const no=mkb('Cancel','transparent');const em=document.createElement('div');em.style.cssText='font-weight:700;min-height:1.2em';\nconst done=()=>{ov.remove();pasteBusy=false;};\nok.onclick=()=>{const t=rt.value.trim();if(!t){em.textContent='Paste the reply first.';return;}done();try{o&&o.onText&&o.onText({text:t,delta:t});}catch(e){}res({text:t,truncated:false});pump();};\nno.onclick=()=>{done();const q=pasteQ.splice(0);rej({code:'cancelled',message:'cancelled'});q.forEach(x=>x.rej({code:'cancelled',message:'cancelled'}));};\nbx.append(h,ex,pt,cp,l2,rt,em,ok,no);ov.appendChild(bx);document.body.appendChild(ov);setTimeout(()=>{try{rt.focus();}catch(e){}},50);}\nasync function getSample(){return async(p,o)=>{\n if(!liveDone)await Promise.race([(async()=>{while(!liveDone)await wait(100);})(),wait(8000)]);\n if(liveFn&&!pasteOnly){try{return await liveFn(p,o);}catch(e){if(HARD.includes(e&&e.code))pasteOnly=true;else throw e;}}\n return pasteAsk(p,o);};}\nconst TH=[{\"h\": \"Theory 4 \u00b7 The self-consistency prompt\", \"s\": \"A way to keep generated text coherent by anchoring it to facts you supply. Open each part.\", \"flow\": [\"Choose key facts\", \"Put them in the prompt\", \"Reply stays consistent\"], \"p\": [[\"Introduction\", [[\"\", \"The self-consistency prompt is an advanced technique for keeping the text a model generates coherent and logically consistent. The prompt contains key information, statements or facts that the user wants the output to stay consistent with throughout the conversation.\"]]], [\"How it differs from an ordinary prompt\", [[\"Explain\", \"An ordinary prompt gives only a task or context. A self-consistency prompt also carries anchors: background information, established facts, opinions or constraints that matter for the topic. They guide the model to stay coherent.\"], [\"Example\", \"Textbook idea: a discussion about climate change where the prompt includes scientific data and commonly accepted principles, so replies match established knowledge.\"], [\"Engineering example\", \"\u201cFacts to keep consistent: the circuit has a 12 V battery and a 4 \u03a9 resistor. Use only these values in every step.\u201d\"]]], [\"When it is most useful\", [[\"Explain\", \"When coherence and logical consistency are crucial: educational content, technical discussions and decision-making. Anchoring the conversation to specific information helps the model give answers that are accurate, informative and in context.\"], [\"Class link\", \"Tutorial Ch. 8 (avoiding hallucinations) also gives the model the facts it must use.\"]]], [\"The balance to strike\", [[\"Explain\", \"Too much detail, or overly restrictive instructions, can limit the model's flexibility and creativity and lead to repetitive or unnatural replies. Give enough guidance, and leave the model free to write naturally within the constraints.\"]]], [\"Extra: majority-vote self-consistency (not in the textbook)\", [[\"Explain\", \"In research, the same question is asked several times and the most common answer is chosen, which makes reasoning answers more reliable. This is a different meaning of the same name. Lab 2 lets you try it. Use the textbook meaning in exams.\"]]], [\"Conclusion\", [[\"\", \"Self-consistency prompting keeps output aligned with facts you provide. It works best for technical and educational tasks, as long as the anchors are clear and not so many that they suffocate the reply.\"]]]]}, {\"h\": \"Theory 5 \u00b7 The prompt gallery\", \"s\": \"A curated set of ready-made prompts for common tasks. Open each group.\", \"flow\": [\"Generate\", \"Classify\", \"Extract\", \"Answer\", \"Summarise\", \"Edit\", \"Translate\"], \"p\": [[\"Introduction\", [[\"\", \"The prompt gallery is a curated collection of predefined prompts, grouped by task, that users can pick from and adapt. It saves time, gives clear instructions that lead to consistent, good-quality output, and is continually expanded as new needs appear. Users can also contribute their own prompts.\"]]], [\"Text generation prompts\", [[\"Explain\", \"Make the model produce text in various formats and styles: narratives, essays, product descriptions or poetry. Set the task and guidelines to fit the need.\"], [\"Example\", \"\u201cWrite a 120-word product description for a solar lamp. Friendly tone.\u201d\"]]], [\"Text classification: sentiment analysis and rating\", [[\"Explain\", \"Sentiment analysis prompts ask whether a text, such as a review, is positive or negative. Sentiment rating prompts ask for a number on a scale, such as 1 to 5 stars, which gives a finer measure.\"], [\"Example\", \"\u201cRate this review from 1 to 5. Reply with only the number.\u201d\"], [\"Lab\", \"Lab 3 below.\"]]], [\"Information extraction: relations and keywords\", [[\"Explain\", \"Relation extraction finds relationships between entities in a text, such as family links, partnerships or cause and effect. Keyword extraction pulls out the significant terms that capture the main themes, useful for tagging, search optimisation and indexing.\"], [\"Example\", \"\u201cList every person named in the text, alphabetical, comma-separated.\u201d\"], [\"Lab\", \"Lab 4 below.\"]]], [\"Question answering: closed and open domain\", [[\"Explain\", \"Closed-domain prompts answer questions within a set topic, such as a customer-support bot for a product or policy. Open-domain prompts answer questions on any topic using the model's general knowledge.\"], [\"Class link\", \"Unit 2.2 case study: a handbook-only helpdesk is closed-domain.\"]]], [\"Summarisation and editing\", [[\"Explain\", \"Summarisation prompts condense long text while keeping the key information and main ideas, for documents, news or curation. Editing prompts revise text for clarity, coherence or style, such as grammar correction, sentence restructuring or richer vocabulary.\"]]], [\"Translation and transliteration\", [[\"Explain\", \"Translation prompts convert text from one language to another, for multilingual content and cross-language communication. Transliteration prompts convert text between writing systems while keeping the pronunciation, as with names or terms.\"]]], [\"Using a gallery prompt well\", [[\"Explain\", \"Pick the category, fill in the specifics, then add the output format and limits. A gallery prompt is a starting template, not a finished prompt.\"], [\"Class link\", \"Tutorial Ch. 5 (formatting output) and Ch. 8 (give the model an out).\"]]], [\"Conclusion\", [[\"\", \"The gallery covers generation, classification, extraction, question answering, summarising, editing and translation. Knowing the categories helps you choose a starting prompt quickly and then engineer it for your task.\"]]]]}];\nTH.forEach((t,ti)=>{const s=document.createElement('section');const tg=document.createElement('div');tg.className='tag';tg.textContent=t.h.split(' \u00b7 ')[0];\nconst h=document.createElement('h2');h.textContent=t.h.split(' \u00b7 ')[1];const sb=document.createElement('p');sb.className='sub';sb.textContent=t.s;s.append(tg,h,sb);\nconst fl=document.createElement('div');fl.className='flow';t.flow.forEach((f,i)=>{if(i)fl.append('\u2192');const sp=document.createElement('span');sp.textContent=f;fl.appendChild(sp);});s.appendChild(fl);\nt.p.forEach(([sm,rows],i)=>{const d=document.createElement('details');if(i===0&&ti===0)d.open=true;const su=document.createElement('summary');su.textContent=sm;d.appendChild(su);\nrows.forEach(([l,x])=>{const p=document.createElement('p');if(l){const b=document.createElement('b');b.textContent=l+': ';p.appendChild(b);}p.append(x);d.appendChild(p);});s.appendChild(d);});\n$('theory').appendChild(s);});\nconst QZ=[[\"A product team wants to turn 500 customer reviews into scores from 1 to 5. Which gallery prompt fits?\", [\"Text generation\", \"Sentiment rating\", \"Transliteration\", \"Open-domain question answering\"], 1, \"Sentiment rating prompts assign a numerical rating to the sentiment in a text.\"], [\"A university bot must answer only from its own handbook. Which prompt type is this?\", [\"Open-domain question answering\", \"Closed-domain question answering\", \"Keyword extraction\", \"Text generation\"], 1, \"Closed-domain prompts answer questions within a predefined domain.\"], [\"From a news story you must pull out who is related to whom (for example, X is Y's sister). Which prompt?\", [\"Relation extraction\", \"Summarisation\", \"Sentiment analysis\", \"Translation\"], 0, \"Relation extraction identifies relationships between entities in a text.\"], [\"A story must keep the hero's age and the lab time the same in every paragraph. Which technique helps most?\", [\"Zero-shot prompting\", \"A self-consistency prompt that lists these facts\", \"Transliteration\", \"A longer story\"], 1, \"Anchoring the prompt with key facts keeps the output consistent with them.\"], [\"A prompt lists twelve strict rules, and the replies come out repetitive and unnatural. What is the likely cause?\", [\"Too few rules\", \"Overly restrictive prompting that limits flexibility\", \"The model is too fast\", \"Too many examples of tags\"], 1, \"The textbook warns that too much detail can limit flexibility and creativity.\"], [\"You need to turn a ten-page chapter into key points for revision. Which gallery prompt?\", [\"Text summarisation\", \"Sentiment rating\", \"Relation extraction\", \"Transliteration\"], 0, \"Summarisation condenses long text while keeping the key information.\"]];\nlet qd=0,qc=0;\nQZ.forEach(([q  pick one and continue yourself.\"], [\"Example\", \"\u201cGive 5 different opening lines for an essay on teamwork, each in a different tone, numbered.\u201d\"]]], [\"Developing narrative skills\", [[\"Explain\", \"Prompts can give a structured approach to storytelling, helping writers build compelling narratives for personal or professional purposes. Asking for a clear beginning, middle and end gives a story its shape.\"], [\"Example\", \"\u201cWrite a 5-sentence story about a robot in a lab. Label the parts Beginning, Middle and End.\u201d\"]]], [\"Conclusion\", [[\"\", \"Prompts help writers start, continue and shape their writing. The more a prompt says about topic, reader, tone, length and structure, the more useful the draft becomes.\"]]]]}, {\"h\": \"Theory 2 \u00b7 From a topic to a complete writing prompt\", \"s\": \"The ten building blocks of a complex prompt, from the tutorial's final chapter.\", \"flow\": [\"Context\", \"Tone\", \"Rules\", \"Examples\", \"Data\", \"Task\", \"Think\", \"Format\"], \"p\": [[\"Introduction\", [[\"\", \"A complex prompt combines several elements. Not every prompt needs all of them. The advice is to use many elements to get the prompt working first, then slim it down. Order matters for some elements and not for others.\"]]], [\"Elements 1 to 4: setting the scene\", [[\"1. Message start\", \"In the API a prompt must begin with \u201cUser:\u201d. In a normal chat you simply type your message.\"], [\"2. Task context\", \"Say who Claude is and what the overall goal is. Put it early.\"], [\"3. Tone context\", \"Say what tone to use, for example a friendly customer-service tone, if tone matters.\"], [\"4. Detailed task and rules\", \"State exactly what to do, the rules to follow, and what to say if unsure. Showing these to a friend is a good test that they are clear.\"]]], [\"Elements 5 to 7: examples, data and the immediate task\", [[\"5. Examples\", \"One or more ideal replies inside <example> tags. Examples are often the single most effective tool. Include edge cases.\"], [\"6. Input data\", \"Data inside its own tags, such as <history> and <question>. Long data goes before the instructions.\"], [\"7. Immediate task\", \"Remind Claude what to do right now. Put it near the end, close to the user's question.\"]]], [\"Elements 8 to 10: thinking, format and prefill\", [[\"8. Step-by-step thinking\", \"For multi-step tasks, tell Claude to think first, near the end of the prompt.\"], [\"9. Output format\", \"Say exactly how the reply must look, for example \u201cPut your response in <response> tags\u201d.\"], [\"10. Prefill\", \"Starting Claude's reply for it. In an ordinary chat, give an instruction about how the reply must begin instead.\"]]], [\"Worked example: the career coach\", [[\"Explain\", \"The tutorial builds an AI career coach called Joe for AdAstra Careers: a role, a friendly tone, rules (stay in character, say a set phrase if unsure or if the question is off-topic), an example reply, data tags for the history and the question, a reminder of the task, a think-first line and <response> tags.\"], [\"Lab\", \"Lab 3 below.\"]]], [\"Conclusion\", [[\"\", \"A strong writing prompt gives context, tone, rules, an example, the data, the task and the format. Build it up step by step, test it, and then remove anything that does not help.\"]]]]}];\nTH.forEach((t,ti)=>{const s=document.createElement('section');const tg=document.createElement('div');tg.className='tag';tg.textContent=t.h.split(' \u00b7 ')[0];\nconst h=document.createElement('h2');h.textContent=t.h.split(' \u00b7 ')[1];const sb=document.createElement('p');sb.className='sub';sb.textContent=t.s;s.append(tg,h,sb);\nconst fl=document.createElement('div');fl.className='flow';t.flow.forEach((f,i)=>{if(i)fl.append('\u2192');const sp=document.createElement('span');sp.textContent=f;fl.appendChild(sp);});s.appendChild(fl);\nt.p.forEach(([sm,rows],i)=>{const d=document.createElement('details');if(i===0&&ti===0)d.open=true;const su=document.cr
