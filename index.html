ink)}\n<\/style>\n<\/head>\n<body>\n<main>\n<div class=\"nav\"><a href=\"hub.html\">Module 2 hub<\/a><a href=\"unit-2-1.html\">2.1 Intro<\/a><a href=\"unit-2-2.html\">2.2 Communication<\/a><a href=\"unit-2-3-part1.html\">2.3 Techniques (1/2)<\/a><a href=\"unit-2-3-part2.html\">2.3 (2/2)<\/a><span class=\"on\">2.4 Creative<\/span><a href=\"unit-2-5.html\">2.5 Writing<\/a><\/div>\n<h1>Unit 2.4: Prompts for Creative Thinking<\/h1>\n<p class=\"sub\">Module 2 \u00b7 1 lecture hour \u00b7 Topics: prompts that spark creative thinking, brainstorming prompts for problem solving, and prompts for artistic expression. Learn the theory, then turn plain topics into engineered prompts.<\/p>\n<details class=\"tutg\" style=\"margin:10px 0 16px;border:2px solid var(--ink);background:var(--sf);padding:8px 12px\"><summary style=\"cursor:pointer;font-weight:700\">What do the \u201cTutorial Ch.\u201d notes mean?<\/summary><p>They point to Anthropic's free <i>Prompt Engineering Interactive Tutorial<\/i> (<a href=\"https://github.com/anthropics/prompt-eng-interactive-tutorial\" target=\"_blank\" rel=\"noopener\">github.com/anthropics/prompt-eng-interactive-tutorial<\/a>). You do not need it: each note names the idea, and this key explains it. \u201cEx 2.1\u201d means Chapter 2, exercise 1.<\/p><div style=\"overflow-x:auto\"><table class=\"tb\"><tr><th>Ch.<\/th><th>Idea<\/th><\/tr>\n<tr><td>1<\/td><td>Basic structure: a prompt is a message, optionally with a system prompt<\/td><\/tr><tr><td>2<\/td><td>Be clear and direct: say exactly what you want<\/td><\/tr><tr><td>3<\/td><td>Assign a role to change tone and skill<\/td><\/tr><tr><td>4<\/td><td>Separate data from instructions with tags<\/td><\/tr><tr><td>5<\/td><td>Format the output, even start the reply for the model<\/td><\/tr><tr><td>6<\/td><td>Let the model think step by step<\/td><\/tr><tr><td>7<\/td><td>Use examples (few-shot)<\/td><\/tr><tr><td>8<\/td><td>Avoid hallucinations: allow \u201cI don't know\u201d<\/td><\/tr><tr><td>9<\/td><td>Combine everything into a complex prompt<\/td><\/tr><\/table><\/div><\/details><div id=\"theory\"><\/div>\n<section><div class=\"tag\">Apply it \u00b7 Scenarios<\/div><h2>Scenario questions: choose the best answer<\/h2><p class=\"sub\">Pick the best answer for each situation, then read why. More than one option may sound sensible, so read every option.<\/p><div id=\"quiz\"><\/div><div class=\"score\" id=\"qs\"><\/div><\/section>\n<section><div class=\"tag\">Apply it \u00b7 Live on Claude<\/div><h2>Labs<\/h2>\n<p class=\"sub\">Write a prompt, run it, and the page checks the reply. <span class=\"pill\">Model: Claude Haiku (same for the class)<\/span> If live Claude is not available, the page asks you to run the prompt in your own Claude chat and paste the reply back. Replies vary a little, so run again if you narrowly miss.<\/p>\n<div id=\"labbox\"><\/div><div class=\"score\" id=\"ls\"><\/div><\/section>\n<section id=\"case\"><\/section>\n<\/main>\n<script>\nconst MODEL=\"claude-haiku-5-5\";\nconst $=id=>document.getElementById(id);\nconst liveErr=e=>{try{console.error(e)}catch(_){}const c=e&&e.code;const m={not_granted:'Claude was not allowed. Reload this page and click Allow when the permission box appears.',rate_limited:'Too many runs. Wait a moment, then try again.',not_declared:'This page is not set up for live Claude. Please report this problem.',capability_disabled:'Live Claude is switched off for this page. Please report this problem.',capability_removed:'Live Claude was removed from this page. Please report this problem.',sampling_disabled:'Live Claude is turned off for your account or organisation.',session_expired:'Your session expired. Reload the page.',upstream_error:'Claude is busy. Try again in a moment.',empty_completion:'Claude sent an empty reply. Run it again.',refused:'Claude declined this prompt. Change the wording.',queue_overflow:'Too many requests are waiting. Try again shortly.',cancelled:'Stopped.',invalid_request:'The request was not accepted. Please report this problem.'}[c];return (m||\"Couldn't reach Claude. Try again.\")+(c?' (code: '+c+')':(e&&e.message?' ('+String(e.message).slice(0,80)+')':''));};\n/* live Claude when available, otherwise paste mode (works in any phone browser) */\nconst HARD=['not_granted','sampling_disabled','capability_disabled','capability_removed','not_declared'];\nlet liveFn=null,liveDone=false,pasteOnly=false;\n(async()=>{try{if(typeof claude!=='undefined'&&claude&&claude.use)liveFn=await claude.use(\"sample\");}catch(e){liveFn=null;}liveDone=true;})();\nconst wait=ms=>new Promise(r=>setTimeout(r,ms));\nconst pasteQ=[];let pasteBusy=false;\nfunction pasteAsk(p,o){return new Promise((res,rej)=>{pasteQ.push({p,o,res,rej});pump();});}\nfunction pump(){if(pasteBusy||!pasteQ.length)return;pasteBusy=true;const {p,o,res,rej}=pasteQ.shift();\nconst ov=document.createElement('div');ov.setAttribute('role','dialog');ov.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:12px';\nconst bx=document.createElement('div');bx.style.cssText='background:var(--sf,var(--surface,#fff));color:var(--ink,#16212b);border:2px solid var(--ink,#16212b);box-shadow:5px 5px 0 var(--ink,#16212b);max-width:660px;width:100%;padding:16px;margin:8px 0';\nconst mkb=(t,bg)=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='font:inherit;cursor:pointer;border:2px solid var(--ink,#16212b);padding:7px 14px;font-weight:700;margin:8px 8px 0 0;background:'+bg+';color:#16212b';return b;};\nconst ta=()=>{const t=document.createElement('textarea');t.style.cssText='width:100%;min-height:120px;font:14px ui-monospace,Menlo,monospace;padding:8px;border:2px solid var(--ink,#16212b);background:var(--bg,#f2f5ef);color:var(--ink,#16212b)';return t;};\nconst h=document.createElement('div');h.style.cssText='font-weight:800;font-size:1.15rem;margin-bottom:6px';h.textContent='Run this in your own Claude chat';\nconst ex=document.createElement('p');ex.style.margin='0 0 8px';ex.textContent=\"Live Claude isn't available in this view. 1) Copy the prompt. 2) Open Claude (use Haiku if you can choose), paste it and send. 3) Paste Claude's reply below.\";\nconst pt=ta();pt.readOnly=true;pt.value=p;const cp=mkb('Copy prompt','#ffd84d');\ncp.onclick=async()=>{try{await navigator.clipboard.writeText(p);cp.textContent='Copied \u2713';}catch(e){pt.focus();pt.select();cp.textContent='Press copy on your keyboard';}};\nconst l2=document.createElement('div');l2.style.cssText='font-weight:700;margin-top:10px';l2.textContent=\"Claude's reply\";\nconst rt=ta();const ok=mkb('Use this reply','#ffd84d');const no=mkb('Cancel','transparent');const em=document.createElement('div');em.style.cssText='font-weight:700;min-height:1.2em';\nconst done=()=>{ov.remove();pasteBusy=false;};\nok.onclick=()=>{const t=rt.value.trim();if(!t){em.textContent='Paste the reply first.';return;}done();try{o&&o.onText&&o.onText({text:t,delta:t});}catch(e){}res({text:t,truncated:false});pump();};\nno.onclick=()=>{done();const q=pasteQ.splice(0);rej({code:'cancelled',message:'cancelled'});q.forEach(x=>x.rej({code:'cancelled',message:'cancelled'}));};\nbx.append(h,ex,pt,cp,l2,rt,em,ok,no);ov.appendChild(bx);document.body.appendChild(ov);setTimeout(()=>{try{rt.focus();}catch(e){}},50);}\nasync function getSample(){return async(p,o)=>{\n if(!liveDone)await Promise.race([(async()=>{while(!liveDone)await wait(100);})(),wait(8000)]);\n if(liveFn&&!pasteOnly){try{return await liveFn(p,o);}catch(e){if(HARD.includes(e&&e.code))pasteOnly=true;else throw e;}}\n return pasteAsk(p,o);};}\nconst TH=[{\"h\": \"Theory 1 \u00b7 Prompts as catalysts for creative thinking\", \"s\": \"Creative thinking is an essential skill, and prompts can start it. Open each part.\", \"flow\": [\"Open question\", \"Fresh angle\", \"Idea\", \"Test and refine\"], \"p\": [[\"Introduction\", [[\"\", \"Creative thinking is valued in every field today. Prompts act as catalysts: they ignite imagination, spark innovative ideas and help people get past mental blocks. They can be used with people and with AI models, and in both cases the wording of the prompt decides how far the thinking goes.\"]]], [\"Kinds of creative prompt\", [[\"Explain\", \"Open-ended questions challenge conventional thinking. Playful prompts encourage unconventional associations. Prompts that ask for diverse perspectives, or that connect seemingly unrelated concepts, push ideas in new directions.\"], [\"Example\", \"\u201cHow could bees help us design a better traffic system?\u201d links two unrelated ideas.\"]]], [\"The creative mindset\", [[\"Explain\", \"The chapter's theme is curiosity: embrace the unknown, embrace ambiguity, and keep exploring. Prompts help people break free from mental constraints and approach problems with fresh perspectives, useful for artists, entrepreneurs and professionals alike.\"], [\"Why it matters\", \"Engineers solve open problems, and the first idea is rarely the best one.\"]]], [\"Conclusion\", [[\"\", \"Creative prompts widen the space of ideas. Used with an AI model, they work best when they are specific enough to guide the model and open enough to leave room for surprise.\"]]]]}, {\"h\": \"Theory 2 \u00b7 Unlocking imagination and innovation\", \"s\": \"Prompts that build a culture of curiosity and experimentation.\", \"flow\": [\"Play\", \"Experiment\", \"Fail and learn\", \"Collaborate\", \"Lead\"], \"p\": [[\"Introduction\", [[\"\", \"This part of the textbook offers prompts that drive creativity and innovation inside organisations. It encourages brainstorming sessions, treating failure as a chance to learn, and a culture of curiosity and experimentation, so that people feel free to think outside the box and challenge conventional norms.\"]]], [\"The themes of the prompts\", [[\"Explain\", \"The sample prompts ask about: how creativity leads to breakthrough innovations; the effect of a creative mindset on problem-solving; building a culture of innovation; the role of play and experimentation; a sense of wonder; whether education systems help or hinder imagination; embracing failure; using technology to amplify creative thinking; interdisciplinary collaboration; and the role of leadership.\"], [\"Note\", \"These are topics to think about, not finished AI prompts. To use them with an AI model, they need a role, an audience, limits and a format.\"]]], [\"What supports innovation\", [[\"Explain\", \"The approach stresses collaboration across disciplines, diversity and inclusion, continuous learning and adapting to new trends, clear goals, autonomy, and recognition of innovative contributions.\"]]], [\"Conclusion\", [[\"\", \"Imagination and innovation grow in an environment that rewards curiosity, accepts failure as learning and brings different disciplines together. A good prompt helps create that environment.\"]]]]}, {\"h\": \"Theory 3 \u00b7 Brainstorming prompts for problem solving\", \"s\": \"Prompt templates that you fill in for a specific situation.\", \"flow\": [\"Template\", \"Fill the blank\", \"Brainstorm\", \"Select\"], \"p\": [[\"Introduction\", [[\"\", \"The textbook gives a curated set of prompts to run effective brainstorming and problem-solving sessions. They encourage lateral thinking, challenging assumptions, collaboration and diverse perspectives, so that teams find actionable, innovative solutions to complex challenges in organisations, products or society.\"]]], [\"Templates with blanks\", [[\"Explain\", \"Many prompts are templates with a blank to fill in, such as \u201cHow can we optimise [specific process] for increased efficiency and effectiveness?\u201d or \u201cBrainstorm solutions to enhance customer satisfaction in [industry or sector].\u201d\"], [\"Class link\", \"This is the same idea as variables like {{PROCESS}} in Tutorial Ch. 4 (Separating data from instructions): the fixed prompt stays, and only the data changes. Lab 3 below.\"]]], [\"Typical brainstorming aims\", [[\"Explain\", \"Overcoming obstacles in project implementation, improving team communication, reducing costs, improving morale, expanding into new markets, and solving environmental sustainability challenges.\"]]], [\"Inspiring artistic expression\", [[\"Explain\", \"A related set of prompts invites artistic exploration for beginners and experienced artists alike, for example creating work about the beauty of diversity, a moment of personal triumph, the harmony between nature and technology, a childhood memory, or the emotion of courage. These prompts evoke emotion and invite personal interpretation.\"]]], [\"Conclusion\", [[\"\", \"Brainstorming prompts work best as templates: keep the structure, change the topic. Add limits (how many ideas, what format) so the answers are usable.\"]]]]}];\nTH.forEach((t,ti)=>{const s=document.createElement('section');const tg=document.createElement('div');tg.className='tag';tg.textContent=t.h.split(' \u00b7 ')[0];\nconst h=document.createElement('h2');h.textContent=t.h.split(' \u00b7 ')[1];const sb=document.createElement('p');sb.className='sub';sb.textContent=t.s;s.append(tg,h,sb);\nconst fl=document.createElement('div');fl.className='flow';t.flow.forEach((f,i)=>{if(i)fl.append('\u2192');const sp=document.createElement('span');sp.textContent=f;fl.appendChild(sp);});s.appendChild(fl);\nt.p.forEach(([sm,rows],i)=>{const d=document.createElement('details');if(i===0&&ti===0)d.open=true;const su=document.createElement('summary');su.textContent=sm;d.appendChild(su);\nrows.forEach(([l,x])=>{const p=document.createElement('p');if(l){const b=document.createElement('b');b.textContent=l+': ';p.appendChild(b);}p.append(x);d.appendChild(p);});s.appendChild(d);});\n$('theory').appendChild(s);});\nconst QZ=[[\"Your team is stuck on canteen waste. \u201cWrite about waste\u201d gave a bland essay and \u201cGive ideas\u201d gave generic ones. Which prompt is best?\", [\"\u201cGive as many ideas as possible, with no limits, so nothing is missed.\u201d\", \"\u201cBe as creative and wild as you can about waste.\u201d\", \"\u201cGive exactly 6 ideas to cut canteen waste: 3 unconventional and 3 practical, one line each.\u201d\", \"\u201cExplain the causes of waste in detail.\u201d\"], 2, \"Open does not mean unlimited. A fixed number, a mix of wild and practical ideas and a format make creative output usable.\"], [\"A designer wants fresh ideas for queues at the college office. Which prompt best connects unrelated concepts while staying usable?\", [\"\u201cHow might an ant colony's trail system inspire queue design? Give 3 ideas, one line each.\u201d\", \"\u201cSuggest queue ideas.\u201d\", \"\u201cBe crazy about queues.\u201d\", \"\u201cList the standard queue systems used by banks.\u201d\"], 0, \"Linking two unrelated fields pushes thinking in a new direction, and the limits keep the answer usable.\"], [\"A club's prototype failed in testing. Which follow-up prompt reflects the unit's view of failure?\", [\"\u201cWrite a report that shows the project went well.\u201d\", \"\u201cList 5 things this failure taught us and 3 changes to try next.\u201d\", \"\u201cSuggest a new project so we can forget this one.\u201d\", \"\u201cExplain why the team should not have tried.\u201d\"], 1, \"The unit treats failure as a chance to learn, so the next prompt extracts lessons and next steps.\"], [\"Thirty members use the template \u201cGive 6 ideas to solve {{PROBLEM}}\u201d. One member says the ideas are all from the same viewpoint. Which edit helps most?\", [\"Raise the number of ideas to 50\", \"Remove the blank so each member rewrites the prompt\", \"Delete the limits\", \"Add \u201cgive ideas from the view of a student, a cleaner and a vendor\u201d\"], 3, \"Asking for diverse perspectives breaks a single viewpoint. More of the same viewpoint or removing structure does not.\"], [\"The textbook lists topics such as \u201cthe role of play and experimentation\u201d. A student pastes one straight into an AI chat and gets a vague essay. Why?\", [\"The topic needs a role, audience, limits and a format to become a good prompt\", \"The topic is too short for any model\", \"AI models cannot discuss creativity\", \"The topic should have been translated first\"], 0, \"These are themes to think about, not finished prompts. They need the elements that make prompts specific.\"], [\"A brainstorm prompt returns 20 ideas that are all ordinary. Which change is best?\", [\"Ask for 40 ideas\", \"Ask for 5 ideas that each break one assumption in the problem, then 3 practical combinations of them\", \"Ask for the single best idea\", \"Ask for a formal report on the problem\"], 1, \"More of the same stays ordinary. Challenging assumptions widens the idea space, and the combinations bring it back to practical.\"]];\nlet qd=0,qc=0;\nQZ.forEach(([q,o,a,e])=>{const d=document.createElement('div');const h=document.createElement('div');h.className='q';h.textContent=q;\nconst w=document.createElement('div');w.className='opts';const f=document.createElement('div');f.className='fb';let dn=false;\no.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{if(dn)return;dn=true;qd++;\nif(i===a){qc++;b.classList.add('right');f.textContent='\u2713 '+e;}else{b.classList.add('wrong');w.children[a].classList.add('right');f.textContent='\u2717 '+e;}\n$('qs').textContent=`Answered ${qd} of ${QZ.length}. Correct: ${qc}.`+(qd===QZ.length?` Score: ${Math.round(qc/QZ.length*100)}%.`:'');};w.appendChild(b);});\nd.append(h,w,f);$('quiz').appendChild(d);});\nconst LABS=[\n{t:\"Lab 1: Engineer a textbook prompt\",task:\"Rewrite this textbook-style topic into a real prompt with a role (\u201cYou are\u2026\u201d), an audience, a number, and a format: \u201cThe impact of a creative mindset on problem-solving and innovation.\u201d\",hint:\"Start with \u201cYou are\u2026\u201d, say who it is for, add a number such as 3 or 100 words, and name a format such as bullet points.\",u:\"\",\n ok:(R,u)=>/you are|act as/i.test(u)&&/\\d/.test(u)&&/(bullet|numbered|list|paragraph|table)/i.test(u)&&/(student|audience|team|club|reader|beginner|first-year)/i.test(u)&&R[0].trim().split(/\\s+/).length>=30},\n{t:\"Lab 2: Brainstorm with limits\",task:\"Make Claude give exactly 5 ideas to reduce plastic waste in a college canteen, as a numbered list, one line each.\",hint:\"Say exactly 5, numbered, one line each, and no introduction.\",u:\"\",\n ok:(R)=>R[0].split(\"\\n\").filter(l=>/^\\s*\\d+[.)]/.test(l)).length===5},\n{t:\"Lab 3: A template with a blank (textbook \u00a74.3 + Tutorial Ch. 4 (Separating data from instructions))\",task:\"Turn the textbook template into a prompt that gives 3 ideas for each process. Keep {{PROCESS}}. It runs on two processes.\",hint:\"Keep {{PROCESS}} in your template and ask for 3 ideas. Two replies will be checked for the right topics.\",u:\"How can we optimise {{PROCESS}} for increased efficiency and effectiveness?\",inp:[{PROCESS:\"lab equipment booking\"},{PROCESS:\"hostel mess queues\"}],\n need:u=>u.includes(\"{{PROCESS}}\")?\"\":\"Keep {{PROCESS}} in the template.\",ok:(R)=>/booking|equipment/i.test(R[0])&&/mess|queue/i.test(R[1])&&R.every(t=>t.trim().split(/\\s+/).length>=30)},\n{t:\"Lab 4: Two haikus in tags (Tutorial Ex 5.2)\",task:\"Edit the template so Claude writes two haikus about {{ANIMAL}}, each inside its own <haiku> tags. Test input: cats.\",hint:\"First ask for two, then fix the formatting. The check wants over 5 lines, the word \u201ccat\u201d, and <haiku> tags.\",u:\"Please write a haiku about {{ANIMAL}}. Put it in <haiku> tags.\",inp:[{ANIMAL:\"cats\"}],\n need:u=>u.includes(\"{{ANIMAL}}\")?\"\":\"Keep {{ANIMAL}} in the template.\",ok:(R)=>(R[0].match(/<haiku>/g)||[]).length>=2&&/cat/i.test(R[0])&&R[0].trim().split(\"\\n\").length>5}];\nconst CASE={\"h\": \"Design an idea generator for an innovation club\", \"scenario\": \"An engineering innovation club wants a reusable prompt template that helps members brainstorm ideas for any campus problem. It must give a fixed number of ideas, mix unconventional and practical ones, and be easy to reuse. Write the template and explain which creative-thinking ideas you used.\", \"min\": 40, \"review\": \"You are a supportive tutor. A first-year engineering student was asked to design a reusable brainstorming prompt template for an innovation club (fixed number of ideas, a mix of unconventional and practical ideas, easy to reuse) and to justify it with ideas about creative prompts: open-ended and playful prompts, connecting unrelated concepts, templates with blanks, treating failure as learning, and giving limits. Do not give a mark. Reply with: what the template does well, what is missing (check for a blank variable such as {{PROBLEM}}, a number of ideas, an output format, a role or audience, and a mix of wild and practical ideas), whether the justification links to the unit ideas, and one tip. Under 170 words.\", \"model\": [[\"Template\", \"You are an innovation coach for first-year engineering students. Give exactly 6 ideas to solve this campus problem: {{PROBLEM}}. First list 3 unconventional ideas, then 3 practical ones. Number them, one line each, and add a 5-word reason after each idea. End with one question that challenges an assumption behind the problem.\"], [\"Justification\", \"The blank {{PROBLEM}} makes it reusable (template idea, as in the brainstorming prompts and Tutorial Ch. 4 (Separating data from instructions)). The fixed number and format give usable output. Splitting wild and practical ideas uses diverse perspectives and lateral thinking. The closing question challenges assumptions. A role and audience give the model a perspective. Asking for reasons keeps failed ideas educational.\"]]};\n\n/* labs engine */\nlet sample=null,ldone=new Set();const gradedN=LABS.filter(l=>l.ok).length;\nasync function ensure(){if(!sample)sample=await getSample();return sample;}\nasync function call(p,box){const r=await sample(p,{model:MODEL,modelTier:\"quick\",cache:false,onText:({text})=>{box.textContent=text;}});box.textContent=r.text;return r.text;}\nconst E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};\nconst score=()=>{$('ls').textContent=`Graded labs passed: ${ldone.size} of ${gradedN}`;};\nLABS.forEach((L,i)=>{const d=E('div','lab');d.append(E('h3','',L.t),E('p','sub',L.task));const msg=E('div','fb');msg.setAttribute('role','status');\n if(L.k==='trio'){const g=E('div','trio');const T=[],R=[];L.items.forEach(([n,v])=>{const c=E('div');const l=E('label','',n);const t=E('textarea');t.value=v;const r=E('div','resp');c.append(l,t,r);g.appendChild(c);T.push(t);R.push(r);});\n  const run=E('button','run','Run all');d.append(g,run,msg);\n  run.onclick=async()=>{run.disabled=true;msg.textContent='Claude is thinking\u2026';R.forEach(r=>{r.className='resp';r.textContent='';});\n   try{await ensure();const out=await Promise.all(T.map((t,k)=>call(t.value,R[k])));out.forEach((t,k)=>{R[k].className='resp '+(L.fmt(t)?'ok':'no');});msg.textContent=L.note||'';}\n   catch(e){msg.textContent=liveErr(e);}finally{run.disabled=false;}};}\n else{let sel,sy,ut;\n  if(L.sel){d.appendChild(E('label','','Choose'));sel=E('select');L.sel.forEach(x=>sel.appendChild(E('option','',x)));d.appendChild(sel);}\n  if(L.s!==undefined){d.appendChild(E('label','','System prompt (edit this)'));sy=E('textarea');d.appendChild(sy);}\n  d.appendChild(E('label','',L.lock?'User message (fixed)':(L.inp?'Prompt template (edit this)':'Your prompt (edit this)')));\n  if(L.lock){ut=E('div','lock',L.u);}else{ut=E('textarea');ut.value=L.u||'';}d.appendChild(ut);\n  if(L.tail){d.appendChild(E('label','','Added automatically after your prompt'));d.appendChild(E('div','lock',L.tail));}\n  const bw=E('div');const run=E('button','run','Run on Claude');const hb=E('button','hint','Hint');bw.append(run,hb);d.appendChild(bw);const out=E('div');d.append(msg,out);\n  hb.onclick=()=>{msg.textContent='Hint: '+L.hint;};\n  run.onclick=async()=>{const u=L.lock?L.u:ut.value.trim(),s=sy?sy.value.trim():'';if(!u||(sy&&!s)){msg.textContent='Fill in the box first.';return;}\n   const bad=L.need?L.need(u):'';if(bad){msg.textContent=bad;return;}\n   run.disabled=true;out.innerHTML='';msg.textContent='Claude is thinking\u2026';\n   try{await ensure();const inp=L.inp||[{}],R=[],B=[];\n    for(let k=0;k<inp.length;k++){const b=E('div','resp');out.appendChild(b);B.push(b);let p=u;for(const v in inp[k])p=p.split(\"{{\"+v+\"}}\").join(inp[k][v]);if(L.tail)p+=\"\\n\\n\"+L.tail;if(s)p=s+\"\\n\\n\"+p;R.push(await call(p,b));}\n    let ok=L.ok?L.ok(R,u,sel&&sel.value):null;if(ok===false){msg.textContent='Checking the replies against the task\u2026';ok=await JUDGE(L.task,u,R.map((x,i)=>'Reply '+(i+1)+': '+x).join('\\n'));}\n    if(ok===null){msg.textContent=L.note||'Compare the replies.';}else{B.forEach(b=>b.classList.add(ok?'ok':'no'));msg.textContent=ok?'\u2713 Passed.':'\u2717 Not yet. Read the replies and tighten your prompt.';if(ok){d.classList.add('pass');ldone.add(i);}score();}}\n   catch(e){msg.textContent=liveErr(e);}finally{run.disabled=false;}};}\n $('labbox').appendChild(d);});\nscore();\nif(typeof CASE!=='undefined'){const s=$('case');s.append(E('div','tag','Apply it \u00b7 Case study'),E('h2','',CASE.h));const sc=E('p','sub');sc.append(E('b','','Scenario: '),CASE.scenario);s.appendChild(sc);\n s.appendChild(E('label','','Your prompt and justification'));const ta=E('textarea');ta.style.minHeight='150px';s.appendChild(ta);\n const bt=E('button','run','Get feedback from Claude');const fo=E('div','resp');fo.setAttribute('role','status');s.append(bt,fo);\n const dt=E('details');dt.appendChild(E('summary','','Show a model answer'));CASE.model.forEach(([l,t])=>{const p=E('p');p.append(E('b','',l+': '),t);dt.appendChild(p);});s.appendChild(dt);\n bt.onclick=async()=>{const t=ta.value.trim();if(t.split(/\\s+/).length<(CASE.min||40)){fo.t "100\\\" style=\\\"fill:var(--sf);stroke:var(--ink);stroke-width:2\\\"/><text x=\\\"401\\\" y=\\\"44\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--ink);font:700 13px system-ui,sans-serif\\\">Add limits<\\/text><text x=\\\"401\\\" y=\\\"66\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">Number, format,<\\/text><text x=\\\"401\\\" y=\\\"81\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">audience<\\/text><line x1=\\\"470\\\" y1=\\\"70\\\" x2=\\\"494\\\" y2=\\\"70\\\" style=\\\"stroke:var(--ink);stroke-width:2\\\" marker-end=\\\"url(#ar)\\\"/><rect x=\\\"498\\\" y=\\\"20\\\" width=\\\"132\\\" height=\\\"100\\\" style=\\\"fill:var(--sf);stroke:var(--ink);stroke-width:2\\\"/><text x=\\\"564\\\" y=\\\"44\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--ink);font:700 13px system-ui,sans-serif\\\">Converge<\\/text><text x=\\\"564\\\" y=\\\"66\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">Pick, test, learn<\\/text><text x=\\\"564\\\" y=\\\"81\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">from failure<\\/text><text x=\\\"320\\\" y=\\\"152\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">Diagram: widen first, then narrow<\\/text><\\/svg>\", \"tables\": [[\"Kinds of creative prompt\", [\"Kind\", \"What it does\", \"Example\", \"Watch out for\"], [[\"Open-ended\", \"Challenges conventional thinking\", \"\u201cWhat would a college canteen look like with no waste?\u201d\", \"Too vague gives a bland essay\"], [\"Playful\", \"Triggers unusual associations\", \"\u201cPitch a canteen run by a pirate crew.\u201d\", \"May need a practical filter\"], [\"Connect unrelated concepts\", \"Pushes ideas in new directions\", \"\u201cHow could bees help design a traffic system?\u201d\", \"Force a usable output\"], [\"Diverse perspectives\", \"Breaks one viewpoint\", \"\u201cIdeas from a student, a cleaner and a vendor.\u201d\", \"Name the perspectives\"], [\"Template with a blank\", \"Makes the prompt reusable\", \"\u201cGive 6 ideas to solve {{PROBLEM}}.\u201d\", \"Keep the blank in the template\"]]], [\"Weak vs strong brainstorming prompt\", [\"\", \"Weak\", \"Strong\"], [[\"Prompt\", \"\u201cWrite about waste.\u201d\", \"\u201cGive exactly 6 ideas to cut canteen waste: 3 unconventional, 3 practical. One line each.\u201d\"], [\"Result\", \"Generic essay\", \"Usable, varied list\"], [\"Why\", \"No limits or format\", \"Number, mix and format are set\"]]]], \"mk\": {\"h\": \"10-mark practice: creative prompts\", \"q\": \"Explain how prompts can act as catalysts for creative thinking. Describe three kinds of creative prompt with an example each, and explain why limits and a reusable template improve brainstorming. (10 marks)\", \"scheme\": [[\"Prompts as catalysts: spark imagination, ideas, get past mental blocks\", 2], [\"Kind 1 with an example (open-ended or playful)\", 2], [\"Kind 2 with an example (connect unrelated concepts)\", 2], [\"Kind 3 with an example (diverse perspectives or template with a blank)\", 2], [\"Why limits (number, format, mix) help, and why a template with a blank is reusable\", 2]], \"model\": \"Prompts act as catalysts for creative thinking because they ignite imagination, spark new ideas and help people get past mental blocks, with people or AI models. Open-ended prompts challenge conventional thinking, e.g. \u201cWhat would a canteen with no waste look like?\u201d Connecting unrelated concepts pushes ideas in new directions, e.g. \u201cHow could bees help design a better traffic system?\u201d Asking for diverse perspectives, e.g. \u201cGive ideas from a student, a cleaner and a vendor,\u201d breaks a single viewpoint. Creative prompts still need limits: a fixed number of ideas, a mix of wild and practical ones and a set format make the output usable. A template with a blank, such as \u20 85rem}\n.score{margin-top:10px;font-weight:700}\nselect{font:inherit;padding:6px;border:2px solid var(--ink);background:var(--bg);color:var(--ink)}\n<\/style>\n<\/head>\n<body>\n<main>\n<div class=\"nav\"><a href=\"hub.html\">Module 2 hub<\/a><a href=\"unit-2-1.html\">2.1 Intro<\/a><a href=\"unit-2-2.html\">2.2 Communication<\/a><a href=\"unit-2-3-part1.html\">2.3 Techniques (1/2)<\/a><a href=\"unit-2-3-part2.html\">2.3 (2/2)<\/a><a href=\"unit-2-4.html\">2.4 Creative<\/a><span class=\"on\">2.5 Writing<\/span><\/div>\n<h1>Unit 2.5: Prompts for Effective Writing<\/h1>\n<p class=\"sub\">Module 2 \u00b7 1 lecture hour \u00b7 Topics: prompts for effective writing, overcoming writer's block, narrative skills, and building a complete writing prompt. Learn the theory, then apply it.<\/p>\n<details class=\"tutg\" style=\"margin:10px 0 16px;border:2px solid var(--ink);background:var(--sf);padding:8px 12px\"><summary style=\"cursor:pointer;font-weight:700\">What do the \u201cTutorial Ch.\u201d notes mean?<\/summary><p>They point to Anthropic's free <i>Prompt Engineering Interactive Tutorial<\/i> (<a href=\"https://github.com/anthropics/prompt-eng-interactive-tutorial\" target=\"_blank\" rel=\"noopener\">github.com/anthropics/prompt-eng-interactive-tutorial<\/a>). You do not need it: each note names the idea, and this key explains it. \u201cEx 2.1\u201d means Chapter 2, exercise 1.<\/p><div style=\"overflow-x:auto\"><table class=\"tb\"><tr><th>Ch.<\/th><th>Idea<\/th><\/tr>\n<tr><td>1<\/td><td>Basic structure: a prompt is a message, optionally with a system prompt<\/td><\/tr><tr><td>2<\/td><td>Be clear and direct: say exactly what you want<\/td><\/tr><tr><td>3<\/td><td>Assign a role to change tone and skill<\/td><\/tr><tr><td>4<\/td><td>Separate data from instructions with tags<\/td><\/tr><tr><td>5<\/td><td>Format the output, even start the reply for the model<\/td><\/tr><tr><td>6<\/td><td>Let the model think step by step<\/td><\/tr><tr><td>7<\/td><td>Use examples (few-shot)<\/td><\/tr><tr><td>8<\/td><td>Avoid hallucinations: allow \u201cI don't know\u201d<\/td><\/tr><tr><td>9<\/td><td>Combine everything into a complex prompt<\/td><\/tr><\/table><\/div><\/details><div id=\"theory\"><\/div>\n<section><div class=\"tag\">Apply it \u00b7 Scenarios<\/div><h2>Scenario questions: choose the best answer<\/h2><p class=\"sub\">Pick the best answer for each situation, then read why. More than one option may sound sensible, so read every option.<\/p><div id=\"quiz\"><\/div><div class=\"score\" id=\"qs\"><\/div><\/section>\n<section><div class=\"tag\">Apply it \u00b7 Live on Claude<\/div><h2>Labs<\/h2>\n<p class=\"sub\">Write a prompt, run it, and the page checks the reply. <span class=\"pill\">Model: Claude Haiku (same for the class)<\/span> If live Claude is not available, the page asks you to run the prompt in your own Claude chat and paste the reply back. Replies vary a little, so run again if you narrowly miss.<\/p>\n<div id=\"labbox\"><\/div><div class=\"score\" id=\"ls\"><\/div><\/section>\n<section id=\"case\"><\/section>\n<\/main>\n<script>\nconst MODEL=\"claude-haiku-5-5\";\nconst $=id=>document.getElementById(id);\nconst liveErr=e=>{try{console.error(e)}catch(_){}const c=e&&e.code;const m={not_granted:'Claude was not allowed. Reload this page and click Allow when the permission box appears.',rate_limited:'Too many runs. Wait a moment, then try again.',not_declared:'This page is not set up for live Claude. Please report this problem.',capability_disabled:'Live Claude is switched off for this page. Please report this problem.',capability_removed:'Live Claude was removed from this page. Please report this problem.',sampling_disabled:'Live Claude is turned off for your account or organisation.',session_expired:'Your session expired. Reload the page.',upstream_error:'Claude is busy. Try again in a moment.',empty_completion:'Claude sent an empty reply. Run it again.',refused:'Claude declined this prompt. Change the wording.',queue_overflow:'Too many requests are waiting. Try again shortly.',cancelled:'Stopped.',invalid_request:'The request was not accepted. Please report this problem.'}[c];return (m||\"Couldn't reach Claude. Try again.\")+(c?' (code: '+c+')':(e&&e.message?' ('+String(e.message).slice(0,80)+')':''));};\n/* live Claude when available, otherwise paste mode (works in any phone browser) */\nconst HARD=['not_granted','sampling_disabled','capability_disabled','capability_removed','not_declared'];\nlet liveFn=null,liveDone=false,pasteOnly=false;\n(async()=>{try{if(typeof claude!=='undefined'&&claude&&claude.use)liveFn=await claude.use(\"sample\");}catch(e){liveFn=null;}liveDone=true;})();\nconst wait=ms=>new Promise(r=>setTimeout(r,ms));\nconst pasteQ=[];let pasteBusy=false;\nfunction pasteAsk(p,o){return new Promise((res,rej)=>{pasteQ.push({p,o,res,rej});pump();});}\nfunction pump(){if(pasteBusy||!pasteQ.length)return;pasteBusy=true;const {p,o,res,rej}=pasteQ.shift();\nconst ov=document.createElement('div');ov.setAttribute('role','dialog');ov.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:12px';\nconst bx=document.createElement('div');bx.style.cssText='background:var(--sf,var(--surface,#fff));color:var(--ink,#16212b);border:2px solid var(--ink,#16212b);box-shadow:5px 5px 0 var(--ink,#16212b);max-width:660px;width:100%;padding:16px;margin:8px 0';\nconst mkb=(t,bg)=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='font:inherit;cursor:pointer;border:2px solid var(--ink,#16212b);padding:7px 14px;font-weight:700;margin:8px 8px 0 0;background:'+bg+';color:#16212b';return b;};\nconst ta=()=>{const t=document.createElement('textarea');t.style.cssText='width:100%;min-height:120px;font:14px ui-monospace,Menlo,monospace;padding:8px;border:2px solid var(--ink,#16212b);background:var(--bg,#f2f5ef);color:var(--ink,#16212b)';return t;};\nconst h=document.createElement('div');h.style.cssText='font-weight:800;font-size:1.15rem;margin-bottom:6px';h.textContent='Run this in your own Claude chat';\nconst ex=document.createElement('p');ex.style.margin='0 0 8px';ex.textContent=\"Live Claude isn't available in this view. 1) Copy the prompt. 2) Open Claude (use Haiku if you can choose), paste it and send. 3) Paste Claude's reply below.\";\nconst pt=ta();pt.readOnly=true;pt.value=p;const cp=mkb('Copy prompt','#ffd84d');\ncp.onclick=async()=>{try{await navigator.clipboard.writeText(p);cp.textContent='Copied \u2713';}catch(e){pt.focus();pt.select();cp.textContent='Press copy on your keyboard';}};\nconst l2=document.createElement('div');l2.style.cssText='font-weight:700;margin-top:10px';l2.textContent=\"Claude's reply\";\nconst rt=ta();const ok=mkb('Use this reply','#ffd84d');const no=mkb('Cancel','transparent');const em=document.createElement('div');em.style.cssText='font-weight:700;min-height:1.2em';\nconst done=()=>{ov.remove();pasteBusy=false;};\nok.onclick=()=>{const t=rt.value.trim();if(!t){em.textContent='Paste the reply first.';return;}done();try{o&&o.onText&&o.onText({text:t,delta:t});}catch(e){}res({text:t,truncated:false});pump();};\nno.onclick=()=>{done();const q=pasteQ.splice(0);rej({code:'cancelled',message:'cancelled'});q.forEach(x=>x.rej({code:'cancelled',message:'cancelled'}));};\nbx.append(h,ex,pt,cp,l2,rt,em,ok,no);ov.appendChild(bx);document.body.appendChild(ov);setTimeout(()=>{try{rt.focus();}catch(e){}},50);}\nasync function getSample(){return async(p,o)=>{\n if(!liveDone)await Promise.race([(async()=>{while(!liveDone)await wait(100);})(),wait(8000)]);\n if(liveFn&&!pasteOnly){try{return await liveFn(p,o);}catch(e){if(HARD.includes(e&&e.code))pasteOnly=true;else throw e;}}\n return pasteAsk(p,o);};}\nconst TH=[{\"h\": \"Theory 1 \u00b7 Prompts for effective writing\", \"s\": \"Writing prompts improve skill and expression. Open each part.\", \"flow\": [\"Spark\", \"Draft\", \"Unblock\", \"Shape the story\", \"Refine\"], \"p\": [[\"Introduction\", [[\"\", \"Effective writing is clear, purposeful and suited to its reader. Prompts help writers improve their skills and express themselves, whether they are students, professionals or anyone who wants to communicate better in writing. Prompts supply both inspiration and strategies.\"]]], [\"Igniting the writing process\", [[\"Explain\", \"Prompts can spark imagination and start the writing process, together with practical strategies that fuel creativity and help writers get past obstacles. A good starting prompt gives a topic, a purpose and a reader.\"], [\"Example\", \"\u201cWrite the opening paragraph of an essay on why I chose engineering. Honest tone. 80 words.\u201d\"]]], [\"Overcoming writer's block\", [[\"Explain\", \"A set of prompts is designed to reignite inspiration when creativity stalls: they stimulate imagination and unlock ideas that are buried. A practical way to use an AI model is to ask for several different starts, then pick one and continue yourself.\"], [\"Example\", \"\u201cGive 5 different opening lines for an essay on teamwork, each in a different tone, numbered.\u201d\"]]], [\"Developing narrative skills\", [[\"Explain\", \"Prompts can give a structured approach to storytelling, helping writers build compelling narratives for personal or professional purposes. Asking for a clear beginning, middle and end gives a story its shape.\"], [\"Example\", \"\u201cWrite a 5-sentence story about a robot in a lab. Label the parts Beginning, Middle and End.\u201d\"]]], [\"Conclusion\", [[\"\", \"Prompts help writers start, continue and shape their writing. The more a prompt says about topic, reader, tone, length and structure, the more useful the draft becomes.\"]]]]}, {\"h\": \"Theory 2 \u00b7 From a topic to a complete writing prompt\", \"s\": \"The ten building blocks of a complex prompt, from the tutorial's final chapter.\", \"flow\": [\"Context\", \"Tone\", \"Rules\", \"Examples\", \"Data\", \"Task\", \"Think\", \"Format\"], \"p\": [[\"Introduction\", [[\"\", \"A complex prompt combines several elements. Not every prompt needs all of them. The advice is to use many elements to get the prompt working first, then slim it down. Order matters for some elements and not for others.\"]]], [\"Elements 1 to 4: setting the scene\", [[\"1. Message start\", \"In the API a prompt must begin with \u201cUser:\u201d. In a normal chat you simply type your message.\"], [\"2. Task context\", \"Say who Claude is and what the overall goal is. Put it early.\"], [\"3. Tone context\", \"Say what tone to use, for example a friendly customer-service tone, if tone matters.\"], [\"4. Detailed task and rules\", \"State exactly what to do, the rules to follow, and what to say if unsure. Showing these to a friend is a good test that they are clear.\"]]], [\"Elements 5 to 7: examples, data and the immediate task\", [[\"5. Examples\", \"One or more ideal replies inside <example> tags. Examples are often the single most effective tool. Include edge cases.\"], [\"6. Input data\", \"Data inside its own tags, such as <history> and <question>. Long data goes before the instructions.\"], [\"7. Immediate task\", \"Remind Claude what to do right now. Put it near the end, close to the user's question.\"]]], [\"Elements 8 to 10: thinking, format and prefill\", [[\"8. Step-by-step thinking\", \"For multi-step tasks, tell Claude to think first, near the end of the prompt.\"], [\"9. Output format\", \"Say exactly how the reply must look, for example \u201cPut your response in <response> tags\u201d.\"], [\"10. Prefill\", \"Starting Claude's reply for it. In an ordinary chat, give an instruction about how the reply must begin instead.\"]]], [\"Worked example: the career coach\", [[\"Explain\", \"The tutorial builds an AI career coach called Joe for AdAstra Careers: a role, a friendly tone, rules (stay in character, say a set phrase if unsure or if the question is off-topic), an example reply, data tags for the history and the question, a reminder of the task, a think-first line and <response> tags.\"], [\"Lab\", \"Lab 3 below.\"]]], [\"Conclusion\", [[\"\", \"A strong writing prompt gives context, tone, rules, an example, the data, the task and the format. Build it up step by step, test it, and then remove anything that does not help.\"]]]]}];\nTH.forEach((t,ti)=>{const s=document.createElement('section');const tg=document.createElement('div');tg.className='tag';tg.textContent=t.h.split(' \u00b7 ')[0];\nconst h=document.createElement('h2');h.textContent=t.h.split(' \u00b7 ')[1];const sb=document.createElement('p');sb.className='sub';sb.textContent=t.s;s.append(tg,h,sb);\nconst fl=document.createElement('div');fl.className='flow';t.flow.forEach((f,i)=>{if(i)fl.append('\u2192');const sp=document.createElement('span');sp.textContent=f;fl.appendChild(sp);});s.appendChild(fl);\nt.p.forEach(([sm,rows],i)=>{const d=document.createElement('details');if(i===0&&ti===0)d.open=true;const su=document.createElement('summary');su.textContent=sm;d.appendChild(su);\nrows.forEach(([l,x])=>{const p=document.createElement('p');if(l){const b=document.createElement('b');b.textContent=l+': ';p.appendChild(b);}p.append(x);d.appendChild(p);});s.appendChild(d);});\n$('theory').appendChild(s);});\nconst QZ=[[\"You must write an essay on teamwork but cannot start. Which prompt uses the unit's approach to writer's block?\", [\"\u201cWrite my whole essay on teamwork.\u201d\", \"\u201cGive 5 different opening lines for an essay on teamwork, each in a different tone, numbered. I will pick one and continue.\u201d\", \"\u201cWrite 2000 words about anything.\u201d\", \"\u201cGive me a title.\u201d\"], 1, \"The prompt supplies starting points while the writer keeps ownership and continues, which reignites inspiration.\"], [\"A career-coach bot receives a long CV pasted by the user, then a question. Where should each part go in the prompt?\", [\"The CV in tags near the start, the immediate task near the end\", \"The question first, then the CV\", \"Everything in one paragraph without tags\", \"The CV after the question, with no tags\"], 0, \"Long input data goes before the instructions, and the immediate task goes close to the end. Tags keep data separate from instructions.\"], [\"A story prompt produces a rambling reply with no shape. Which addition best gives it structure?\", [\"Ask for a longer story\", \"Ask for a more formal tone\", \"Ask for a 5-sentence story labelled Beginning, Middle and End\", \"Add the name of a famous author\"], 2, \"Asking for a clear beginning, middle and end gives the story its shape. Length and tone do not.\"], [\"A writing prompt works, but replies change format from run to run. Which elements fix this most directly?\", [\"More tone context\", \"A longer task description\", \"A role, \u201cnovelist\u201d\", \"One or two ideal replies in <example> tags, including an edge case, plus an explicit output format\"], 3, \"Examples are often the most effective tool, and a stated output format fixes structure.\"], [\"You want a friendly career-coach bot that politely refuses off-topic questions. Which pair of elements covers this?\", [\"Output format and prefill\", \"Tone context and rules (including what to say if unsure or off-topic)\", \"Examples only\", \"Immediate task and step-by-step thinking\"], 1, \"Tone context sets the friendly voice. The rules set boundaries, including the exact fallback reply.\"], [\"A student's prompt uses all ten elements and is long and slow to maintain. What does the tutorial advise?\", [\"Never remove any element\", \"Delete all examples first\", \"Get it working with many elements, then slim it down and keep what matters\", \"Add more elements until it stops failing\"], 2, \"Not every prompt needs every element. Start rich so it works, then trim.\"]];\nlet qd=0,qc=0;\nQZ.forEach(([q,o,a,e])=>{const d=document.createElement('div');const h=document.createElement('div');h.className='q';h.textContent=q;\nconst w=document.createElement('div');w.className='opts';const f=document.createElement('div');f.className='fb';let dn=false;\no.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{if(dn)return;dn=true;qd++;\nif(i===a){qc++;b.classList.add('right');f.textContent='\u2713 '+e;}else{b.classList.add('wrong');w.children[a].classList.add('right');f.textContent='\u2717 '+e;}\n$('qs').textContent=`Answered ${qd} of ${QZ.length}. Correct: ${qc}.`+(qd===QZ.length?` Score: ${Math.round(qc/QZ.length*100)}%.`:'');};w.appendChild(b);});\nd.append(h,w,f);$('quiz').appendChild(d);});\nconst LABS=[\n{t:\"Lab 1: Break the writer's block\",task:\"Make Claude give 5 different opening lines for an essay titled \u201cWhy I chose engineering\u201d, each in a different tone, as a numbered list with no introduction.\",hint:\"Say 5, different tones, numbered, and no introduction.\",u:\"\",\n ok:(R)=>R[0].split(\"\\n\").filter(l=>/^\\s*\\d+[.)]/.test(l)).length===5},\n{t:\"Lab 2: Give the story a shape\",task:\"Make Claude write a five-sentence story about a robot in a lab, with the parts labelled Beginning, Middle and End.\",hint:\"Ask for five sentences and the three labels exactly as written: Beginning, Middle, End.\",u:\"\",\n ok:(R)=>/Beginning/i.test(R[0])&&/Middle/i.test(R[0])&&/End/i.test(R[0])&&/robot/i.test(R[0])},\n{t:\"Lab 3: Build the career coach (Tutorial Ch. 9 (Building complex prompts))\",task:\"Add a role (Joe, a career coach at AdAstra Careers), a friendly tone, rules, and output tags. Replies must be inside <response> tags. For off-topic questions Claude must say: \u201cSorry, I am Joe and I give career advice. Do you have a career question today I can help you with?\u201d\",hint:\"Write the role, the tone, the off-topic rule with the exact sentence, and \u201cPut your response in <response> tags\u201d. Keep {{QUESTION}} in <question> tags at the end.\",u:\"<question>{{QUESTION}}<\/question>\",inp:[{QUESTION:\"What skills should a first-year electronics student build?\"},{QUESTION:\"What is the capital of France?\"}],\n need:u=>u.includes(\"{{QUESTION}}\")?\"\":\"Keep {{QUESTION}} in the template.\",ok:(R)=>/<response>/i.test(R[0])&&/<response>/i.test(R[1])&&/I give career advice/i.test(R[1])&&!/Paris/i.test(R[1])},\n{t:\"Lab 4: Edit for clarity (gallery: text editing)\",task:\"Make Claude fix only the spelling in the sentence below and reply with the corrected sentence only.\",hint:\"Say fix spelling only, keep the meaning, and reply with only the corrected sentence.\",u:\"\",tail:\"Text: I will recieve the report tomorow and definately send feedback.\",\n ok:(R)=>/receive/i.test(R[0])&&/tomorrow/i.test(R[0])&&/definitely/i.test(R[0])&&!/recieve|tomorow|definately/i.test(R[0])&&R[0].trim().split(/\\s+/).length<=20}];\nconst CASE={\"h\": \"Design a prompt for a student newsletter assistant\", \"scenario\": \"A student club newsletter needs an AI assistant that turns a few bullet points about an event into a short, friendly announcement for first-year students. It must keep the facts exactly, stay under 80 words, and put the announcement in tags so a script can pick it out. Write the prompt and explain which of the ten elements you used.\", \"min\": 40, \"review\": \"You are a supportive tutor. A first-year engineering student was asked to write a prompt for a student newsletter assistant that turns event bullet points into a short, friendly announcement for first-year students, keeps the facts exactly, stays under 80 words, and puts the announcement in tags. They must also explain which of the ten elements of a complex prompt they used (task context, tone, rules, examples, input data, immediate task, step-by-step thinking, output format, prefill). Do not give a mark. Reply with: what the prompt does well, what is missing (check for role, tone, a rule to keep facts exact, a length limit, data in tags such as {{EVENT}}, an example, output tags), whether the explanation names the elements correctly, and one tip. Under 170 words.\", \"model\": [[\"Prompt\", \"You are a friendly newsletter writer for a first-year engineering club. Turn the event details into a short announcement for first-year students. Rules: keep every date, time and place exactly as given; do not add facts; stay under 80 words; use a warm, upbeat tone. Example: Details: Robotics demo, Fri 3 pm, Lab 2 \u2192 <announcement>Come see the Robotics demo on Friday at 3 pm in Lab 2. Everyone is welcome!<\/announcement> <details>{{EVENT}}<\/details> Write the announcement now. Put it in <announcement> tags.\"], [\"Elements used\", \"Task context (role and goal), tone, detailed rules (keep facts, no new facts, under 80 words), an example, input data in tags, the immediate task, and output formatting. Step-by-step thinking and prefill were left out because the task is short.\"]]};\n\n/* labs engine */\nlet sample=null,ldone=new Set();const gradedN=LABS.filter(l=>l.ok).length;\nasync function ensure(){if(!sample)sample=await getSample();return sample;}\nasync function call(p,box){const r=await sample(p,{model:MODEL,modelTier:\"quick\",cache:false,onText:({text})=>{box.textContent=text;}});box.textContent=r.text;return r.text;}\nconst E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};\nconst score=()=>{$('ls').textContent=`Graded labs passed: ${ldone.size} of ${gradedN}`;};\nLABS.forEach((L,i)=>{const d=E('div','lab');d.append(E('h3','',L.t),E('p','sub',L.task));const msg=E('div','fb');msg.setAttribute('role','status');\n if(L.k==='trio'){const g=E('div','trio');const T=[],R=[];L.items.forEach(([n,v])=>{const c=E('div');const l=E('label','',n);const t=E('textarea');t.value=v;const r=E('div','resp');c.append(l,t,r);g.appendChild(c);T.push(t);R.push(r);});\n  const run=E('button','run','Run all');d.append(g,run,msg);\n  run.onclick=async()=>{run.disabled=true;msg.textContent='Claude is thinking\u2026';R.forEach(r=>{r.className='resp';r.textContent='';});\n   try{await ensure();const out=await Promise.all(T.map((t,k)=>call(t.value,R[k])));out.forEach((t,k)=>{R[k].className='resp '+(L.fmt(t)?'ok':'no');});msg.textContent=L.note||'';}\n   catch(e){msg.textContent=liveErr(e);}finally{run.disabled=false;}};}\n else{let sel,sy,ut;\n  if(L.sel){d.appendChild(E('label','','Choose'));sel=E('select');L.sel.forEach(x=>sel.appendChild(E('option','',x)));d.appendChild(sel);}\n  if(L.s!==undefined){d.appendChild(E('label','','System prompt (edit this)'));sy=E('textarea');d.appendChild(sy);}\n  d.appendChild(E('label','',L.lock?'User message (fixed)':(L.inp?'Prompt template (edit this)':'Your prompt (edit this)')));\n  if(L.lock){ut=E('div','lock',L.u);}else{ut=E('textarea');ut.value=L.u||'';}d.appendChild(ut);\n  if(L.tail){d.appendChild(E('label','','Added automatically after your prompt'));d.appendChild(E('div','lock',L.tail));}\n  const bw=E('div');const run=E('button','run','Run on Claude');const hb=E('button','hint','Hint');bw.append(run,hb);d.appendChild(bw);const out=E('div');d.append(msg,out);\n  hb.onclick=()=>{msg.textContent='Hint: '+L.hint;};\n  run.onclick=async()=>{const u=L.lock?L.u:ut.value.trim(),s=sy?sy.value.trim():'';if(!u||(sy&&!s)){msg.textContent='Fill in the box first.';return;}\n   const bad=L.need?L.need(u):'';if(bad){msg.textContent=bad;return;}\n   run.disabled=true;out.innerHTML='';msg.textContent='Claude is thinking\u2026';\n   try{await ensure();const inp=L.inp||[{}],R=[],B=[];\n    for(let k=0;k<inp.length;k++){const b=E('div','resp');out.appendChild(b);B.push(b);let p=u;for(const v in inp[k])p=p.split(\"{{\"+v+\"}}\").join(inp[k][v]);if(L.tail)p+=\"\\n\\n\"+L.tail;if(s)p=s+\"\\n\\n\"+p;R.push(await call(p,b));}\n    let ok=L.ok?L.ok(R,u,sel&&sel.value):null;if(ok===false){msg.textContent='Checking the replies against the task\u2026';ok=await JUDGE(L.task,u,R.map((x,i)=>'Reply '+(i+1)+': '+x).join('\\n'));}\n    if(ok===null){msg.textContent=L.note||'Compare the replies.';}else{B.forEach(b=>b.classList.add(ok?'ok' \\\" style=\\\"fill:var(--sf);stroke:var(--ink);stroke-width:2\\\"/><text x=\\\"32\\\" y=\\\"96\\\" style=\\\"fill:var(--ink);font:700 13px system-ui,sans-serif\\\">3. Task and rules<\\/text><text x=\\\"250\\\" y=\\\"96\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">what to do, rules, what to say if unsure<\\/text><rect x=\\\"20\\\" y=\\\"110\\\" width=\\\"600\\\" height=\\\"30\\\" style=\\\"fill:var(--sf);stroke:var(--ink);stroke-width:2\\\"/><text x=\\\"32\\\" y=\\\"130\\\" style=\\\"fill:var(--ink);font:700 13px system-ui,sans-serif\\\">4. Examples<\\/text><text x=\\\"250\\\" y=\\\"130\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">ideal replies in <example> tags<\\/text><rect x=\\\"20\\\" y=\\\"144\\\" width=\\\"600\\\" height=\\\"30\\\" style=\\\"fill:var(--sf);stroke:var(--ink);stroke-width:2\\\"/><text x=\\\"32\\\" y=\\\"164\\\" style=\\\"fill:var(--ink);font:700 13px system-ui,sans-serif\\\">5. Input data<\\/text><text x=\\\"250\\\" y=\\\"164\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">long data in tags, before the instructions<\\/text><rect x=\\\"20\\\" y=\\\"178\\\" width=\\\"600\\\" height=\\\"30\\\" style=\\\"fill:var(--sf);stroke:var(--ink);stroke-width:2\\\"/><text x=\\\"32\\\" y=\\\"198\\\" style=\\\"fill:var(--ink);font:700 13px system-ui,sans-serif\\\">6. Immediate task<\\/text><text x=\\\"250\\\" y=\\\"198\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">a reminder right now, near the end<\\/text><rect x=\\\"20\\\" y=\\\"212\\\" width=\\\"600\\\" height=\\\"30\\\" style=\\\"fill:var(--sf);stroke:var(--ink);stroke-width:2\\\"/><text x=\\\"32\\\" y=\\\"232\\\" style=\\\"fill:var(--ink);font:700 13px system-ui,sans-serif\\\">7. Think step by step<\\/text><text x=\\\"250\\\" y=\\\"232\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">for multi-step tasks<\\/text><rect x=\\\"20\\\" y=\\\"246\\\" width=\\\"600\\\" height=\\\"30\\\" style=\\\"fill:var(--sf);stroke:var(--ink);stroke-width:2\\\"/><text x=\\\"32\\\" y=\\\"266\\\" style=\\\"fill:var(--ink);font:700 13px system-ui,sans-serif\\\">8. Output format<\\/text><text x=\\\"250\\\" y=\\\"266\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">tags or structure for the reply<\\/text><\\/svg>\", \"tables\": [[\"Weak vs strong writing prompt\", [\"\", \"Weak\", \"Strong\"], [[\"Prompt\", \"\u201cWrite my essay on teamwork.\u201d\", \"\u201cWrite the opening paragraph of an essay on teamwork for a first-year class. Honest tone, 80 words.\u201d\"], [\"Topic, reader, purpose\", \"Missing\", \"Stated\"], [\"Tone, length\", \"Missing\", \"Honest, 80 words\"], [\"Result\", \"Generic, hard to reuse\", \"Focused draft you can continue\"]]], [\"Ways to beat writer's block with a prompt\", [\"Strategy\", \"Example prompt\", \"You then\"], [[\"Several starts\", \"\u201cGive 5 opening lines in different tones, numbered.\u201d\", \"Pick one and continue\"], [\"Structure\", \"\u201cLabel Beginning, Middle and End.\u201d\", \"Fill and refine each part\"], [\"Constraint\", \"\u201cDescribe the lab in exactly 3 sentences.\u201d\", \"Expand the best sentence\"]]]], \"mk\": {\"h\": \"10-mark practice: effective writing prompts\", \"q\": \"Explain how prompts help with effective writing. Describe how a prompt can overcome writer's block and develop narrative skills, and name five elements of a complex writing prompt with their order. (10 marks)\", \"scheme\": [[\"Prompts help writers start, continue and shape writing (inspiration and strategies)\", 2], [\"Overcoming writer's block: several different starts, then continue yourself, with an example\", 2], [\"Narrative skills: beginning, middle, end, with an example\", 2], [\"Five elements of a complex prompt named correctly\", 2], [\"Order: long data before instructions, immediate task near the end; get it working, then slim down\", 2]], \"model\": \"Prompts help writers start, continue and shape their writing by supplying inspiration and strategies. To overcome writer's block, ask for several different starts, e.g. \u201cGive 5 opening lines for an essay on teamwork, each in a different tone\u201d, then pick one and continue yourself. To develop narrative skills, ask for structure, e.g. \u201cWrite a 5-sentence story about a robot in a lab, labelled Beginning, Middle and End.\u201d A complex writing prompt can combine task context, tone context, detailed task and rules, examples in <example> tags, input data in tags, an immediate task and an output format. Order matters for some: long data goes before the instructions, and the immediate task and any step-by-step thinking instruction go near the end. Get the prompt working with many elements first, then slim it down.\"}};\nconst st=document.createElement('style');\nst.textContent='.tb{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--sf)}.tb th,.tb td{border:2px solid var(--ink);padding:6px 9px;text-align:left;vertical-align:top;color:var(--ink)}.tb th{background:var(--hi);color:#16212b}.tb td:first-child{font-weight:700}.vis{border:2px solid var(--ink);background:var(--sf);padding:12px;margin:12px 0}.vis img{max-width:100%;height:auto;display:block;margin:6px 0;border:2px solid var(--ink)}.mk textarea{width:100%;min-height:150px;font:inherit;padding:8px;border:2px solid var(--ink);background:var(--bg);color:var(--ink)}.mk label.sc{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-weight:400}.mkn{font-weight:800;margin-top:8px}';\ndocument.head.appendChild(st);\nconst E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};\nconst sec=E('section');sec.append(E('div','tag','Compare and picture it'),E('h2','','Tables and diagrams'));\nconst dv=E('div','vis');dv.append(E('b','',X.gifh));const im=E('img');im.src=X.gif;im.alt=X.gifh;dv.appendChild(im);\nconst sv=E('div');sv.innerHTML=X.svg;dv.appendChild(sv);sec.appendChild(dv);\nX.tables.forEach(([t,hd,rows])=>{const w=E('div','vis');w.appendChild(E('b','',t));const o=E('div');o.style.overflowX='auto';const tb=E('table','tb');\nconst tr=E('tr');hd.forEach(x=>tr.appendChild(E('th','',x)));tb.appendChild(tr);rows.forEach(r=>{const q=E('tr');r.forEach(x=>q.appendChild(E('td','',x)));tb.appendChild(q);});o.appendChild(tb);w.appendChild(o);sec.appendChild(w);});\nconst th=document.getElementById('theory');th.parentNode.insertBefore(sec,th.nextSibling);\n/* 10-mark practice */\nconst m=X.mk,ms=E('section','mk');ms.append(E('div','tag','Exam practice \u00b7 10 marks'),E('h2','',m.h));\nconst q=E('p');q.append(E('b','','Question: '),m.q);const ta=E('textarea');ta.placeholder='Write your answer here, then open the marking scheme and mark yourself honestly.';ta.setAttribute('aria-label','Your answer');\nconst d=E('details');d.appendChild(E('summary','','Show marking scheme and model answer (after you try)'));\nd.appendChild(E('p','','Tick each point your answer earned. Give the marks shown, no half marks.'));\nconst out=E('div','mkn','Your mark: 0 / 10');out.setAttribute('role','status');let cs=[];\nm.scheme.forEach(([t,k])=>{const l=E('label','sc');const c=E('input');c.type='checkbox';c.onchange=()=>{let s=0;cs.forEach((x,i)=>{if(x.checked)s+=m.scheme[i][1];});out.textContent='Your mark: '+s+' / 10';};cs.push(c);l.append(c,E('span','',t+' ('+k+(k>1?' marks)':' mark)')));d.appendChild(l);});\nd.append(out,E('p','','Model answer:'),E('p','',m.model));\nms.append(q,ta,d);\nconst host=document.getElementById('pgC')||document.querySelector('main');host.appendChild(ms);\n})();\nasync function JUDGE(task,u,reply){try{if((typeof pasteOnly!=='undefined'&&pasteOnly)||(typeof liveFn!=='undefined'&&!liveFn))return false;\nconst s=await getSample();const p='You are a fair marker. A student had this lab task:\\n<task>'+task+'<\/task>\\nThe student wrote this prompt:\\n<prompt>'+u+'<\/prompt>\\nClaude produced:\\n<reply>'+reply+'<\/reply>\\nDoes the output meet every requirement in the task? Ignore small wording differences and judge the requirement itself. Answer with one word: YES or NO.';\nconst r=await s(p,{model:MODEL,modelTier:\"quick\",cache:false});return /^\\s*YES\\b/i.test(r.text);}catch(e){return false;}}\n<\/script>\n<\/body>\n<\/html>\n", "prompt-gym": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Prompt Gym: Prompt Engineering 101<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f2f5ef;--grid:#d5e0d3;--surface:#fff;--ink:#16212b;--mute:#4c5b66;--blue:#1f5fd6;--hi:#ffd84d;--ok:#1f8f5a;--bad:#d23b41;--okbg:#dff3e7;--badbg:#fbe0e1;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10171d;--grid:#1c2830;--surface:#18222a;--ink:#eaf0f3;--mute:#9fb0ba;--blue:#7fb0ff;--ok:#52d196;--bad:#ff7b80;--okbg:#14382a;--badbg:#44191c}}\n:root[data-theme=\"dark\"]{--bg:#10171d;--grid:#1c2830;--surface:#18222a;--ink:#eaf0f3;--mute:#9fb0ba;--blue:#7fb0ff;--ok:#52d196;--bad:#ff7b80;--okbg:#14382a;--badbg:#44191c}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:17px/1.55 \"Atkinson Hyperlegible\",system-ui,sans-serif}\nmain{max-width:840px;margin:0 auto;padding:20px 16px 60px}\nh1,h2,h3{font-family:\"Bricolage Grotesque\",system-ui,sans-serif;line-height:1.1;margin:0}\nh1{font-size:clamp(2.1rem,7vw,3.4rem);font-weight:800;letter-spacing:-.02em}\nh2{font-size:1.5rem;font-weight:800}h3{font-size:1.15rem;font-weight:800} r(--mute);font-size:.9rem}\n<\/style>\n<\/head>\n<body>\n<main>\n<p style=\"margin:0 0 10px\"><a href=\"hub.html\" style=\"border:2px solid var(--ink);padding:2px 10px;font-weight:700;font-size:.9rem;background:var(--surface);color:var(--ink);text-decoration:none\">\u2190 Module 2 hub<\/a><\/p>\n<h1>Prompt Gym<\/h1>\n<p class=\"sub\">Prompt Engineering 101, hands on. These exercises follow Anthropic's interactive tutorial. Write a prompt, run it on Claude, and the reply turns green when it passes.<\/p>\n<div class=\"bar\"><span class=\"pill\" id=\"score\" aria-live=\"polite\">0 / 17 passed<\/span><span class=\"pill m\">Model: Claude Haiku 5.5 (same for everyone)<\/span><\/div>\n<div class=\"warn\" id=\"warn\">Live Claude isn't available here. Open this page from its claude.ai link while signed in to your Claude account.<\/div>\n<div id=\"list\"><\/div>\n<p class=\"note\">Replies can vary a little between runs, so if a pass fails by a hair, run it again. System prompts here are sent as instructions placed before your message. Chapter 6 also has a second exercise (6.2) and Chapter 8 a Matterport exercise in the full tutorial sheet; 8.2 here is a class variant.<\/p>\n<\/main>\n<script>\nconst MODEL=\"claude-haiku-5-5\";\nconst liveErr=e=>{try{console.error(e)}catch(_){}const c=e&&e.code;const m={not_granted:'Claude was not allowed. Reload this page and click Allow when the permission box appears.',rate_limited:'Too many runs. Wait a moment, then try again.',not_declared:'This page is not set up for live Claude. Please report this problem.',capability_disabled:'Live Claude is switched off for this page. Please report this problem.',capability_removed:'Live Claude was removed from this page. Please report this problem.',sampling_disabled:'Live Claude is turned off for your account or organisation.',session_expired:'Your session expired. Reload the page.',upstream_error:'Claude is busy. Try again in a moment.',empty_completion:'Claude sent an empty reply. Run it again.',refused:'Claude declined this prompt. Change the wording.',queue_overflow:'Too many requests are waiting. Try again shortly.',cancelled:'Stopped.',invalid_request:'The request was not accepted. Please report this problem.'}[c];return (m||\"Couldn't reach Claude. Try again.\")+(c?' (code: '+c+')':(e&&e.message?' ('+String(e.message).slice(0,80)+')':''));};\n/* live Claude when available, otherwise paste mode (works in any phone browser) */\nconst HARD=['not_granted','sampling_disabled','capability_disabled','capability_removed','not_declared'];\nlet liveFn=null,liveDone=false,pasteOnly=false;\n(async()=>{try{if(typeof claude!=='undefined'&&claude&&claude.use)liveFn=await claude.use(\"sample\");}catch(e){liveFn=null;}liveDone=true;})();\nconst wait=ms=>new Promise(r=>setTimeout(r,ms));\nconst pasteQ=[];let pasteBusy=false;\nfunction pasteAsk(p,o){return new Promise((res,rej)=>{pasteQ.push({p,o,res,rej});pump();});}\nfunction pump(){if(pasteBusy||!pasteQ.length)return;pasteBusy=true;const {p,o,res,rej}=pasteQ.shift();\nconst ov=document.createElement('div');ov.setAttribute('role','dialog');ov.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:12px';\nconst bx=document.createElement('div');bx.style.cssText='background:var(--sf,var(--surface,#fff));color:var(--ink,#16212b);border:2px solid var(--ink,#16212b);box-shadow:5px 5px 0 var(--ink,#16212b);max-width:660px;width:100%;padding:16px;margin:8px 0';\nconst mkb=(t,bg)=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='font:inherit;cursor:pointer;border:2px solid var(--ink,#16212b);padding:7px 14px;font-weight:700;margin:8px 8px 0 0;background:'+bg+';color:#16212b';return b;};\nconst ta=()=>{const t=document.createElement('textarea');t.style.cssText='width:100%;min-height:120px;font:14px ui-monospace,Menlo,monospace;padding:8px;border:2px solid var(--ink,#16212b);background:var(--bg,#f2f5ef);color:var(--ink,#16212b)';return t;};\nconst h=document.createElement('div');h.style.cssText='font-weight:800;font-size:1.15rem;margin-bottom:6px';h.textContent='Run this in your own Claude chat';\nconst ex=document.createElement('p');ex.style.margin='0 0 8px';ex.textContent=\"Live Claude isn't available in this view. 1) Copy the prompt. 2) Open Claude (use Haiku if you can choose), paste it and send. 3) Paste Claude's reply below.\";\nconst pt=ta();pt.readOnly=true;pt.value=p;const cp=mkb('Copy prompt','#ffd84d');\ncp.onclick=async()=>{try{await navigator.clipboard.writeText(p);cp.textContent='Copied \u2713';}catch(e){pt.focus();pt.select();cp.textContent='Press copy on your keyboard';}};\nconst l2=document.createElement('div');l2.style.cssText='font-weight:700;margin-top:10px';l2.textContent=\"Claude's reply\";\nconst rt=ta();const ok=mkb('Use this reply','#ffd84d');const no=mkb('Cancel','transparent');const em=document.createElement('div');em.style.cssText='font-weight:700;min-height:1.2em';\nconst done=()=>{ov.remove();pasteBusy=false;};\nok.onclick=()=>{const t=rt.value.trim();if(!t){em.textContent='Paste the reply first.';return;}done();try{o&&o.onText&&o.onText({text:t,delta:t});}catch(e){}res({text:t,truncated:false});pump();};\nno.onclick=()=>{done();const q=pasteQ.splice(0);rej({code:'cancelled',message:'cancelled'});q.forEach(x=>x.rej({code:'cancelled',message:'cancelled'}));};\nbx.append(h,ex,pt,cp,l2,rt,em,ok,no);ov.appendChild(bx);document.body.appendChild(ov);setTimeout(()=>{try{rt.focus();}catch(e){}},50);}\nasync function getSample(){return async(p,o)=>{\n if(!liveDone)await Promise.race([(async()=>{while(!liveDone)await wait(100);})(),wait(8000)]);\n if(liveFn&&!pasteOnly){try{return await liveFn(p,o);}catch(e){if(HARD.includes(e&&e.code))pasteOnly=true;else throw e;}}\n return pasteAsk(p,o);};}\nconst W=t=>t.trim().split(/\\s+/).filter(Boolean).length;\nconst EM=[\"Hi -- My Mixmaster4000 is producing a strange noise when I operate it. It also smells a bit smoky and plasticky, like burning electronics.  I need a replacement.\",\"Can I use my Mixmaster 4000 to mix paint, or is it only meant for mixing food?\",\"I HAVE BEEN WAITING 4 MONTHS FOR MY MONTHLY CHARGES TO END AFTER CANCELLING!!  WTF IS GOING ON???\",\"How did I get here I am not good with computer.  Halp.\"];\nconst EXP=[\"B\",\"AD\",\"C\",\"D\"];\nconst emails=EM.map(e=>({EMAIL:e}));\nconst MESSY=\"Hia its me i have a q about dogs jkaerjv {{QUESTION}} jklmvca tx it help me muhch much atx fst fst answer short short tx\";\nconst DOC=\"<document>\\nDatasheet excerpt, regulator LM-X1: input voltage 7 to 35 V. Output 5 V, plus or minus 2%, up to 1.5 A. Operating temperature -40 to 85 C.\\n<\/document>\\n\\nWhat is the maximum input voltage and the dropout voltage?\";\nconst CH={\n1:[\"Basic prompt structure\",\"Prompts have roles. A system prompt sets standing rules; the user message is the task.\"],\n2:[\"Being clear and direct\",\"Claude has no context beyond your words. Say what you want, and what you don't want.\"],\n3:[\"Assigning roles\",\"A role changes tone, focus and sometimes accuracy.\"],\n4:[\"Separating data and instructions\",\"Use {{variables}} for data and XML tags to fence it off from your instructions.\"],\n5:[\"Formatting output and speaking for Claude\",\"Tell Claude the exact output shape. In the tutorial you start Claude's reply for it; here you will instruct how it must begin.\"],\n6:[\"Thinking step by step\",\"Let Claude think out loud before it answers. Thinking only counts when it is written out.\"],\n7:[\"Using examples (few-shot)\",\"Show input and output pairs so Claude copies the pattern and format.\"],\n8:[\"Avoiding hallucinations\",\"Give Claude an out, and make it quote evidence before answering.\"],\n9:[\"Complex prompts\",\"Combine role, tags, thinking and output format in one prompt.\"]};\nconst EX=[\n{ch:1,id:\"1.1\",t:\"Counting to three\",task:\"Write a prompt that gets Claude to count to three.\",hint:\"Just ask clearly. The checker looks for 1, 2 and 3.\",u:{text:\"\"},ok:R=>/1/.test(R[0])&&/2/.test(R[0])&&/3/.test(R[0])},\n{ch:1,id:\"1.2\",t:\"System prompt\",task:\"Edit the system prompt so Claude answers like a 3-year-old child.\",hint:\"Ask for it in plain words. The checker looks for 'soo' or 'giggles'.\",s:\"\",u:{text:\"How big is the sky?\",lock:1},ok:R=>/soo|giggles/i.test(R[0])},\n{ch:2,id:\"2.1\",t:\"Spanish\",task:\"Edit the system prompt so Claude answers in Spanish.\",hint:\"Ask for Spanish as you would ask a person. The checker looks for 'hola'.\",s:\"\",u:{text:\"Hello Claude, how are you?\",lock:1},ok:R=>/hola/i.test(R[0])},\n{ch:2,id:\"2.2\",t:\"One player only\",task:\"Edit the question so Claude replies with only the name of one specific player: no other words or punctuation.\",hint:\"How would you ask a person to reply with only the name? Exact match: Michael Jordan.\",u:{text:\"Who is the best basketball player of all time?\"},ok:R=>R[0].trim()===\"Michael Jordan\"},\n{ch:2,id:\"2.3\",t:\"Write a story\",task:\"Edit the prompt so Claude writes a story of 800 words or more.\",hint:\"Models count words poorly, so overshoot. This one can take a while.\",u:{text:\"Can you write me a story?\"},ok:R=>W(R[0])>=800},\n{ch:3,id:\"3.1\",t:\"Math correction\",task:\"Give Claude a role in the system prompt so it notices that the algebra below is wrong.\",hint:\"Pick a role that suits careful maths. The checker looks for 'incorrect' or 'not correct'.\",s:\"\",u:{text:\"Is this equation solved correctly below?\\n\\n2x - 3 = 9\\n2x = 6\\nx = 3\",lock:1},ok:R=>/incorrect|not correct/i.test(R[0])},\n{ch:4,id:\"4.1\",t:\"Haiku topic\",task:\"Write a prompt template using {{TOPIC}} that makes Claude write a haiku about the topic. Test input: Pigs.\",hint:\"Use the exact text {{TOPIC}} where the topic should go.\",tpl:1,u:{text:\"\"},inp:[{TOPIC:\"Pigs\"}],need:c=>c.includes(\"{{TOPIC}}\")?\"\":\"Your template must contain {{TOPIC}}.\",ok:R=>/pig/i.test(R[0])&&R[0].trim().split(\"\\n\").length>=3},\n{ch:4,id:\"4.2\",t:\"Dog question with typos\",task:\"Fix the messy template by adding XML tags around the variable. Change nothing else. Test input: 'ar cn brown?'\",hint:\"What happens if {{QUESTION}} sits inside tags such as <question>\u2026<\/question>? The checker looks for 'brown'.\",tpl:1,u:{text:MESSY},inp:[{QUESTION:\"ar cn brown?\"}],need:c=>/<(\\w+)>[\\s\\S]*\\{\\{QUESTION\\}\\}[\\s\\S]*<\\/\\1>/.test(c)?\"\":\"Wrap {{QUESTION}} in XML tags.\",ok:R=>/brown/i.test(R[0])},\n{ch:4,id:\"4.3\",t:\"Dog question, no tags\",task:\"Fix the same template WITHOUT tags, by deleting only one or two words or pieces of text.\",hint:\"Remove the least sensible bits one at a time. Keep {{QUESTION}}.\",tpl:1,u:{text:MESSY},inp:[{QUESTION:\"ar cn brown?\"}],need:c=>c.includes(\"<\")?\"No tags allowed here.\":!c.includes(\"{{QUESTION}}\")?\"Keep {{QUESTION}} in the template.\":c.length>=MESSY.length?\"Delete something from the template.\":\"\",ok:R=>/brown/i.test(R[0])},\n{ch:5,id:\"5.1\",t:\"Steph Curry GOAT\",task:\"Edit the prompt so Claude argues for Stephen Curry as the best player. Tell Claude exactly how its reply must begin.\",hint:\"Give it the opening words, e.g. 'Begin your reply with: Stephen Curry is the best because'. The checker looks for 'Warrior'.\",u:{text:\"Who is the best basketball player of all time? Please choose one specific player.\"},ok:R=>/Warrior/i.test(R[0])},\n{ch:5,id:\"5.2\",t:\"Two haikus\",task:\"Edit the template so Claude writes two haikus about {{ANIMAL}}, each inside its own <haiku> tags. Test input: cats.\",hint:\"First ask for two, then fix the formatting.\",tpl:1,u:{text:\"Please write a haiku about {{ANIMAL}}. Put it in <haiku> tags.\"},inp:[{ANIMAL:\"cats\"}],ok:R=>(R[0].match(/<haiku>[\\s\\S]*?<\\/haiku>/g)||[]).length>=2&&R[0].trim().split(\"\\n\").length>5},\n{ch:5,id:\"5.3\",t:\"Two haikus, two animals\",task:\"Edit the template to write two haikus about two different animals, using {{ANIMAL1}} and {{ANIMAL2}}. Test inputs: Cat and Dog.\",hint:\"Break it into steps: add the second variable, then ask for two haikus.\",tpl:1,u:{text:\"Please write a haiku about {{ANIMAL1}}. Put it in <haiku> tags.\"},inp:[{ANIMAL1:\"Cat\",ANIMAL2:\"Dog\"}],need:c=>c.includes(\"{{ANIMAL1}}\")&&c.includes(\"{{ANIMAL2}}\")?\"\":\"Use both {{ANIMAL1}} and {{ANIMAL2}}.\",ok:R=>(R[0].match(/<haiku>/g)||[]).length>=2&&/cat/i.test(R[0])&&/dog/i.test(R[0])},\n{ch:6,id:\"6.1\",t:\"Classifying emails\",task:\"Write a template that classifies each email into (A) Pre-sale question, (B) Broken or defective item, (C) Billing question, (D) Other (please explain). Use chain of thought. The reply must include the letter in parentheses. Four emails will be tested.\",hint:\"List the four categories in the prompt, let Claude reason first, and keep {{EMAIL}}. Email 2 may be A or D. Bonus: why is email 2 the trickiest?\",tpl:1,u:{text:\"Please classify this email as either green or blue: {{EMAIL}}\"},inp:emails,need:c=>c.includes(\"{{EMAIL}}\")?\"\":\"Keep {{EMAIL}} in the template.\",ok:R=>R.every((t,i)=>{const m=t.match(/\\(([A-D])\\)/);return m&&EXP[i].includes(m[1])})},\n{ch:7,id:\"7.1\",t:\"Email formatting via examples\",task:\"Use few-shot examples so each reply ENDS with just the category letter (A to D). Same four emails and categories as 6.1.\",hint:\"Write 2 or more example emails with answers in the exact format you want. Keep the categories and {{EMAIL}}.\",tpl:1,u:{text:\"Please classify this email as either green or blue: {{EMAIL}}\"},inp:emails,need:c=>c.includes(\"{{EMAIL}}\")?\"\":\"Keep {{EMAIL}} in the template.\",ok:R=>R.every((t,i)=>EXP[i].includes(t.trim().slice(-1)))},\n{ch:8,id:\"8.1\",t:\"Beyonc\u00e9 hallucination\",task:\"Edit the prompt so Claude doesn't invent an answer. (Renaissance is her seventh album, so there is no eighth.)\",hint:\"What should Claude do if it doesn't know? The checker wants 'I do not', 'I don't' or 'Unfortunately', and no '2022'.\",u:{text:\"In what  Read the reply and ask what your prompt left open.\";\n   if(pass){d.classList.add('pass');done.add(i);}\n   document.getElementById('score').textContent=done.size+\" / \"+EX.length+\" passed\";\n  }catch(err){msg.textContent=liveErr(err);}\n  finally{run.disabled=false;}\n };\n list.appendChild(d);\n});\n<\/script>\n<script>document.addEventListener(\"click\",function(e){var a=e.target.closest&&e.target.closest(\"a[href]\");if(!a)return;var h=a.getAttribute(\"href\");var m=h&&h.match(/^([a-z0-9-]+)\\.html$/i);if(m){e.preventDefault();parent.postMessage({go:m[1]},\"*\");}});<\/script><\/body>\n<\/html>\n"};
