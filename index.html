ample\", \"If it is missing\"], [[\"1 Clarity\", \"Context, goal, tone\", \"3-line notice about the Lab 4 change\", \"Reader is confused\"], [\"2 Creativity\", \"A debate or story frame\", \"Argue for and against open-book exams\", \"Flat, forgettable text\"], [\"3 Context\", \"Style for the situation\", \"Casual to a friend, formal to the HoD\", \"Right facts, wrong tone\"], [\"4 Language\", \"Language, tone, what to keep\", \"Hindi safety notice, units unchanged\", \"Unnatural or inaccurate translation\"], [\"5 Ethics\", \"Neutral, fair wording\", \"\u201cSkills of a good engineer\u201d, not \u201ca male engineer\u201d\", \"Biased output at scale\"]]], [\"Four advantages and the prompt ingredient that delivers each\", [\"Advantage\", \"Key ingredient\", \"Check the output for\"], [[\"Question answering\", \"\u201cUse only this text; say so if not stated\u201d\", \"Invented facts\"], [\"Creative writing\", \"Form, length, tone, ending\", \"Imagination and fit to the brief\"], [\"Machine translation\", \"Audience, tone, what stays unchanged\", \"Natural wording, units kept\"], [\"Coding\", \"Task, edge cases, tests\", \"Correctness: always run it\"]]]], \"mk\": {\"h\": \"10-mark practice: communication\", \"q\": \"Discuss the function of prompt engineering in communication. Explain any four of its five roles with an example each, and state one ethical risk. (10 marks)\", \"scheme\": [[\"Defines prompt engineering in communication (prompt sets context, goal and tone)\", 1], [\"Role 1: clarity and specificity, with an example\", 2], [\"Role 2: creativity and engagement, with an example\", 2], [\"Role 3: adapting to context, with an example\", 2], [\"Role 4: overcoming linguistic barriers, with an example\", 2], [\"Ethical risk named (bias or manipulation) and one way to reduce it\", 1]], \"model\": \"Prompt engineering is writing prompts that tell an LLM the context, goal and tone of a message. Clarity: giving context and tone avoids misunderstanding, e.g. \u201cWrite a 3-line notice: Lab 4 moves to Wednesday, 2 pm, polite.\u201d Creativity: debate or story prompts make exchanges engaging, e.g. \u201cArgue for and against open-book exams, then ask the reader a question.\u201d Context: the same news needs a casual tone for a friend and a formal tone for the Head of Department. Language: a prompt can ask for Hindi, keep unit symbols unchanged and use a polite tone, so the translation is natural. Ethical risk: a prompt such as \u201cdescribe a typical male engineer\u201d builds in bias; reduce it by wording the prompt neutrally, e.g. \u201cdescribe the skills of a good engineer\u201d, and by reviewing the output.\"}};\nconst st=document.createElement('style');\nst.textContent='.tb{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--sf)}.tb th,.tb td{border:2px solid var(--ink);padding:6px 9px;text-align:left;vertical-align:top;color:var(--ink)}.tb th{background:var(--hi);color:#16212b}.tb td:first-child{font-weight:700}.vis{border:2px solid var(--ink);background:var(--sf);padding:12px;margin:12px 0}.vis img{max-width:100%;height:auto;display:block;margin:6px 0;border:2px solid var(--ink)}.mk textarea{width:100%;min-height:150px;font:inherit;padding:8px;border:2px solid var(--ink);background:var(--bg);color:var(--ink)}.mk label.sc{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-weight:400}.mkn{font-weight:800;margin-top:8px}';\ndocument.head.appendChild(st);\nconst E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};\nconst sec=E('section');sec.append(E('div','tag','Compare and picture it'),E('h2','','Tables and diagrams'));\nconst dv=E('div','vis');dv.append(E('b','',X.gifh));const im=E('img');im.src=X.gif;im.alt=X.gifh;dv.appendChild(im);\nconst sv=E('div');sv.innerHTML=X.svg;dv.appendChild(sv);sec.appendChild(dv);\nX.tables.forEach(([t,hd,rows])=>{const w=E('div','vis');w.appendChild(E('b','',t));const o=E('div');o.style.overflowX='auto';const tb=E('table','tb');\nconst tr=E('tr');hd.forEach(x=>tr.appendChild(E('th','',x)));tb.appendChild(tr);rows.forEach(r=>{const q=E('tr');r.forEach(x=>q.appendChild(E('td','',x)));tb.appendChild(q);});o.appendChild(tb);w.appendChild(o);sec.appendChild(w);});\nconst th=document.getElementById('theory');th.parentNode.insertBefore(sec,th.nextSibling);\n/* 10-mark practice */\nconst m=X.mk,ms=E('section','mk');ms.append(E('div','tag','Exam practice \u00b7 10 marks'),E('h2','',m.h));\nconst q=E('p');q.append(E('b','','Question: '),m.q);const ta=E('textarea');ta.placeholder='Write your answer here, then open the marking scheme and mark yourself honestly.';ta.setAttribute('aria-label','Your answer');\nconst d=E('details');d.appendChild(E('summary','','Show marking scheme and model answer (after you try)'));\nd.appendChild(E('p','','Tick each point your answer earned. Give the marks shown, no half marks.'));\nconst out=E('div','mkn','Your mark: 0 / 10');out.setAttribute('role','status');let cs=[];\nm.scheme.forEach(([t,k])=>{const l=E('label','sc');const c=E('input');c.type='checkbox';c.onchange=()=>{let s=0;cs.forEach((x,i)=>{if(x.checked)s+=m.scheme[i][1];});out.textContent='Your mark: '+s+' / 10';};cs.push(c);l.append(c,E('span','',t+' ('+k+(k>1?' marks)':' mark)')));d.appendChild(l);});\nd.append(out,E('p','','Model answer:'),E('p','',m.model));\nms.append(q,ta,d);\nconst host=document.getElementById('pgC')||document.querySelector('main');host.appendChild(ms);\n})();\nasync function JUDGE(task,u,reply){try{if((typeof pasteOnly!=='undefined'&&pasteOnly)||(typeof liveFn!=='undefined'&&!liveFn))return false;\nconst s=await getSample();const p='You are a fair marker. A student had this lab task:\\n<task>'+task+'<\/task>\\nThe student wrote this prompt:\\n<prompt>'+u+'<\/prompt>\\nClaude produced:\\n<reply>'+reply+'<\/reply>\\nDoes the output meet every requirement in the task? Ignore small wording differences and judge the requirement itself. Answer with one word: YES or NO.';\nconst r=await s(p,{model:MODEL,modelTier:\"quick\",cache:false});return /^\\s*YES\\b/i.test(r.text);}catch(e){return false;}}\n<\/script>\n<\/body>\n<\/html>\n", "unit-2-3-part1": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Module 2 \u00b7 Unit 2.3 (part 1) \u00b7 Prompt Engineering Techniques<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f2f5ef;--grid:#d5e0d3;--sf:#fff;--ink:#16212b;--mute:#4c5b66;--blue:#1f5fd6;--hi:#ffd84d;--ok:#1f8f5a;--bad:#d23b41;--okbg:#dff3e7;--badbg:#fbe0e1;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10171d;--grid:#1c2830;--sf:#18222a;--ink:#eaf0f3;--mute:#9fb0ba;--blue:#7fb0ff;--ok:#52d196;--bad:#ff7b80;--okbg:#14382a;--badbg:#44191c}}\n:root[data-theme=\"dark\"]{--bg:#10171d;--grid:#1c2830;--sf:#18222a;--ink:#eaf0f3;--mute:#9fb0ba;--blue:#7fb0ff;--ok:#52d196;--bad:#ff7b80;--okbg:#14382a;--badbg:#44191c}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:17px/1.55 \"Atkinson Hyperlegible\",system-ui,sans-serif}\nmain{max-width:860px;margin:0 auto;padding:18px 16px 60px}\nh1,h2,h3{font-family:\"Bricolage Grotesque\",system-ui,sans-serif;line-height:1.1;margin:0}\nh1{font-size:clamp(2rem,6.5vw,3.2rem);font-weight:800;letter-spacing:-.02em}\nh2{font-size:1.45rem;font-weight:800}h3{font-size:1.1rem}\n.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}\n.nav span,.nav a{border:2px solid var(--ink);padding:2px 10px;font-weight:700;font-size:.9rem;background:var(--sf);color:var(--ink);text-decoration:none}\n.nav .on{background:var(--hi);color:#16212b}.nav .off{opacity:.45}\n.sub{color:var(--mute);max-width:64ch;margin:6px 0}\nsection{background:var(--sf);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:18px;margin-top:26px}\n.tag{font-weight:700;color:var(--blue);font-size:.9rem}\nbutton{font:inherit;cursor:pointer;color:var(--ink)}\n:focus-visible{outline:3px solid var(--blue);outline-offset:2px}\ndetails{border:2px solid var(--ink);background:var(--bg);margin:8px 0;padding:8px 12px}\nsummary{cursor:pointer;font-weight:700}details p{margin:6px 0}\n.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0;font-weight:700}\n.flow span{border:2px solid var(--ink);background:var(--hi);color:#16212b;padding:3px 10px}\n.q{font-weight:700;margin:12px 0 4px}\n.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}\n.opt{border:2px solid var(--ink);background:var(--sf);padding:8px 14px;font-weight:700;text-align:left}\n.opt:hover:not(:disabled){background:var(--hi);color:#16212b}\n.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}\n.fb{font-weight:700;min-height:1.4em}\nlabel{display:block;font-weight:700;font-size:.88rem;color:var(--mute);margin:8px 0 2px}\ntextarea,.lock{width:100%;font:inherit;font-family:ui-monospace,Menlo,monospace;font-size:.88rem;padding:8px;border:2px solid var(--ink);background:var(--bg);color:var(--ink)}\ntextarea{min-height:110px;resize:vertical}.lock{border-style:dashed;white-space:pre-wrap}\n.run{margin-top:10px;border:2px solid var(--ink);background:var(--hi);color:#16212b;font-weight:700;padding:8px 18px;box-shadow:3px 3px 0 var(--ink)}\n.run:disabled{opacity:.6;cursor:wait}\n.hint{margin-left:8px;border:2px solid var(--ink);background:var(--sf);padding:6px 12px}\n.lab{border:2px solid var(--ink);padding:14px;margin-top:14px;background:var(--bg)}.lab.pass{border-color:var(--ok)}\n.trio{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}\n.resp{margin-top:8px;padding:8px 10px;border:2px dashed var(--ink);white-space:pre-wrap;font-size:.9rem;min-height:2.6em;background:var(--sf)}\n.resp.ok{background:var(--okbg);border:2px solid var(--ok)}.resp.no{background:var(--badbg);border:2px solid var(--bad)}\n.pill{background:var(--hi);color:#16212b;border:2px solid var(--ink);padding:1px 10px;font-weight:700;font-size:.85rem}\n.score{margin-top:10px;font-weight:700}\n<\/style>\n<\/head>\n<body>\n<main>\n<div class=\"nav\"><a href=\"hub.html\">Module 2 hub<\/a><a href=\"unit-2-1.html\">2.1 Intro<\/a><a href=\"unit-2-2.html\">2.2 Communication<\/a><span class=\"on\">2.3 Techniques (1/2)<\/span><a href=\"unit-2-3-part2.html\">2.3 (2/2)<\/a><a href=\"unit-2-4.html\">2.4 Creative<\/a><a href=\"unit-2-5.html\">2.5 Writing<\/a><\/div>\n<h1>Unit 2.3 (part 1): Prompt Engineering Techniques<\/h1>\n<p class=\"sub\">Module 2 \u00b7 2 lecture hours across two pages \u00b7 Part 1: the techniques overview, the instructions prompt, and zero-, one- and few-shot prompting. Part 2 covers self-consistency and the prompt gallery.<\/p>\n<details class=\"tutg\" style=\"margin:10px 0 16px;border:2px solid var(--ink);background:var(--sf);padding:8px 12px\"><summary style=\"cursor:pointer;font-weight:700\">What do the \u201cTutorial Ch.\u201d notes mean?<\/summary><p>They point to Anthropic's free <i>Prompt Engineering Interactive Tutorial<\/i> (<a href=\"https://github.com/anthropics/prompt-eng-interactive-tutorial\" target=\"_blank\" rel=\"noopener\">github.com/anthropics/prompt-eng-interactive-tutorial<\/a>). You do not need it: each note names the idea, and this key explains it. \u201cEx 2.1\u201d means Chapter 2, exercise 1.<\/p><div style=\"overflow-x:auto\"><table class=\"tb\"><tr><th>Ch.<\/th><th>Idea<\/th><\/tr>\n<tr><td>1<\/td><td>Basic structure: a prompt is a message, optionally with a system prompt<\/td><\/tr><tr><td>2<\/td><td>Be clear and direct: say exactly what you want<\/td><\/tr><tr><td>3<\/td><td>Assign a role to change tone and skill<\/td><\/tr><tr><td>4<\/td><td>Separate data from instructions with tags<\/td><\/tr><tr><td>5<\/td><td>Format the output, even start the reply for the model<\/td><\/tr><tr><td>6<\/td><td>Let the model think step by step<\/td><\/tr><tr><td>7<\/td><td>Use examples (few-shot)<\/td><\/tr><tr><td>8<\/td><td>Avoid hallucinations: allow \u201cI don't know\u201d<\/td><\/tr><tr><td>9<\/td><td>Combine everything into a complex prompt<\/td><\/tr><\/table><\/div><\/details><div id=\"theory\"><\/div>\n<section><div class=\"tag\">Apply it \u00b7 Scenarios<\/div><h2>Scenario questions: choose the best answer<\/h2><p class=\"sub\">Pick the best technique for each situation, then read why. More than one option may sound sensible, so read every option.<\/p><div id=\"quiz\"><\/div><div class=\"score\" id=\"qs\"><\/div><\/section>\n<section><div class=\"tag\">Apply it \u00b7 Live on Claude<\/div><h2>Three labs<\/h2>\n<p class=\"sub\">Run prompts on Claude and see the techniques at work. <span class=\"pill\">Model: Claude Haiku (same for the class)<\/span> Replies vary a little, so run again if you narrowly miss.<\/p>\n<div id=\"labbox\"><\/div><div class=\"score\" id=\"ls\"><\/div><\/section>\n<\/main>\n<script>\nconst MODEL=\"claude-haiku-5-5\";\nconst $=id=>document.getElementById(id);\nconst liveErr=e=>{try{console.error(e)}catch(_){}const c=e&&e.code;const m={not_granted:'Claude was not allowed. Reload this page and click Allow when the permission box appears.',rate_limited:'Too many runs. Wait a moment, then try again.',not_declared:'This page is not set up for live Claude. Please report this problem.',capability_disabled:'Live Claude is switched off for this page. Please report this problem.',capability_removed:'Live Claude was removed from this page. Please report this problem.',sampling_disabled:'Live Claude is turned off for your account or organisation.',session_expired:'Your session expired. Reload the page.',upstream_error:'Claude is busy. Try again in a moment.',empty_completion:'Claude sent an empty reply. Run it again.',refused:'Claude declined this prompt. Change the wording.',queue_overflow:'Too many requests are waiting. Try again shortly.',cancelled:'Stopped.',invalid_request:'The request was not accepted. Please report this problem.'}[c];return (m||\"Couldn't reach Claude. Try again.\")+(c?' (code: '+c+')':(e&&e.message?' ('+String(e.message).slice(0,80)+')':''));};\n/* live Claude when available, otherwise paste mode (works in any phone browser) */\nconst HARD=['not_granted','sampling_disabled','capability_disabled','capability_removed','not_declared'];\nlet liveFn=null,liveDone=false,pasteOnly=false;\n(async()=>{try{if(typeof claude!=='undefined'&&claude&&claude.use)liveFn=await claude.use(\"sample\");}catch(e){liveFn=null;}liveDone=true;})();\nconst wait=ms=>new Promise(r=>setTimeout(r,ms));\nconst pasteQ=[];let pasteBusy=false;\nfunction pasteAsk(p,o){return new Promise((res,rej)=>{pasteQ.push({p,o,res,rej});pump();});}\nfunction pump(){if(pasteBusy||!pasteQ.length)return;pasteBusy=true;const {p,o,res,rej}=pasteQ.shift();\nconst ov=document.createElement('div');ov.setAttribute('role','dialog');ov.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:12px';\nconst bx=document.createElement('div');bx.style.cssText='background:var(--sf,var(--surface,#fff));color:var(--ink,#16212b);border:2px solid var(--ink,#16212b);box-shadow:5px 5px 0 var(--ink,#16212b);max-width:660px;width:100%;padding:16px;margin:8px 0';\nconst mkb=(t,bg)=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='font:inherit;cursor:pointer;border:2px solid var(--ink,#16212b);padding:7px 14px;font-weight:700;margin:8px 8px 0 0;background:'+bg+';color:#16212b';return b;};\nconst ta=()=>{const t=document.createElement('textarea');t.style.cssText='width:100%;min-height:120px;font:14px ui-monospace,Menlo,monospace;padding:8px;border:2px solid var(--ink,#16212b);background:var(--bg,#f2f5ef);color:var(--ink,#16212b)';return t;};\nconst h=document.createElement('div');h.style.cssText='font-weight:800;font-size:1.15rem;margin-bottom:6px';h.textContent='Run this in your own Claude chat';\nconst ex=document.createElement('p');ex.style.margin='0 0 8px';ex.textContent=\"Live Claude isn't available in this view. 1) Copy the prompt. 2) Open Claude (use Haiku if you can choose), paste it and send. 3) Paste Claude's reply below.\";\nconst pt=ta();pt.readOnly=true;pt.value=p;const cp=mkb('Copy prompt','#ffd84d');\ncp.onclick=async()=>{try{await navigator.clipboard.writeText(p);cp.textContent='Copied \u2713';}catch(e){pt.focus();pt.select();cp.textContent='Press copy on your keyboard';}};\nconst l2=document.createElement('div');l2.style.cssText='font-weight:700;margin-top:10px';l2.textContent=\"Claude's reply\";\nconst rt=ta();const ok=mkb('Use this reply','#ffd84d');const no=mkb('Cancel','transparent');const em=document.createElement('div');em.style.cssText='font-weight:700;min-height:1.2em';\nconst done=()=>{ov.remove();pasteBusy=false;};\nok.onclick=()=>{const t=rt.value.trim();if(!t){em.textContent='Paste the reply first.';return;}done();try{o&&o.onText&&o.onText({text:t,delta:t});}catch(e){}res({text:t,truncated:false});pump();};\nno.onclick=()=>{done();const q=pasteQ.splice(0);rej({code:'cancelled',message:'cancelled'});q.forEach(x=>x.rej({code:'cancelled',message:'cancelled'}));};\nbx.append(h,ex,pt,cp,l2,rt,em,ok,no);ov.appendChild(bx);document.body.appendChild(ov);setTimeout(()=>{try{rt.focus();}catch(e){}},50);}\nasync function getSample(){return async(p,o)=>{\n if(!liveDone)await Promise.race([(async()=>{while(!liveDone)await wait(100);})(),wait(8000)]);\n if(liveFn&&!pasteOnly){try{return await liveFn(p,o);}catch(e){if(HARD.includes(e&&e.code))pasteOnly=true;else throw e;}}\n return pasteAsk(p,o);};}\nconst TH=[\n{h:\"Theory 1 \u00b7 Prompt engineering techniques: an overview\",s:\"Techniques are the methods used to guide what a language model produces. They can be combined. Open each part.\",flow:[\"Standard prompt\",\"Role prompting\",\"Seed-word prompting\",\"Instructions prompt\",\"Zero / one / few shot\"],p:[\n[\"Introduction\",[[\"\",\"Prompt engineering techniques are the methods used to guide the output of language models such as ChatGPT or Claude. Each technique shapes how the model generates text. Used well, they help the model produce relevant, accurate and high-quality responses across many tasks and domains, and they can be mixed to suit the task.\"]]],\n[\"Standard prompts\",[[\"Explain\",\"A plain instruction or question with no special technique added. It is the baseline that other techniques improve on. (The textbook names it without detail; this is the common meaning.)\"],[\"Example\",\"\u201cExplain what a diode does.\u201d\"]]],\n[\"Role prompting\",[[\"Explain\",\"The model is told to adopt a role or perspective, such as a tech expert, so its tone, focus and content change.\"],[\"Example\",\"\u201cYou are a tech reviewer. Explain what a diode does.\u201d\"],[\"Class link\",\"Tutorial Ch. 3 (Assigning roles), roles.\"]]],\n[\"Seed-word prompting\",[[\"Explain\",\"The prompt supplies key words or topics that the answer should focus on, for example the specific features of a smartphone.\"],[\"Example\",\"\u201cReview this phone. Focus on: battery, camera, display.\u201d\"]]],\n[\"Choosing and combining\",[[\"Explain\",\"No single technique is best everywhere. The right choice depends on the task, and several techniques are often combined, then tested and refined. The next two topics explain the instructions prompt and shot prompting.\"]]]]},\n{h:\"Theory 2 \u00b7 The instructions prompt technique\",s:\"Give the model specific instructions to follow, so the text matches the objectives and requirements of the task.\",flow:[\"State the rule\",\"Model follows it\",\"Output meets the requirement\"],p:[\n[\"Introduction\",[[\"\",\"The instructions prompt technique guides a language model by giving it specific instructions to follow. This makes the generated text line up with the objectives and requirements of the task.\"]]],\n[\"Example 1: customer service\",[[\"Instruction\",\"\u201cResponses should be professional and provide accurate information.\u201d\"],[\"Effect\",\"The model is steered toward replies that meet the criteria of professionalism and accuracy.\"]]],\n[\"Example 2: a legal document\",[[\"Instruction\",\"\u201cThe document should comply with relevant laws and regulations.\u201d\"],[\"Effect\",\"The instruction makes the draft follow legal standards and requirements.\"]]],\n[\"Combining with other techniques\",[[\"Explain\",\"Instructions can be combined with other methods for more precision and control. For a smartphone review, the instruction \u201cthe review should be unbiased and informative\u201d can be joined with role prompting (the perspective of a tech expert) and seed-word prompting (specific features). Together they give a comprehensive, insightful review.\"],[\"Class link\",\"Tutorial Ch. 2 (Clear and direct), clear and direct, and Ch. 9, where rules like \u201cif unsure, say\u2026\u201d are written as instructions. Lab 3 below.\"]]],\n[\"Conclusion\",[[\"\",\"The instructions prompt is the simplest way to control behaviour: say what the output must be like. It works best when the instructions are specific, and it becomes stronger when combined with a role and focus words.\"]]]]},\n{h:\"Theory 3 \u00b7 Zero-, one- and few-shot prompting\",s:\"\u201cShots\u201d are the examples you give. More context usually means more accurate answers.\",flow:[\"Zero shot: no example\",\"One shot: one example\",\"Few shot: a few examples\"],p:[\n[\"Introduction\",[[\"\",\"Zero-, one- and few-shot prompting give a model varying amounts of context when it answers. The \u201cshot\u201d count is the number of examples in the prompt. The approach is useful when the model must respond from limited examples or context.\"]]],\n[\"Zero-shot prompting\",[[\"Explain\",\"The user gives only an instruction, with no examples. The model relies on what it already knows.\"],[\"Example\",\"\u201cWrite a poem about nature.\u201d\"],[\"Good for\",\"Open-ended, creative tasks and seeing how well the model generalises.\"],[\"Limitation\",\"Answers can be less accurate or relevant than when examples are given.\"]]],\n[\"One-shot prompting\",[[\"Explain\",\"The user supplies a single example, and the model uses it to produce its response. The textbook's example is giving one sentence from a paragraph when asking for a summary.\"],[\"Good for\",\"Cases where only one example or little context is available.\"],[\"Limitation\",\"Its success depends on the task's complexity and the quality of the example. A harder task may need more.\"]]],\n[\"Few-shot prompting\",[[\"Explain\",\"The user supplies a small number of examples, and the model uses them to respond. The textbook's example is giving a few sentences about a smartphone's features before asking for a review.\"],[\"Good for\",\"More accurate and relevant answers than zero or one shot, because the model sees more of the task's nuances.\"],[\"Limitation\",\"It still depends on the quality and relevance of the examples, which must be representative. You may need to experiment with how many to use and what kind.\"]]],\n[\"In practice (tutorial)\",[[\"Explain\",\"In the tutorial, few-shot means writing input and output pairs in the exact format you want, then ending with the new input. Include the trickier cases, because examples teach the format and the answer.\"],[\"Example\",\"Q: How much does a Mixmaster4000 cost? A: A  |  Q: My mixer will not turn on. A: B  |  Q: {new email} A:\"],[\"Class link\",\"Tutorial Ch. 7 (Using examples), Ex 7.1. Lab 1 and Lab 2 below.\"]]],\n[\"Conclusion\",[[\"\",\"Choose the number of shots by the task: zero for open-ended work, one when examples are scarce, and few for accuracy and format control. In every case, good examples matter more than many examples.\"]]]]}];\nTH.forEach((t,ti)=>{const s=document.createElement('section');const tg=document.createElement('div');tg.className='tag';tg.textContent=t.h.split(' \u00b7 ')[0];\nconst h=document.createElement('h2');h.textContent=t.h.split(' \u00b7 ')[1];const sb=document.createElement('p');sb.className='sub';sb.textContent=t.s;s.append(tg,h,sb);\nconst fl=document.createElement('div');fl.className='flow';t.flow.forEach((f,i)=>{if(i)fl.append('\u2192');const sp=document.createElement('span');sp.textContent=f;fl.appendChild(sp);});s.appendChild(fl);\nt.p.forEach(([sm,rows],i)=>{const d=document.createElement('details');if(i===0&&ti===0)d.open=true;const su=document.createElement('summary');su.textContent=sm;d.appendChild(su);\nrows.forEach(([l,x])=>{const p=document.createElement('p');if(l){const b=document.createElement('b');b.textContent=l+': ';p.appendChild(b);}p.append(x);d.appendChild(p);});s.appendChild(d);});\n$('theory').appendChild(s);});\n/* scenarios */\nconst QZ=[[\"A support team classifies tickets as billing, bug or feature. A zero-shot prompt gives \u201cBilling issue\u201d, \u201cit's a bug!\u201d and \u201cFeature\u201d for similar tickets. Which change fixes the inconsistent format at the lowest cost?\", [\"Add the role \u201csenior engineer\u201d\", \"Add three few-shot examples, one per label, showing the exact label format\", \"Add the seed words billing, bug, feature\", \"Add \u201cplease be consistent\u201d\"], 1, \"Examples teach the exact format. A role changes perspective, seed words set focus and a vague instruction does not show the pattern.\"], [\"A paralegal assistant must never give legal advice and must cite clause numbers in every summary. Which technique states those rules most directly?\", [\"A standard prompt with a short question\", \"Zero-shot prompting\", \"Seed-word prompting with the words clause and law\", \"An instructions prompt, optionally combined with a role\"], 3, \"Rules about what the output must or must not do are the job of an instructions prompt. A role can support it, but seed words only set the focus.\"], [\"You wrote one example that labels a review as positive. The model now labels sarcastic reviews wrongly. What is the best next step?\", [\"Add more examples that include sarcastic cases, moving to few-shot\", \"Delete the example and go zero-shot\", \"Make the single example longer\", \"Add a role, \u201cfilm critic\u201d\"], 0, \"One-shot may not be enough for a hard case. Representative examples, including the tricky category, are what few-shot needs.\"], [\"Prompt 1: \u201cWrite about the new phone.\u201d Prompt 2: \u201cYou are a gadget reviewer. Focus on battery, camera and price. Be unbiased.\u201d Which mapping of the extra elements is correct?\", [\"Role sets the focus, seed words set the tone, instructions set the examples\", \"Role sets the rules, seed words set the format, instructions set the perspective\", \"Role sets the perspective, seed words set the focus, instructions set the rules\", \"Role sets the examples, seed words set the length, instructions set the language\"], 2, \"The role gives the perspective, the seed words give the focus, and \u201cbe unbiased\u201d is an instruction about the output.\"], [\"Your few-shot examples are all polite emails. The model mislabels angry emails. Which principle explains this?\", [\"Few-shot always lowers accuracy\", \"Examples must be representative of real inputs, so add angry cases\", \"The examples were too short\", \"Zero-shot would not have this problem, so switch\"], 1, \"Examples define what the model learns. If they miss a category, the model has no pattern for it.\"], [\"A team will translate tricky legal sentences into Hindi in production. Zero-shot, one-shot and few-shot versions all handle an easy test sentence well. Which is the best choice?\", [\"Zero-shot, because it is cheapest\", \"One-shot, because one example is always enough\", \"Any of them, because they are equivalent\", \"Few-shot with representative hard examples plus instructions on tone and what must stay unchanged\"], 3, \"An easy test does not show the difference. For difficult, high-stakes input, representative examples plus clear instructions give more control.\"]];\nlet qd=0,qc=0;\nQZ.forEach(([q,o,a,e])=>{const d=document.createElement('div');const h=document.createElement('div');h.className='q';h.textContent=q;\nconst w=document.createElement('div');w.className='opts';const f=document.createElement('div');f.className='fb';let dn=false;\no.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{if(dn)return;dn=true;qd++;\nif(i===a){qc++;b.classList.add('right');f.textContent='\u2713 '+e;}else{b.classList.add('wrong');w.children[a].classList.add('right');f.textContent='\u2717 '+e;}\n$('qs').textContent=`Answered ${qd} of ${QZ.length}. Correct: ${qc}.`+(qd===QZ.length?` Score: ${Math.round(qc/QZ.length*100)}%.`:'');};w.appendChild(b);});\nd.append(h,w,f);$('quiz').appendChild(d);});\n/* labs */\nconst CATS=\"(A) Pre-sale question\\n(B) Broken or defective item\\n(C) Billing question\\n(D) Other (please explain)\";\nconst EM=[\"Hi -- My Mixmaster4000 is producing a strange noise when I operate it. It also smells a bit smoky and plasticky, like burning electronics.  I need a replacement.\",\"Can I use my Mixmaster 4000 to mix paint, or is it only meant for mixing food?\",\"I HAVE BEEN WAITING 4 MONTHS FOR MY MONTHLY CHARGES TO END AFTER CANCELLING!!  WTF IS GOING ON???\",\"How did I get here I am not good with computer.  Halp.\"];\nconst EXP=[\"B\",\"AD\",\"C\",\"D\"];\nconst MAIL=EM[1];\nconst ZERO=\"Classify this email into one category. Reply with only the letter.\\n\\n\"+CATS+\"\\n\\nEmail: \"+MAIL;\nconst ONE=\"Classify this email into one category. Reply with only the letter.\\n\\n\"+CATS+\"\\n\\nExample:\\nEmail: My blender will not turn on.\\nAnswer: B\\n\\nEmail: \"+MAIL+\"\\nAnswer:\";\nconst FEW=\"Classify this email into one category. Reply with only the letter.\\n\\n\"+CATS+\"\\n\\nExamples:\\nEmail: How much does a Mixmaster4000 cost?\\nAnswer: A\\n\\nEmail: My blender will not turn on.\\nAnswer: B\\n\\nEmail: Why was I charged twice this month?\\nAnswer: C\\n\\nEmail: Please remove me from your mailing list.\\nAnswer: D\\n\\nEmail: \"+MAIL+\"\\nAnswer:\";\nlet sample=null,ldone=new Set();\nasync function ensure(){if(!sample)sample=await getSample();return sample;}\nasync function call(p,box){const r=await sample(p,{model:MODEL,modelTier:\"quick\",cache:false,onText:({text})=>{box.textContent=text;}});box.textContent=r.text;return r.text;}\nconst err=e=>liveErr(e);\nconst NOLIVE='Live Claude is not available here. Open this page from its claude.ai link while signed in.';\nfunction mk(L){const d=document.createElement('div');d.className='lab';const h=document.createElement('h3');h.textContent=L.t;const p=document.createElement('p');p.className='sub';p.textContent=L.task;d.append(h,p);return d;}\n/* lab 1: trio */\n(function(){const d=mk({t:\"Lab 1: Zero vs one vs few shot\",task:\"Same email (\u201cCan I use my Mixmaster 4000 to mix paint\u2026?\u201d), three prompts. Edit them if you like, run all three, and compare. A reply ends with just a letter when the format is right.\"});\nconst g=document.createElement('div');g.className='trio';const T=[],R=[];\n[[\"Zero-shot\",ZERO],[\"One-shot\",ONE],[\"Few-shot\",FEW]].forEach(([n,v])=>{const c=document.createElement('div');const l=document.createElement('label');l.textContent=n;const t=document.createElement('textarea');t.value=v;const r=document.createElement('div');r.className='resp';c.append(l,t,r);g.appendChild(c);T.push(t);R.push(r);});\nconst run=document.createElement('button');run.className='run';run.textContent='Run all three';const m=document.createElement('div');m.className='fb';m.setAttribute('role','status');d.append(g,run,m);\nrun.onclick=async()=>{run.disabled=true;m.textContent='Claude is thinking\u2026';R.forEach(r=>{r.className='resp';r.textContent='';});\ntry{if(!await ensure()){m.textContent=NOLIVE;return;}\nconst out=await Promise.all(T.map((t,i)=>call(t.value,R[i])));\nout.forEach((t,i)=>{R[i].className='resp '+(/^[A-D]$/.test(t.trim().slice(-1))&&t.trim().length<=3?'ok':'no');});\nm.textContent='Green = reply is only a letter. Did more examples change the format or the answer? Discuss.';}\ncatch(e){m.textContent=err(e);}finally{run.disabled=false;}};\n$('labbox').appendChild(d);})();\n/* labs 2 and 3 */\nconst LABS=[\n{t:\"Lab 2: Few-shot classifier (Tutorial Ex 7.1)\",task:\"Edit the template so every reply ENDS with only the category letter, for all four emails. Include the categories and at least two examples, and keep {{EMAIL}}.\",hint:\"Write example emails with answers in the exact format you want, include the trickier categories, and keep {{EMAIL}} at the end. Email 2 may be A or D.\",u:\"Please classify this email as either green or blue: {{EMAIL}}\",inp:EM.map(e=>({EMAIL:e})),\n need:u=>u.includes(\"{{EMAIL}}\")?\"\":\"Keep {{EMAIL}} in the template.\",ok:R=>R.every((t,i)=>EXP[i].includes(t.trim().slice(-1)))},\n{t:\"Lab 3: Combine three techniques\",task:\"Write one prompt that gives Claude an instruction (the review must be unbiased and informative), a role (a tech expert), and focus words (battery and camera) to review a new smartphone.\",hint:\"Use the words \u201cunbiased\u201d and \u201cinformative\u201d, start with \u201cYou are\u2026\u201d, and name battery and camera.\",u:\"\",\n ok:(R,u)=>/unbiased/i.test(u)&&/informative/i.test(u)&&/you are|act as/i.test(u)&&/battery/i.test(R[0])&&/camera/i.test(R[0])&&R[0].trim().split(/\\s+/).length>=40}];\nLABS.forEach((L,i)=>{const d=mk(L);d.classList.add('l2');\nconst lb=document.createElement('label');lb.textContent=L.inp?'Prompt template (edit this)':'Your prompt (edit this)';const ta=document.createElement('textarea');ta.value=L.u;d.append(lb,ta);\nconst bw=document.createElement('div');const run=document.createElement('button');run.className='run';run.textContent='Run on Claude';const hb=document.createElement('button');hb.className='hint';hb.textContent='Hint';bw.append(run,hb);d.appendChild(bw);\nconst msg=document.createElement('div');msg.className='fb';msg.setAttribute('role','status');const out=document.createElement('div');d.append(msg,out);\nhb.onclick=()=>{msg.textContent='Hint: '+L.hint;};\nrun.onclick=async()=>{const u=ta.value.trim();if(!u){msg.textContent='Fill in the box first.';return;}const bad=L.need?L.need(u):'';if(bad){msg.textContent=bad;return;}\nrun.disabled=true;out.innerHTML='';msg.textContent='Claude is thinking\u2026';\ntry{if(!await ensure()){msg.textContent=NOLIVE;return;}\nconst inp=L.inp||[{}],R=[],boxes=[];\nfor(let k=0;k<inp.length;k++){const b=document.createElement('div');b.className='resp';out.appendChild(b);boxes.push(b);let p=u;for(const v in inp[k])p=p.split(\"{{\"+v+\"}}\").join(inp[k][v]);R.push(await call(p,b));}\nlet ok=L.ok(R,u);if(!ok){msg.textContent='Checking the replies against the task\u2026';ok=await JUDGE(L.task,u,R.map((x,i)=>'Reply '+(i+1)+': '+x).join('\\n'));}boxes.forEach(b=>b.classList.add(ok?'ok':'no'));msg.textContent=ok?'\u2713 Passed.':'\u2717 Not yet. Read the replies and tighten your prompt.';\nif(ok){d.classList.add('pass');ldone.add(i);}$('ls').textContent=`Graded labs passed: ${ldone.size} of ${LABS.length}`;}\ncatch(e){msg.textContent=err(e);}finally{run.disabled=false;}};\n$('labbox').appendChild(d);});\n<\/script>\n<script>document.addEventListener(\"click\",function(e){var a=e.target.closest&&e.target.closest(\"a[href]\");if(!a)return;var h=a.getAttribute(\"href\");var m=h&&h.match(/^([a-z0-9-]+)\\.html$/i);if(m){e.preventDefault();parent.postMessage({go:m[1]},\"*\");}});<\/script>\n<script>\n(function(){\nconst X= le=\\\"fill:var(--ink);font:700 13px system-ui,sans-serif\\\">Several: few-shot<\\/text><text x=\\\"342\\\" y=\\\"175\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">teaches format and edge cases; costs more to write<\\/text><line x1=\\\"212\\\" y1=\\\"101\\\" x2=\\\"327\\\" y2=\\\"162\\\" style=\\\"stroke:var(--ink);stroke-width:2\\\" marker-end=\\\"url(#ar)\\\"/><\\/svg>\", \"tables\": [[\"Zero-shot vs one-shot vs few-shot\", [\"\", \"Zero-shot\", \"One-shot\", \"Few-shot\"], [[\"Examples in prompt\", \"0\", \"1\", \"2 or more\"], [\"Strength\", \"Fast, flexible\", \"Shows the format once\", \"Most accurate and consistent\"], [\"Risk\", \"Less accurate or off-format\", \"Hard tasks need more\", \"Examples must be representative; takes effort\"], [\"Use when\", \"Simple, open tasks\", \"One good sample exists\", \"Format or tricky cases matter\"]]], [\"Standard, role, seed-word and instructions prompts\", [\"Technique\", \"What it does\", \"Example\"], [[\"Standard\", \"Plain question or task\", \"\u201cExplain what a diode does.\u201d\"], [\"Role prompting\", \"Sets perspective, tone and focus\", \"\u201cYou are a tech reviewer. Explain what a diode does.\u201d\"], [\"Seed-word prompting\", \"Sets the focus with key words\", \"\u201cReview the phone. Focus: battery, camera, price.\u201d\"], [\"Instructions prompt\", \"States the rules the output must follow\", \"\u201cBe unbiased and informative; cite clause numbers.\u201d\"]]]], \"mk\": {\"h\": \"10-mark practice: techniques\", \"q\": \"Compare zero-shot, one-shot and few-shot prompting. Give an example of each and explain how an instructions prompt can be combined with them. (10 marks)\", \"scheme\": [[\"Zero-shot defined (no examples) with an example\", 2], [\"One-shot defined (one example) with an example\", 2], [\"Few-shot defined (several examples) with an example\", 2], [\"Comparison: accuracy, flexibility and effort or risk of each\", 2], [\"Instructions prompt explained and combined with a technique (role, seed words or examples)\", 2]], \"model\": \"Zero-shot prompting gives no examples, e.g. \u201cClassify this ticket as billing, bug or feature.\u201d It is flexible but can be less accurate. One-shot gives one example before the new input, e.g. \u201cTicket: card charged twice \u2192 billing. Ticket: app crashes on login \u2192\u201d which shows the pattern, though a hard task may need more. Few-shot gives several examples, including tricky ones, so the model copies the exact format and handles edge cases; the cost is the effort of writing representative examples. An instructions prompt states rules such as \u201cbe professional and accurate\u201d. It combines well with the others: for a smartphone review we can add the instruction \u201cunbiased and informative\u201d, a role (tech reviewer) and few-shot samples to fix the format.\"}};\nconst st=document.createElement('style');\nst.textContent='.tb{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--sf)}.tb th,.tb td{border:2px solid var(--ink);padding:6px 9px;text-align:left;vertical-align:top;color:var(--ink)}.tb th{background:var(--hi);color:#16212b}.tb td:first-child{font-weight:700}.vis{border:2px solid var(--ink);background:var(--sf);padding:12px;margin:12px 0}.vis img{max-width:100%;height:auto;display:block;margin:6px 0;border:2px solid var(--ink)}.mk textarea{width:100%;min-height:150px;font:inherit;padding:8px;border:2px solid var(--ink);background:var(--bg);color:var(--ink)}.mk label.sc{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-weight:400}.mkn{font-weight:800;margin-top:8px}';\ndocument.head.appendChild(st);\nconst E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};\nconst sec=E('section');sec.append(E('div','tag','Compare and picture it'),E('h2','','Tables and diagrams'));\nconst dv=E('div','vis');dv.append(E('b','',X.gifh));const im=E('img');im.src=X.gif;im.alt=X.gifh;dv.appendChild(im);\nconst sv=E('div');sv.innerHTML=X.svg;dv.appendChild(sv);sec.appendChild(dv);\nX.tables.forEach(([t,hd,rows])=>{const w=E('div','vis');w.appendChild(E('b','',t));const o=E('div');o.style.overflowX='auto';const tb=E('table','tb');\nconst tr=E('tr');hd.forEach(x=>tr.appendChild(E('th','',x)));tb.appendChild(tr);rows.forEach(r=>{const q=E('tr');r.forEach(x=>q.appendChild(E('td','',x)));tb.appendChild(q);});o.appendChild(tb);w.appendChild(o);sec.appendChild(w);});\nconst th=document.getElementById('theory');th.parentNode.insertBefore(sec,th.nextSibling);\n/* 10-mark practice */\nconst m=X.mk,ms=E('section','mk');ms.append(E('div','tag','Exam practice \u00b7 10 marks'),E('h2','',m.h));\nconst q=E('p');q.append(E('b','','Question: '),m.q);const ta=E('textarea');ta.placeholder='Write your answer here, then open the marking scheme and mark yourself honestly.';ta.setAttribute('aria-label','Your answer');\nconst d=E('details');d.appendChild(E('summary','','Show marking scheme and model answer (after you try)'));\nd.appendChild(E('p','','Tick each point your answer earned. Give the marks shown, no half marks.'));\nconst out=E('div','mkn','Your mark: 0 / 10');out.setAttribute('role','status');let cs=[];\nm.scheme.forEach(([t,k])=>{const l=E('label','sc');const c=E('input');c.type='checkbox';c.onchange=()=>{let s=0;cs.forEach((x,i)=>{if(x.checked)s+=m.scheme[i][1];});out.textContent='Your mark: '+s+' / 10';};cs.push(c);l.append(c,E('span','',t+' ('+k+(k>1?' marks)':' mark)')));d.appendChild(l);});\nd.append(out,E('p','','Model answer:'),E('p','',m.model));\nms.append(q,ta,d);\nconst host=document.getElementById('pgC')||document.querySelector('main');host.appendChild(ms);\n})();\nasync function JUDGE(task,u,reply){try{if((typeof pasteOnly!=='undefined'&&pasteOnly)||(typeof liveFn!=='undefined'&&!liveFn))return false;\nconst s=await getSample();const p='You are a fair marker. A student had this lab task:\\n<task>'+task+'<\/task>\\nThe student wrote this prompt:\\n<prompt>'+u+'<\/prompt>\\nClaude produced:\\n<reply>'+reply+'<\/reply>\\nDoes the output meet every requirement in the task? Ignore small wording differences and judge the requirement itself. Answer with one word: YES or NO.';\nconst r=await s(p,{model:MODEL,modelTier:\"quick\",cache:false});return /^\\s*YES\\b/i.test(r.text);}catch(e){return false;}}\n<\/script>\n<\/body>\n<\/html>\n", "unit-2-3-part2": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Module 2 \u00b7 Unit 2.3 (part 2) \u00b7 Self-Consistency and the Prompt Gallery<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{--bg:#f2f5ef;--grid:#d5e0d3;--sf:#fff;--ink:#16212b;--mute:#4c5b66;--blue:#1f5fd6;--hi:#ffd84d;--ok:#1f8f5a;--bad:#d23b41;--okbg:#dff3e7;--badbg:#fbe0e1;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#10171d;--grid:#1c2830;--sf:#18222a;--ink:#eaf0f3;--mute:#9fb0ba;--blue:#7fb0ff;--ok:#52d196;--bad:#ff7b80;--okbg:#14382a;--badbg:#44191c}}\n:root[data-theme=\"dark\"]{--bg:#10171d;--grid:#1c2830;--sf:#18222a;--ink:#eaf0f3;--mute:#9fb0ba;--blue:#7fb0ff;--ok:#52d196;--bad:#ff7b80;--okbg:#14382a;--badbg:#44191c}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:17px/1.55 \"Atkinson Hyperlegible\",system-ui,sans-serif}\nmain{max-width:860px;margin:0 auto;padding:18px 16px 60px}\nh1,h2,h3{font-family:\"Bricolage Grotesque\",system-ui,sans-serif;line-height:1.1;margin:0}\nh1{font-size:clamp(2rem,6.5vw,3.2rem);font-weight:800;letter-spacing:-.02em}\nh2{font-size:1.45rem;font-weight:800}h3{font-size:1.1rem}\n.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}\n.nav span,.nav a{border:2px solid var(--ink);padding:2px 10px;font-weight:700;font-size:.9rem;background:var(--sf);color:var(--ink);text-decoration:none}\n.nav .on{background:var(--hi);color:#16212b}.nav .off{opacity:.45}\n.sub{color:var(--mute);max-width:64ch;margin:6px 0}\nsection{background:var(--sf);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:18px;margin-top:26px}\n.tag{font-weight:700;color:var(--blue);font-size:.9rem}\nbutton{font:inherit;cursor:pointer;color:var(--ink)}\n:focus-visible{outline:3px solid var(--blue);outline-offset:2px}\ndetails{border:2px solid var(--ink);background:var(--bg);margin:8px 0;padding:8px 12px}\nsummary{cursor:pointer;font-weight:700}details p{margin:6px 0}\n.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0;font-weight:700}\n.flow span{border:2px solid var(--ink);background:var(--hi);color:#16212b;padding:3px 10px}\n.q{font-weight:700;margin:12px 0 4px}\n.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}\n.opt{border:2px solid var(--ink);background:var(--sf);padding:8px 14px;font-weight:700;text-align:left}\n.opt:hover:not(:disabled){background:var(--hi);color:#16212b}\n.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}\n.fb{font-weight:700;min-height:1.4em}\nlabel{display:block;font-weight:700;font-size:.88rem;color:var(--mute);margin:8px 0 2px}\ntextarea,.lock{width:100%;font:inherit;font-family:ui-monospace,Menlo,monospace;font-size:.88rem;padding:8px;border:2px solid var(--ink);background:var(--bg);color:var(--ink)}\ntextarea{min-height:110px;resize:vertical}.lock{border-style:dashed;white-space:pre-wrap}\n.run{margin-top:10px;border:2px solid var(--ink);background:var(--hi);color:#16212b;font-weight:700;padding:8px 18px;box-shadow:3px 3px 0 var(--ink)}\n.run:disabled{opacity:.6;cursor:wait}\n.hint{margin-left:8px;border:2px solid var(--ink);background:var(--sf);padding:6px 12px}\n.lab{border:2px solid var(--ink);padding:14px;margin-top:14px;background:var(--bg)}.lab.pass{border-color:var(--ok)}\n.trio{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}\n.resp{margin-top:8px;padding:8px 10px;border:2px dashed var(--ink);white-space:pre-wrap;font-size:.9rem;min-height:2.6em;background:var(--sf)}\n.resp.ok{background:var(--okbg);border:2px solid var(--ok)}.resp.no{background:var(--badbg);border:2px solid var(--bad)}\n.pill{background:var(--hi);color:#16212b;border:2px solid var(--ink);padding:1px 10px;font-weight:700;font-size:.85rem}\n.score{margin-top:10px;font-weight:700}\nselect{font:inherit;padding:6px;border:2px solid var(--ink);background:var(--bg);color:var(--ink)}\n<\/style>\n<\/head>\n<body>\n<main>\n<div class=\"nav\"><a href=\"hub.html\">Module 2 hub<\/a><a href=\"unit-2-1.html\">2.1 Intro<\/a><a href=\"unit-2-2.html\">2.2 Communication<\/a><a href=\"unit-2-3-part1.html\">2.3 Techniques (1/2)<\/a><span class=\"on\">2.3 (2/2)<\/span><a href=\"unit-2-4.html\">2.4 Creative<\/a><a href=\"unit-2-5.html\">2.5 Writing<\/a><\/div>\n<h1>Unit 2.3 (part 2): Self-Consistency and the Prompt Gallery<\/h1>\n<p class=\"sub\">Module 2 \u00b7 Unit 2.3 continued \u00b7 Part 2: the self-consistency prompt (as the textbook defines it) and the prompt gallery of ready-made task prompts. Learn the theory, then apply it.<\/p>\n<details class=\"tutg\" style=\"margin:10px 0 16px;border:2px solid var(--ink);background:var(--sf);padding:8px 12px\"><summary style=\"cursor:pointer;font-weight:700\">What do the \u201cTutorial Ch.\u201d notes mean?<\/summary><p>They point to Anthropic's free <i>Prompt Engineering Interactive Tutorial<\/i> (<a href=\"https://github.com/anthropics/prompt-eng-interactive-tutorial\" target=\"_blank\" rel=\"noopener\">github.com/anthropics/prompt-eng-interactive-tutorial<\/a>). You do not need it: each note names the idea, and this key explains it. \u201cEx 2.1\u201d means Chapter 2, exercise 1.<\/p><div style=\"overflow-x:auto\"><table class=\"tb\"><tr><th>Ch.<\/th><th>Idea<\/th><\/tr>\n<tr><td>1<\/td><td>Basic structure: a prompt is a message, optionally with a system prompt<\/td><\/tr><tr><td>2<\/td><td>Be clear and direct: say exactly what you want<\/td><\/tr><tr><td>3<\/td><td>Assign a role to change tone and skill<\/td><\/tr><tr><td>4<\/td><td>Separate data from instructions with tags<\/td><\/tr><tr><td>5<\/td><td>Format the output, even start the reply for the model<\/td><\/tr><tr><td>6<\/td><td>Let the model think step by step<\/td><\/tr><tr><td>7<\/td><td>Use examples (few-shot)<\/td><\/tr><tr><td>8<\/td><td>Avoid hallucinations: allow \u201cI don't know\u201d<\/td><\/tr><tr><td>9<\/td><td>Combine everything into a complex prompt<\/td><\/tr><\/table><\/div><\/details><div id=\"theory\"><\/div>\n<section><div class=\"tag\">Apply it \u00b7 Scenarios<\/div><h2>Scenario questions: choose the best answer<\/h2><p class=\"sub\">Pick the best answer for each situation, then read why. More than one option may sound sensible, so read every option.<\/p><div id=\"quiz\"><\/div><div class=\"score\" id=\"qs\"><\/div><\/section>\n<section><div class=\"tag\">Apply it \u00b7 Live on Claude<\/div><h2>Labs<\/h2>\n<p class=\"sub\">Write a prompt, run it, and the page checks the reply. <span class=\"pill\">Model: Claude Haiku (same for the class)<\/span> If live Claude is not available, the page asks you to run the prompt in your own Claude chat and paste the reply back. Replies vary a little, so run again if you narrowly miss.<\/p>\n<div id=\"labbox\"><\/div><div class=\"score\" id=\"ls\"><\/div><\/section>\n\n<\/main>\n<script>\nconst MODEL=\"claude-haiku-5-5\";\nconst $=id=>document.getElementById(id);\nconst liveErr=e=>{try{console.error(e)}catch(_){}const c=e&&e.code;const m={not_granted:'Claude was not allowed. Reload this page and click Allow when the permission box appears.',rate_limited:'Too many runs. Wait a moment, then try again.',not_declared:'This page is not set up for live Claude. Please report this problem.',capability_disabled:'Live Claude is switched off for this page. Please report this problem.',capability_removed:'Live Claude was removed from this page. Please report this problem.',sampling_disabled:'Live Claude is turned off for your account or organisation.',session_expired:'Your session expired. Reload the page.',upstream_error:'Claude is busy. Try again in a moment.',empty_completion:'Claude sent an empty reply. Run it again.',refused:'Claude declined this prompt. Change the wording.',queue_overflow:'Too many requests are waiting. Try again shortly.',cancelled:'Stopped.',invalid_request:'The request was not accepted. Please report this problem.'}[c];return (m||\"Couldn't reach Claude. Try again.\")+(c?' (code: '+c+')':(e&&e.message?' ('+String(e.message).slice(0,80)+')':''));};\n/* live Claude when available, otherwise paste mode (works in any phone browser) */\nconst HARD=['not_granted','sampling_disabled','capability_disabled','capability_removed','not_declared'];\nlet liveFn=null,liveDone=false,pasteOnly=false;\n(async()=>{try{if(typeof claude!=='undefined'&&claude&&claude.use)liveFn=await claude.use(\"sample\");}catch(e){liveFn=null;}liveDone=true;})();\nconst wait=ms=>new Promise(r=>setTimeout(r,ms));\nconst pasteQ=[];let pasteBusy=false;\nfunction pasteAsk(p,o){return new Promise((res,rej)=>{pasteQ.push({p,o,res,rej});pump();});}\nfunction pump(){if(pasteBusy||!pasteQ.length)return;pasteBusy=true;const {p,o,res,rej}=pasteQ.shift();\nconst ov=document.createElement('div');ov.setAttribute('role','dialog');ov.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:12px';\nconst bx=document.createElement('div');bx.style.cssText='background:var(--sf,var(--surface,#fff));color:var(--ink,#16212b);border:2px solid var(--ink,#16212b);box-shadow:5px 5px 0 var(--ink,#16212b);max-width:660px;width:100%;padding:16px;margin:8px 0';\nconst mkb=(t,bg)=>{const b=document.createElement('button');b.textContent=t;b.style.cssText='font:inherit;cursor:pointer;border:2px solid var(--ink,#16212b);padding:7px 14px;font-weight:700;margin:8px 8px 0 0;background:'+bg+';color:#16212b';return b;};\nconst ta=()=>{const t=document.createElement('textarea');t.style.cssText='width:100%;min-height:120px;font:14px ui-monospace,Menlo,monospace;padding:8px;border:2px solid var(--ink,#16212b);background:var(--bg,#f2f5ef);color:var(--ink,#16212b)';return t;};\nconst h=document.createElement('div');h.style.cssText='font-weight:800;font-size:1.15rem;margin-bottom:6px';h.textContent='Run this in your own Claude chat';\nconst ex=document.createElement('p');ex.style.margin='0 0 8px';ex.textContent=\"Live Claude isn't available in this view. 1) Copy the prompt. 2) Open Claude (use Haiku if you can choose), paste it and send. 3) Paste Claude's reply below.\";\nconst pt=ta();pt.readOnly=true;pt.value=p;const cp=mkb('Copy prompt','#ffd84d');\ncp.onclick=async()=>{try{await navigator.clipboard.writeText(p);cp.textContent='Copied \u2713';}catch(e){pt.focus();pt.select();cp.textContent='Press copy on your keyboard';}};\nconst l2=document.createElement('div');l2.style.cssText='font-weight:700;margin-top:10px';l2.textContent=\"Claude's reply\";\nconst rt=ta();const ok=mkb('Use this reply','#ffd84d');const no=mkb('Cancel','transparent');const em=document.createElement('div');em.style.cssText='font-weight:700;min-height:1.2em';\nconst done=()=>{ov.remove();pasteBusy=false;};\nok.onclick=()=>{const t=rt.value.trim();if(!t){em.textContent='Paste the reply first.';return;}done();try{o&&o.onText&&o.onText({text:t,delta:t});}catch(e){}res({text:t,truncated:false});pump();};\nno.onclick=()=>{done();const q=pasteQ.splice(0);rej({code:'cancelled',message:'cancelled'});q.forEach(x=>x.rej({code:'cancelled',message:'cancelled'}));};\nbx.append(h,ex,pt,cp,l2,rt,em,ok,no);ov.appendChild(bx);document.body.appendChild(ov);setTimeout(()=>{try{rt.focus();}catch(e){}},50);}\nasync function getSample(){return async(p,o)=>{\n if(!liveDone)await Promise.race([(async()=>{while(!liveDone)await wait(100);})(),wait(8000)]);\n if(liveFn&&!pasteOnly){try{return await liveFn(p,o);}catch(e){if(HARD.includes(e&&e.code))pasteOnly=true;else throw e;}}\n return pasteAsk(p,o);};}\nconst TH=[{\"h\": \"Theory 4 \u00b7 The self-consistency prompt\", \"s\": \"A way to keep generated text coherent by anchoring it to facts you supply. Open each part.\", \"flow\": [\"Choose key facts\", \"Put them in the prompt\", \"Reply stays consistent\"], \"p\": [[\"Introduction\", [[\"\", \"The self-consistency prompt is an advanced technique for keeping the text a model generates coherent and logically consistent. The prompt contains key information, statements or facts that the user wants the output to stay consistent with throughout the conversation.\"]]], [\"How it differs from an ordinary prompt\", [[\"Explain\", \"An ordinary prompt gives only a task or context. A self-consistency prompt also carries anchors: background information, established facts, opinions or constraints that matter for the topic. They guide the model to stay coherent.\"], [\"Example\", \"Textbook idea: a discussion about climate change where the prompt includes scientific data and commonly accepted principles, so replies match established knowledge.\"], [\"Engineering example\", \"\u201cFacts to keep consistent: the circuit has a 12 V battery and a 4 \u03a9 resistor. Use only these values in every step.\u201d\"]]], [\"When it is most useful\", [[\"Explain\", \"When coherence and logical consistency are crucial: educational content, technical discussions and decision-making. Anchoring the conversation to specific information helps the model give answers that are accurate, informative and in context.\"], [\"Class link\", \"Tutorial Ch. 8 (avoiding hallucinations) also gives the model the facts it must use.\"]]], [\"The balance to strike\", [[\"Explain\", \"Too much detail, or overly restrictive instructions, can limit the model's flexibility and creativity and lead to repetitive or unnatural replies. Give enough guidance, and leave the model free to write naturally within the constraints.\"]]], [\"Extra: majority-vote self-consistency (not in the textbook)\", [[\"Explain\", \"In research, the same question is asked several times and the most common answer is chosen, which makes reasoning answers more reliable. This is a different meaning of the same name. Lab 2 lets you try it. Use the textbook meaning in exams.\"]]], [\"Conclusion\", [[\"\", \"Self-consistency prompting keeps output aligned with facts you provide. It works best for technical and educational tasks, as long as the anchors are clear and not so many that they suffocate the reply.\"]]]]}, {\"h\": \"Theory 5 \u00b7 The prompt gallery\", \"s\": \"A curated set of ready-made prompts for common tasks. Open each group.\", \"flow\": [\"Generate\", \"Classify\", \"Extract\", \"Answer\", \"Summarise\", \"Edit\", \"Translate\"], \"p\": [[\"Introduction\", [[\"\", \"The prompt gallery is a curated collection of predefined prompts, grouped by task, that users can pick from and adapt. It saves time, gives clear instructions that lead to consistent, good-quality output, and is continually expanded as new needs appear. Users can also contribute their own prompts.\"]]], [\"Text generation prompts\", [[\"Explain\", \"Make the model produce text in various formats and styles: narratives, essays, product descriptions or poetry. Set the task and guidelines to fit the need.\"], [\"Example\", \"\u201cWrite a 120-word product description for a solar lamp. Friendly tone.\u201d\"]]], [\"Text classification: sentiment analysis and rating\", [[\"Explain\", \"Sentiment analysis prompts ask whether a text, such as a review, is positive or negative. Sentiment rating prompts ask for a number on a scale, such as 1 to 5 stars, which gives a finer measure.\"], [\"Example\", \"\u201cRate this review from 1 to 5. Reply with only the number.\u201d\"], [\"Lab\", \"Lab 3 below.\"]]], [\"Information extraction: relations and keywords\", [[\"Explain\", \"Relation extraction finds relationships between entities in a text, such as family links, partnerships or cause and effect. Keyword extraction pulls out the significant terms that capture the main themes, useful for tagging, search optimisation and indexing.\"], [\"Example\", \"\u201cList every person named in the text, alphabetical, comma-separated.\u201d\"], [\"Lab\", \"Lab 4 below.\"]]], [\"Question answering: closed and open domain\", [[\"Explain\", \"Closed-domain prompts answer questions within a set topic, such as a customer-support bot for a product or policy. Open-domain prompts answer questions on any topic using the model's general knowledge.\"], [\"Class link\", \"Unit 2.2 case study: a handbook-only helpdesk is closed-domain.\"]]], [\"Summarisation and editing\", [[\"Explain\", \"Summarisation prompts condense long text while keeping the key information and main ideas, for documents, news or curation. Editing prompts revise text for clarity, coherence or style, such as grammar correction, sentence restructuring or richer vocabulary.\"]]], [\"Translation and transliteration\", [[\"Explain\", \"Translation prompts convert text from one language to another, for multilingual content and cross-language communication. Transliteration prompts convert text between writing systems while keeping the pronunciation, as with names or terms.\"]]], [\"Using a gallery prompt well\", [[\"Explain\", \"Pick the category, fill in the specifics, then add the output format and limits. A gallery prompt is a starting template, not a finished prompt.\"], [\"Class link\", \"Tutorial Ch. 5 (formatting output) and Ch. 8 (give the model an out).\"]]], [\"Conclusion\", [[\"\", \"The gallery covers generation, classification, extraction, question answering, summarising, editing and translation. Knowing the categories helps you choose a starting prompt quickly and then engineer it for your task.\"]]]]}];\nTH.forEach((t,ti)=>{const s=document.createElement('section');const tg=document.createElement('div');tg.className='tag';tg.textContent=t.h.split(' \u00b7 ')[0];\nconst h=document.createElement('h2');h.textContent=t.h.split(' \u00b7 ')[1];const sb=document.createElement('p');sb.className='sub';sb.textContent=t.s;s.append(tg,h,sb);\nconst fl=document.createElement('div');fl.className='flow';t.flow.forEach((f,i)=>{if(i)fl.append('\u2192');const sp=document.createElement('span');sp.textContent=f;fl.appendChild(sp);});s.appendChild(fl);\nt.p.forEach(([sm,rows],i)=>{const d=document.createElement('details');if(i===0&&ti===0)d.open=true;const su=document.createElement('summary');su.textContent=sm;d.appendChild(su);\nrows.forEach(([l,x])=>{const p=document.createElement('p');if(l){const b=document.createElement('b');b.textContent=l+': ';p.appendChild(b);}p.append(x);d.appendChild(p);});s.appendChild(d);});\n$('theory').appendChild(s);});\nconst QZ=[[\"A physics tutoring chat uses 12 V and 4 \u03a9 in Step 1 but 10 V in Step 3. Using the textbook meaning of self-consistency, which change addresses this?\", [\"Ask the same question five times and take the most common answer\", \"Add a facts block (12 V battery, 4 \u03a9 resistor) and tell the model to use only these values in every step\", \"Add three few-shot examples of unrelated circuits\", \"Ask for a more creative explanation\"], 1, \"The textbook technique anchors output to supplied facts. Majority voting is the research meaning of the same name and does not stop one conversation drifting.\"], [\"A prompt carries 14 detailed constraints. The replies are repetitive and stiff. What does the unit advise?\", [\"Add more constraints so the model cannot drift\", \"Switch to zero-shot with no constraints at all\", \"Trim to the essential anchors and leave the model free to write naturally within them\", \"Ask the model to be more creative\"], 2, \"Too many or too restrictive anchors suffocate the reply. The balance is enough guidance with room to write naturally.\"], [\"A club wants consistent, good-quality product descriptions from many members. Which use of the prompt gallery fits best?\", [\"Pick the text-generation prompt, adapt its blanks (product, audience, length), and share it\", \"Let each member write a fresh prompt, because variety improves quality\", \"Use a classification prompt for every description\", \"Use a translation prompt first, then edit\"], 0, \"A gallery gives predefined prompts users adapt. It saves time and keeps quality consistent across people.\"], [\"Exam question: \u201cExplain self-consistency prompting.\u201d A student writes: \u201cAsk the model the same question ten times and choose the most common answer.\u201d How should a marker treat it?\", [\"Full marks, since it is correct\", \"Zero marks, since it is unrelated\", \"Full marks, since the method is in the textbook\", \"Partial marks: it is a research method with the same name, while the textbook meaning is anchoring output to supplied facts\"], 3, \"The unit separates the two meanings and says to use the textbook meaning in exams.\"], [\"Which task most needs a self-consistency prompt?\", [\"Brainstorming ten slogans\", \"A support chat that must honour the same refund-policy details across twenty turns\", \"Writing one haiku\", \"Translating a single short sentence\"], 1, \"Long conversations that must stay faithful to fixed facts are where anchors help. Open creative or one-shot tasks gain little.\"], [\"You must pull the invoice number and date from many customer emails. Which gallery group fits, and what should the prompt add?\", [\"Extract: name the fields, fix the output format, and say \u201cnot found\u201d when a field is missing\", \"Generate: ask for a creative summary of each email\", \"Classify: label each email by mood only\", \"Summarise: ask for three bullets per email\"], 0, \"Pulling named fields is extraction. Fields, format and a fallback rule make the output usable and reduce invented values.\"]];\nlet qd=0,qc=0;\nQZ.forEach(([q,o,a,e])=>{const d=document.createElement('div');const h=document.createElement('div');h.className='q';h.textContent=q;\nconst w=document.createElement('div');w.className='opts';const f=document.createElement('div');f.className='fb';let dn=false;\no.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{if(dn)return;dn=true;qd++;\nif(i===a){qc++;b.classList.add('right');f.textContent='\u2713 '+e;}else{b.classList.add('wrong');w.children[a].classList.add('right');f.textContent='\u2717 '+e;}\n$('qs').textContent=`Answered ${qd} of ${QZ.length}. Correct: ${qc}.`+(qd===QZ.length?` Score: ${Math.round(qc/QZ.length*100)}%.`:'');};w.appendChild(b);});\nd.append(h,w,f);$('quiz').appendChild(d);});\nconst LABS=[\n{t:\"Lab 1: Anchor the facts (self-consistency, textbook sense)\",task:\"Write a prompt that gives Claude these facts and asks for a short story of about four sentences that stays consistent with them: Asha is 19, studies electronics, is afraid of heights, and her lab starts at 2 pm.\",hint:\"List the facts clearly in your prompt (age 19, electronics, afraid of heights, lab at 2 pm) and say the story must stay consistent with them.\",u:\"\",\n ok:(R,u)=>/19/.test(u)&&/2\\s?pm|2:00|2 p\\.m\\./i.test(u)&&/afraid|fear/i.test(u)&&/Asha/.test(R[0])&&/2\\s?(pm|p\\.m\\.)|2:00/i.test(R[0])&&R[0].trim().split(/(?<=[.!?])\\s+/).length>=3&&R[0].trim().split(/(?<=[.!?])\\s+/).length<=6},\n{t:\"Lab 2: Majority vote (extra, not in the textbook)\",task:\"The same question runs three times. If the replies differ, the most common answer wins. Edit the prompt if you like, then run it.\",hint:\"Keep the instruction to answer with only Yes, No or Cannot tell. The correct answer is Yes: if Anne is married she looks at unmarried George, and if not, married Jack looks at her.\",u:\"Jack is looking at Anne. Anne is looking at George. Jack is married, George is not, and we don't know if Anne is married. Is a married person looking at an unmarried person? Answer with only Yes, No or Cannot tell.\",inp:[{},{},{}],\n ok:(R)=>R.filter(t=>/^\\W*yes/i.test(t.trim())).length>=2},\n{t:\"Lab 3: Gallery, sentiment rating\",task:\"Make Claude rate the review below from 1 to 5 stars, replying with only the digit.\",hint:\"Say it is a rating from 1 to 5 and that the reply must be only the number.\",u:\"\",tail:\"Review: The battery dies in two hours and the screen cracked within a week.\",\n ok:(R)=>/^[12]$/.test(R[0].trim())},\n{t:\"Lab 4: Gallery, information extraction (Tutorial appendix)\",task:\"Make Claude extract every person's name from the text below. Reply with only the names, alphabetical, separated by commas.\",hint:\"Ask for names only, alphabetical order, comma-separated, nothing else. There are five names.\",u:\"\",tail:\"Text: \u201cHey, Jesse. It's me, Erin. I'm calling about the party that Joey is throwing tomorrow. Keisha said she would come and I think Mel will be there too.\u201d\",\n ok:(R)=>R[0].split(/[,\\n]+/).map(x=>x.replace(/^[\\s\\-\\d.]+/,'').trim()).filter(Boolean).join(',').toLowerCase()===\"erin,jesse,joey,keisha,mel\"}];\n\n/* labs engine */\nlet sample=null,ldone=new Set();const gradedN=LABS.filter(l=>l.ok).length;\nasync function ensure(){if(!sample)sample=await getSample();return sample;}\nasync function call(p,box){const r=await sample(p,{model:MODEL,modelTier:\"quick\",cache:false,onText:({text})=>{box.textContent=text;}});box.textContent=r.text;return r.text;}\nconst E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};\nconst score=()=>{$('ls').textContent=`Graded labs passed: ${ldone.size} of ${gradedN}`;};\nLABS.forEach((L,i)=>{const d=E(' works\", \"svg\": \"<svg viewBox=\\\"0 0 640 165\\\" role=\\\"img\\\" style=\\\"width:100%;height:auto;max-width:700px\\\"><defs><marker id=\\\"ar\\\" viewBox=\\\"0 0 10 10\\\" refX=\\\"9\\\" refY=\\\"5\\\" markerWidth=\\\"7\\\" markerHeight=\\\"7\\\" orient=\\\"auto\\\"><path d=\\\"M0 0L10 5L0 10z\\\" style=\\\"fill:var(--ink)\\\"/><\\/marker><\\/defs><rect x=\\\"10\\\" y=\\\"20\\\" width=\\\"132\\\" height=\\\"100\\\" style=\\\"fill:var(--sf);stroke:var(--ink);stroke-width:2\\\"/><text x=\\\"76\\\" y=\\\"44\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--ink);font:700 13px system-ui,sans-serif\\\">Key facts<\\/text><text x=\\\"76\\\" y=\\\"66\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">12 V battery<\\/text><text x=\\\"76\\\" y=\\\"81\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">4 \u03a9 resistor<\\/text><line x1=\\\"144\\\" y1=\\\"70\\\" x2=\\\"170\\\" y2=\\\"70\\\" style=\\\"stroke:var(--ink);stroke-width:2\\\" marker-end=\\\"url(#ar)\\\"/><rect x=\\\"172\\\" y=\\\"20\\\" width=\\\"132\\\" height=\\\"100\\\" style=\\\"fill:var(--sf);stroke:var(--ink);stroke-width:2\\\"/><text x=\\\"239\\\" y=\\\"44\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--ink);font:700 13px system-ui,sans-serif\\\">Prompt<\\/text><text x=\\\"239\\\" y=\\\"66\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">Task + anchors:<\\/text><text x=\\\"239\\\" y=\\\"81\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">use only these<\\/text><text x=\\\"239\\\" y=\\\"96\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">values<\\/text><line x1=\\\"307\\\" y1=\\\"70\\\" x2=\\\"332\\\" y2=\\\"70\\\" style=\\\"stroke:var(--ink);stroke-width:2\\\" marker-end=\\\"url(#ar)\\\"/><rect x=\\\"335\\\" y=\\\"20\\\" width=\\\"132\\\" height=\\\"100\\\" style=\\\"fill:var(--sf);stroke:var(--ink);stroke-width:2\\\"/><text x=\\\"401\\\" y=\\\"44\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--ink);font:700 13px system-ui,sans-serif\\\">Reply<\\/text><text x=\\\"401\\\" y=\\\"66\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">Every step uses<\\/text><text x=\\\"401\\\" y=\\\"81\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">12 V and 4 \u03a9<\\/text><line x1=\\\"470\\\" y1=\\\"70\\\" x2=\\\"494\\\" y2=\\\"70\\\" style=\\\"stroke:var(--ink);stroke-width:2\\\" marker-end=\\\"url(#ar)\\\"/><rect x=\\\"498\\\" y=\\\"20\\\" width=\\\"132\\\" height=\\\"100\\\" style=\\\"fill:var(--sf);stroke:var(--ink);stroke-width:2\\\"/><text x=\\\"564\\\" y=\\\"44\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--ink);font:700 13px system-ui,sans-serif\\\">Review<\\/text><text x=\\\"564\\\" y=\\\"66\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">Too many anchors<\\/text><text x=\\\"564\\\" y=\\\"81\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">make replies stiff<\\/text><text x=\\\"320\\\" y=\\\"152\\\" text-anchor=\\\"middle\\\" style=\\\"fill:var(--mute);font:11.5px system-ui,sans-serif\\\">Diagram: anchor, generate, review<\\/text><\\/svg>\", \"tables\": [[\"Ordinary prompt vs self-consistency prompt (textbook meaning)\", [\"\", \"Ordinary prompt\", \"Self-consistency prompt\"], [[\"Contains\", \"Task or context only\", \"Task plus anchors: facts, data, opinions, constraints\"], [\"Aim\", \"An answer\", \"An answer that stays coherent and consistent with the anchors\"], [\"Best for\", \"Open, one-off requests\", \"Educational, technical and decision-making conversations\"], [\"Risk\", \"Drift or contradiction over a long chat\", \"Too many anchors give stiff, repetitive text\"]]], [\"Two meanings of \u201cself-consistency\u201d\", [\"\", \"Textbook meaning (use in exams)\", \"Research meaning (extra)\"], [[\"Idea\", \"Anchor the output to facts you supply\", \"Ask the same question several times and take the most common answer\"], [\"Goal\", \"Coherence across the conversation\", \"Reliability of reasoning answers\"], [\"Example\", \"\u201cUse only 12 V and 4 \u03a9 in every step.\u201d\", \"Run a maths question 5 times, pick the majority answer\"]]]], \"mk\": {\"h\": \"10-mark practice: self-consistency and the prompt gallery\", \"q\": \"Explain the self-consistency prompt technique and when it is most useful. Describe the prompt gallery and two benefits of using it. (10 marks)\", \"scheme\": [[\"Self-consistency prompt defined: carries key facts or constraints so output stays coherent\", 2], [\"How it differs from an ordinary prompt (anchors), with an example\", 2], [\"When most useful: educational, technical, decision-making content\", 2], [\"Balance: too many or too restrictive anchors limit flexibility\", 1], [\"Prompt gallery defined: curated, predefined prompts grouped by task that users adapt\", 2], [\"Two benefits (saves time, consistent quality, expandable or user contributions)\", 1]], \"model\": \"A self-consistency prompt keeps generated text coherent by including anchors: key facts, data or constraints that the output must stay consistent with. An ordinary prompt gives only a task. For example, \u201cFacts to keep consistent: 12 V battery, 4 \u03a9 resistor. Use only these values in every step.\u201d It is most useful when logical consistency is crucial, such as educational content, technical discussions and decision-making. The balance matters: too many anchors or very restrictive instructions can make replies repetitive and unnatural. The prompt gallery is a curated collection of predefined prompts grouped by task, such as generate, classify, extract, answer, summarise, edit and translate, that users pick and adapt. It saves time, gives consistent, good-quality output, and grows as users contribute new prompts.\"}};\nconst st=document.createElement('style');\nst.textContent='.tb{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--sf)}.tb th,.tb td{border:2px solid var(--ink);padding:6px 9px;text-align:left;vertical-align:top;color:var(--ink)}.tb th{background:var(--hi);color:#16212b}.tb td:first-child{font-weight:700}.vis{border:2px solid var(--ink);background:var(--sf);padding:12px;margin:12px 0}.vis img{max-width:100%;height:auto;display:block;margin:6px 0;border:2px solid var(--ink)}.mk textarea{width:100%;min-height:150px;font:inherit;padding:8px;border:2px solid var(--ink);background:var(--bg);color:var(--ink)}.mk label.sc{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-weight:400}.mkn{font-weight:800;margin-top:8px}';\ndocument.head.appendChild(st);\nconst E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};\nconst sec=E('section');sec.append(E('div','tag','Compare and picture it'),E('h2','','Tables and diagrams'));\nconst dv=E('div','vis');dv.append(E('b','',X.gifh));const im=E('img');im.src=X.gif;im.alt=X.gifh;dv.appendChild(im);\nconst sv=E('div');sv.innerHTML=X.svg;dv.appendChild(sv);sec.appendChild(dv);\nX.tables.forEach(([t,hd,rows])=>{const w=E('div','vis');w.appendChild(E('b','',t));const o=E('div');o.style.overflowX='auto';const tb=E('table','tb');\nconst tr=E('tr');hd.forEach(x=>tr.appendChild(E('th','',x)));tb.appendChild(tr);rows.forEach(r=>{const q=E('tr');r.forEach(x=>q.appendChild(E('td','',x)));tb.appendChild(q);});o.appendChild(tb);w.appendChild(o);sec.appendChild(w);});\nconst th=document.getElementById('theory');th.parentNode.insertBefore(sec,th.nextSibling);\n/* 10-mark practice */\nconst m=X.mk,ms=E('section','mk');ms.append(E('div','tag','Exam practice \u00b7 10 marks'),E('h2','',m.h));\nconst q=E('p');q.append(E('b','','Question: '),m.q);const ta=E('textarea');ta.placeholder='Write your answer here, then open the marking scheme and mark yourself hone
